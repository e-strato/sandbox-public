<!-- 2.1 «Новости» v57 — как v56, но абзац — как первый абзац новости: продолжает заголовок, не повторяет его (дирижёр 02.11: «размер нормальный, но не переписывать то же самое, что в заголовке»). Тексты — PARA2 в _nw2.js.
     v56 — как v55, но «Кратко» одним абзацем без пунктов-точек: 2–3 ёмких предложения, шире заголовка (дирижёр 02.11: «точки сбивают фокус внимания, лучше просто абзац»). Тексты — PARA в _nw2.js.
     v55 — как v54, но «Кратко» у каждой новости подробнее и ровнее: суть в 1–2 предложения + 2 пункта, короткие дописаны, длинная (1w Team) ужата; только факты из самих новостей (дирижёр 02.11: «чуть более подробные — во многих местах сильно короткие»). Тексты — RICH в _nw2.js.
     v54 — как v51, но суть средней длины: суть + не больше 2 пунктов; весь текст сути одного размера, 13 (дирижёр 02.11: «51 больше всего нравится; не супер длинно и не супер коротко, без изменения размера текста»).
     v51 — иконка v48 (лист пересказа), открытие на месте: суть печатается по словам, пункты появляются по одному, внизу плывёт волна. Раскрывается один раз, «Свернуть» нет: кнопка дописывает строки и уходит (дирижёр 02.11: «48 нравится; разные моменты открытия; свернуть не нужно — обновят страницу»).
     v48 — как v42, но «Подробнее» белым, своя иконка — лист с тремя строками: наклоняется в 3D, строки дописываются по одной цветом; у иконки радужное свечение, у текста при наведении пробегает цвет (дирижёр 02.11: «разные иконки, сложная анимация, как в Пикабу, с цветовым выделением и перекрутом»). Открытие — в панели («На месте» · «Карточка» · «Шторка» · «Печатает»).
     v42 — как v38, но вместо пилюли «✦ Кратко» — тихая серая «Подробнее» с иконкой под заголовком, без подложки; ✦ оживает при наведении (дирижёр 02.11).
     v38 — как v37, но кнопка «✦ Кратко» в строке (как «✦ Пикабу ИИ»: переливается, открыта — серый круг ×); суть раскрывается под заголовком: мигает курсор → проявляется суть и пункты + «Читать ›» (дирижёр 02.11: «разные варианты открытия; отдельная кнопка, как в Пикабу»).
     v37 — как v36, по созвону 02.11 §2.1 (сверено с дирижёром): время первым и живое («сейчас» → «N мин назад» → «ЧЧ:ММ» → дата);
     лого 14 перед командой и турниром в заголовке, ник игрока — ссылкой; «читают» и источник убраны; вместо ранга S/A/B/C — тир турнира «Tier 1»;
     клик по строке — «Кратко» на месте (суть + «Читать ›»), раскрыта одна; в шапке «Все новости ›»; через 3 с сверху въезжает новая новость с пометкой «Новое».
     Рендер — _nw2.js. Новости настоящие (../news/_real.js); ‼️ минуты «назад» и новая новость — пример. -->
<style>
  body{ margin:0; background:var(--w-page); color:var(--w-fg); font-family:var(--w-font); }
  .lab-board{ padding:32px 48px; }
  .is-phone .lab-board{ padding:32px 0; } .is-phone #w{ width:390px; margin:0 auto; }
</style></head>
<body><div class="lab-board"><div id="w"></div></div>
<script src="../widget-tournament-4/_data.js"></script><script src="../news/_real.js"></script><script src="_nw2.js"></script>
<script>
  const PIC = [{ v: 'mix', label: 'Как есть' }, { v: 'all', label: 'У всех' }, { v: 'none', label: 'Ни у одной' }]
  const DEV = [{ v: 'desk', label: 'Компьютер' }, { v: 'phone', label: 'Телефон' }]
  const FR = [{ v: 'on', label: 'Приходит через 3 с' }, { v: 'off', label: 'Нет' }]
  const S = { pic: 'mix', device: 'desk', fresh: 'on' }
  const w = document.getElementById('w')
  function render() { document.body.classList.toggle('is-phone', S.device === 'phone'); NW2.render(w, { pic: S.pic, phone: S.device === 'phone', fresh: S.fresh === 'on', btn: 'more', icon: 'doc', open: 'inline', reveal: 'type', pts: 2, even: true, rich: true, para2: true }) }
  window.LAB = { view: 'toolbar', go: (f, i) => { S.pic = PIC[i].v; render() }, cur: () => ({ f: 0, i: PIC.findIndex((x) => x.v === S.pic) }),
    flows: () => [{ name: 'Картинки', steps: PIC.map((x) => ({ name: x.label, what: x.label })) }],
    axes: () => [{ key: 'pic', name: 'Картинки', value: S.pic, options: PIC }, { key: 'device', name: 'Экран', value: S.device, options: DEV }, { key: 'fresh', name: 'Новая новость', value: S.fresh, options: FR }],
    set: (k, v) => { S[k] = v; render() },
    caption: () => 'Нажми «Подробнее» у новости. Новости настоящие, ‼️ минуты «назад» и новая новость — пример' }
  render()
</script>
</body></html>
