<title>v7 · Значки: чёрный знак на цвете</title>

<!-- 2.4 «Игроки по позициям» v7 — как v6, но знак чёрный на цветном квадрате (дирижёр 02.11: «не с белым знаком, а с чёрным»).
     v6 — как v5, но значки позиций сверху — как на Cyberscore: цветной квадрат с белым знаком (1 меч · 2 лук · 3 щит с молнией · 4 рука с искрой · 5 рука с плюсом), у неактивных приглушены; перерисовано по скрину Cyberscore 06.10 (сайт закрыт Cloudflare) (дирижёр 02.11: «сверху значки — как на Cyberscore»).
     v5 — как v4, но при наведении на строку остальные строки затемняются; на телефоне (наведения нет) — как v4 (дирижёр 02.11).
     v4 — как v2, но пустое место используем: виджет шире (до 1100), под ником — лого и имя команды текстом (без наведения), у героя — иконка крупнее, имя героя, винрейт полоской и числом, «14 матчей»; герои — тремя равными колонками. Уже 760 — герои иконками с цифрами под ними, как v2 (дирижёр 02.11: «столько пустого пространства — может, использовать»).
     v2 — как v1, но герои понятнее: у каждого героя под иконкой отдельно винрейт (цветом) и число матчей, между героями шире; на телефоне цифры у героев видны (наведения нет), имя команды — по нажатию на лого (дирижёр 02.11: «герой, винрейт, матчи — всё в кучу»).
     v1 — отдельный виджет (созвон 02.11 §2.4, сверено с дирижёром): позиции 1–5 сегментом со значками, как в Доте (мини-карта, подсвечена линия; у саппортов — пунктир и точка);
     строка: место · флаг · ник, после него лого команды (имя — при наведении), отдельной колонки команды нет · 3 главных героя: иконка, винрейт (цветом), матчи · рейтинг 4 цифры, второй — мелко серым (как в «Участниках» v56).
     На телефоне у героев только иконки, цифры — при наведении. Код — _pp.js (PP.render). Игроки — PARI Universe (Liquipedia); ‼️ рейтинги, герои, винрейты, матчи — пример. -->
<style>
  body{ margin:0; background:var(--w-page); color:var(--w-fg); font-family:var(--w-font); }
  .lab-board{ padding:32px 48px; }
  .is-phone .lab-board{ padding:32px 0; } .is-phone #w{ width:390px; margin:0 auto; }
</style></head>
<body><div class="lab-board"><div id="w"></div></div>
<script src="../widget-participants/_data.js"></script><script src="_pp.js"></script>
<script>
  const DEV = [{ v: 'desk', label: 'Компьютер' }, { v: 'phone', label: 'Телефон' }]
  const S = { device: 'desk' }, w = document.getElementById('w')
  function render() { const ph = S.device === 'phone'; document.body.classList.toggle('is-phone', ph); PP.render(w, { phone: ph, hv: 'wide', dim: true, ic: 'csk' }) }
  window.LAB = { view: 'toolbar', go: (f, i) => { S.device = DEV[i].v; render() }, cur: () => ({ f: 0, i: DEV.findIndex((d) => d.v === S.device) }),
    flows: () => [{ name: 'Экран', steps: DEV.map((d) => ({ name: d.label, what: d.label })) }],
    axes: () => [{ key: 'device', name: 'Экран', value: S.device, options: DEV }],
    set: (k, v) => { S[k] = v; render() },
    caption: () => 'Позиции — значками сверху; наведи (на телефоне — нажми) на лого команды — её имя. ‼️ Рейтинги, герои, винрейты — пример' }
  render()
</script>
</body></html>
