<body><div class="lab-board">
  <h1>Состояния виджета · v9 · Оси состояний</h1>
  <p class="lab-board__lead">Одна ось — где пользователь. Три значения, Подсказки не видно, пока не наведёшь мышь на то, что можно нажать.</p>

</div>
<script src="_data.js"></script><script src="_t4.js"></script><script src="../widget-states/_states.js"></script>
<script>
  document.getElementById('vals').innerHTML = S.key.map(k => `<span class="s-tag">${k.name}</span>`).join('')
  document.getElementById('row').innerHTML = S.key.map(k => `<div class="s-fr"><div class="s-why">${k.why}</div><div><div data-k="${k.id}"></div></div></div>`).join('')
  document.querySelectorAll('[data-k]').forEach(el => S.mount(el, S.by(el.dataset.k), { hint: 'hover' }))
</script>
