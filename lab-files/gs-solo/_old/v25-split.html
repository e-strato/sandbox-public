<!-- v25-split — как v33, но два подписанных блока: «Карта N» — сегмент карт, график, драфт; «О матче» — игроки и статистика к матчу; от 1920 — рядом (слева карта, справа матч), уже — друг под другом (gs-res v5, дирижёр 27.10: «V5 норм»).
     v24-draft — как v32, но драфт карты — карточкой под графиком в стиле Cyberscore: обе команды рядом, 5 героев с никами, баны перечёркнутыми; вкладки «Драфт» у графика нет (w-draft v21, дирижёр 27.10: «давай возьмём как в Cyberscore»).
     v23-island — как v31, но нижний бар на телефоне прячется, пока листаешь вниз: кнопки гаснут, остров остаётся (w-bar v14, дирижёр 27.10: «V14 берём»).
     v22-live — как v30, но Live — без паузы (в «сейчас» 33:30 пауза не идёт), а «Live · пауза» — отдельное состояние в панели (дирижёр 27.10: «заебала эта плашка, сделай её доп состоянием»).
     gs-solo v21 — как v20, но страница матча v30 (дирижёр 27.10).
     gs-solo v20 — как v19, но страница матча v29: шапка сжимается вслед за прокруткой (дирижёр 27.10).
     gs-solo v19 — как v18, но страница матча v28: «Статистика к матчу» вместо фактов и очных (дирижёр 26.10).
     gs-solo v18 — как v17, но страница матча v27: от 1920 главная колонка делится пополам (дирижёр 27.10).
     gs-solo v17 — как v16, но страница матча v26: карты матча — в главной колонке (дирижёр 27.10).
     gs-solo v16 — как v15, но страница матча v25: карты матча под шапкой — виджет из лабы w-maps (дирижёр 26.10).
     gs-solo v15 — как v14, но страница матча v24: шапка матча без вкладок (дирижёр 26.10).
     gs-solo v14 — как v13, но страница матча v23: остров нижнего бара — виджет из лабы w-bar (на компьютере — «Вопрос матча» в правой колонке) (дирижёр 26.10).
     
     gs-solo v13 — как v12, но страница матча v22: шапка матча — виджет из лабы w-header (дирижёр 26.10).
      gs-solo v12 — как v11, но страница матча v21: «Перевес по золоту» и «Игроки» — виджеты из лаб w-gold и w-players, на холсте рисуется заново под ширину (дирижёр 26.10).
      gs-solo v11 — как v10, но у каждой колонки на холсте подписана её ширина («главная колонка · 372 px»), подписи можно скрыть (?cols=0 — переключатель в панели песочницы) (дирижёр 26.10).
     v10 — как v9, но в разделе «Виджеты» песочницы ширина экрана — это само окно песочницы: «Десктоп» — 1440, «Мобилка» — 390, свою ширину — в поле справа;
     холст на всё окно, без своей ручки (дирижёр 26.10). В лабе (без ?w=) ручка остаётся — там окно всегда 1440.
     v9 — как v8, но в «Виджет» есть и шапка сайта (GoatScout, вход) — во всю ширину, как шапка матча (дирижёр 26.10).
     v8 — как v7, но порог двух колонок один — 800 (переключателя нет), и без «ушей»: колонки на всю ширину экрана, главная тянется сколько угодно,
     поля по бокам 32 на двух колонках, 12 — на одной; страница матча v20 (дирижёр 26.10).
     v7 — как v6, но в «Виджет» — все виджеты страницы матча v19 (шапка во всю ширину, главная колонка, правая), список — тот же, что у «Подписей виджетов» (дирижёр 26.10).
     Шапка встаёт во всю ширину над колонками, виджет главной — в главную, правой — в правую (на одной колонке — в неё).
     v6-bp — как v5, но порог «одна колонка → две» выбирается в панели («Порог»: 720 · 768 · 800 · 900 · 1024, по умолчанию 800) (дирижёр 26.10).
     v5 — ручка тянет ширину ЭКРАНА, а не виджета (дирижёр 26.10): на холсте видны колонки страницы, виджет стоит в своей.
     Меньше порога — одна колонка (поля 12), виджет во всю ширину; от порога — две: главная + правая 320 (между ними 16, поля 24, всё не шире 1120).
     «Перевес по золоту» — в главной колонке и перестраивается под её ширину (подписи того же размера), «Турнир» — в правой, 320.
     Страница матча (gs-match v18) строится скрыто: график — копия карточки, турнир рисуется своим кодом. Пути — от gs-match (<base>). Обвязка — ../gs-solo/_solo.js.
