     холст на всё окно, без своей ручки (дирижёр 26.10). В лабе (без ?w=) ручка остаётся — там окно всегда 1440.
     v9 — как v8, но в «Виджет» есть и шапка сайта (GoatScout, вход) — во всю ширину, как шапка матча (дирижёр 26.10).
     v8 — как v7, но порог двух колонок один — 800 (переключателя нет), и без «ушей»: колонки на всю ширину экрана, главная тянется сколько угодно,
     поля по бокам 32 на двух колонках, 12 — на одной; страница матча v20 (дирижёр 26.10).
     v7 — как v6, но в «Виджет» — все виджеты страницы матча v19 (шапка во всю ширину, главная колонка, правая), список — тот же, что у «Подписей виджетов» (дирижёр 26.10).
     Шапка встаёт во всю ширину над колонками, виджет главной — в главную, правой — в правую (на одной колонке — в неё).
     v6-bp — как v5, но порог «одна колонка → две» выбирается в панели («Порог»: 720 · 768 · 800 · 900 · 1024, по умолчанию 800) (дирижёр 26.10).
     v5 — ручка тянет ширину ЭКРАНА, а не виджета (дирижёр 26.10): на холсте видны колонки страницы, виджет стоит в своей.
     Меньше порога — одна колонка (поля 12), виджет во всю ширину; от порога — две: главная + правая 320 (между ними 16, поля 24, всё не шире 1120).
     «Перевес по золоту» — в главной колонке и перестраивается под её ширину (подписи того же размера), «Турнир» — в правой, 320.
     Страница матча (gs-match v18) строится скрыто: график — копия карточки, турнир рисуется своим кодом. Пути — от gs-match (<base>). Обвязка — ../gs-solo/_solo.js.
