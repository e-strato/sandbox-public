  (() => {

    const who = new URLSearchParams(location.search).get('who') === 'ed' ? 'ed' : 'fan'
    const phone = () => !document.body.classList.contains('is-desk')
    const place = () => { const l = document.querySelector('#main .top-l'); if (!l || document.getElementById('wp')) return
      const el = document.createElement('div'); el.id = 'wp'; l.firstElementChild ? l.firstElementChild.after(el) : l.append(el)
      WP.mount(el, { who, phone: phone(), fit: 'w4', colMode: 'icon', colLeft: true, flt: true, r10: true, pm: 'hover', dm: 'note', dn: 'line', srcIc: true, drIc: true, r2ns: true, dnum: true, coMan: true, r2: true }) }
    // «Новости» (widget-news v73) — компьютер: правая колонка под «Форматом»; телефон: в конце главной колонки
    const news = () => { if (document.getElementById('wn')) return; const r = document.querySelector('#main .top-r'), l = document.querySelector('#main .top-l'); if (!r || !l) return
      const el = document.createElement('div'); el.id = 'wn'; (phone() ? l : r).append(el); NW2.render(el, { pic: 'mix', phone: phone(), fresh: true, btn: 'more', icon: 'doc', open: 'inline', reveal: 'type', pts: 2, even: true, rich: true, para2: true, hl: 'chip', ava: true, sq: true, sm: true, pad: true, calm: true, pl: 'logos' }) }
    // «Игроки по позициям» (widget-positions v7) — в главной колонке сразу под «Участниками»
    const posw = () => { const wp = document.getElementById('wp'); if (!wp || document.getElementById('wpp')) return
      const el = document.createElement('div'); el.id = 'wpp'; el.style.marginTop = '16px'; wp.after(el); PP.render(el, { phone: phone(), hv: 'wide', dim: true, ic: 'csk' }) }
    // «Статистика героев» (widget-heroes v6) — на месте карточки из _ours.js
    const heroesw = () => { if (document.getElementById('whs')) return; const c = [...document.querySelectorAll('#main section.card')].find((x) => x.querySelector('.hd b')?.textContent === 'Статистика героев'); if (!c) return
      const el = document.createElement('div'); el.id = 'whs'; c.replaceWith(el); HS.render(el, { phone: phone(), reset: 'corner', nice: true, dim: true, sortHi: true }) }
    new MutationObserver(() => { place(); posw(); heroesw(); news() }).observe(document.getElementById('main'), { childList: true }); place(); posw(); heroesw(); news()
