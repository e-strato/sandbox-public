<html lang="ru"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>v13 · Меха-HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&family=Inter:wght@500;600&display=swap" />
<link rel="stylesheet" href="../widget-tournament/_w.css" /><link rel="stylesheet" href="../widget-tournament-5/_t5.css" /><link rel="stylesheet" href="../widget-subs-2/_s2.css" /><link rel="stylesheet" href="../widget-subs-2/_s6v6.css" /><link rel="stylesheet" href="../widget-subs-2/_s8.css" />
<link rel="stylesheet" href="../widget-transfers-2/_tr4.css" /><link rel="stylesheet" href="../widgets-unified/_type.css" /><link rel="stylesheet" href="../widgets-unified/_cons.css" />
<link rel="stylesheet" href="../widget-tournament-6/_t6.css" /><link rel="stylesheet" href="../widget-subs-3/_s3.css" /><link rel="stylesheet" href="../widget-transfers-3/_tr5.css" /><link rel="stylesheet" href="../widget-mvp-3/_m5.css" /><link rel="stylesheet" href="_uni.css" /><link rel="stylesheet" href="_th-mecha.css" />
<style>
  body{ margin:0; background:#000; color:#fafafa; font-family:'Google Sans Flex', system-ui, sans-serif; }
  .row{ display:flex; flex-wrap:wrap; align-items:flex-start; gap:32px; padding:40px 48px; zoom:2; }
  .slot{ display:flex; flex-direction:column; gap:10px; } .slot > b{ font:500 12px/16px 'Google Sans Flex', sans-serif; color:#a1a1aa; }

<!-- v13 · Меха-HUD — v2, покрашенный в стиль mecha: _th-mecha.css. Шрифты, размеры и логика — как в v2. v2 — как v1, но поверх общий слой _uni.css: значок игры 12, лого команд в строках 20 (в шапках 16), один вид сегмента, у замен наведение цветом команд, как у трансферов, у турнира — цветом тира (дирижёр 23.10). v1: Итоговые 4 виджета по созвону 23.10 рядом — для консистентности (дирижёр 23.10): турнир v11 (widget-tournament-6), замены v9 (widget-subs-3),
     трансферы v4 (widget-transfers-3), MVP v13 (widget-mvp-3). Код — из тех лаб, здесь только раскладка. «Экран» и «Зритель» — под кадром (window.LAB) -->
<body class="uni th-mecha"><div class="row" id="row"></div>
<script src="../widget-tournament-4/_data.js"></script><script src="../widget-tournament-5/_logos.js"></script><script src="../widget-tournament-5/_demo.js"></script>
<script src="../widget-subs-2/_data.js"></script><script src="../widget-subs-2/_games.js"></script><script src="../widget-subs-3/_s3data.js"></script>
<script>window.TR5_BASE = '../widget-transfers-2/'; window.MVP2_BASE = '../widget-mvp-2/'; window.TR5_CFG = { gameDate: true }</script>
<script src="../widget-transfers/_data.js"></script><script src="../widget-transfers-2/_paths.js"></script><script src="../widget-transfers-2/_mix.js"></script><script src="../widget-transfers-3/_free.js"></script>
<script src="../widget-mvp/_data.js"></script><script src="../widget-mvp-2/_paths.js"></script>
<script src="../widgets-unified/_cons.js"></script><script src="../widget-tournament-6/_t6.js"></script><script src="../widget-subs-3/_s3.js"></script><script src="../widget-transfers-3/_tr5.js"></script><script src="../widget-mvp-3/_m5.js"></script>
<script>
  // Экраны — как в «Все виджеты» (_all.js): матч в каждом виджете свой — в примере данных у одного матча нет и замен, и переходов, и MVP
  const SCR = [
    { id: 'home', name: 'На главной', why: 'Главная Dota 2 — у всех виджетов общий вид', t4: {}, s3: {}, tr: {}, mvp: {} },
    { id: 'match', name: 'В матче', why: 'Открыт матч: турнир и замены — PR — IC, трансферы — команды этого матча, MVP — Spirit — Liquid',
      t4: { match: { a: 'Power Rangers', b: 'Inner Circle x Insanity' } }, s3: { match: 'm1' }, tr: { match: { a: 'Inner Circle x Insanity', b: 'Power Rangers' } }, mvp: { match: { a: 'Team Spirit', b: 'Team Liquid' } } },
  ]
  const FAN = [{ id: 'no', name: 'Не в фэнтези' }, { id: 'yes', name: 'В фэнтези' }]
  const W = [
    { name: 'Турнир · v11', draw: (el, s) => T4.render(el, { ...s.t4, opt: { v3: true, tier: 'fill', tierEn: true, final: 'merge', dt: 'mono' } }) },
    { name: 'Замены · v9', draw: (el, s) => S3.render(el, { ...s.s3, game: 'when', big: true, plainHd: true, tint: true }) },
    { name: 'Трансферы · v4', draw: (el, s) => TR5.render(el, { ...s.tr }) },
    { name: 'MVP · v13', draw: (el, s, f) => MVPC.render(el, { ...s.mvp, mine: f, up: true, depth: true, dock: 'split' }) },
  ]
  const row = document.getElementById('row'); let cur = { s: 0, f: 0 }
  const draw = () => { row.innerHTML = W.map((w, i) => `<div class="slot"><b>${w.name}</b><div data-w="${i}"></div></div>`).join('')
    row.querySelectorAll('[data-w]').forEach(el => W[+el.dataset.w].draw(el, SCR[cur.s], FAN[cur.f].id === 'yes')) }
  window.LAB = { view: 'toolbar', go: (f, i) => { cur.s = i; draw() }, cur: () => ({ f: 0, i: cur.s }),
    flows: () => [{ name: 'Экраны', steps: SCR.map(x => ({ name: x.name, what: x.why })) }],
    axes: () => [{ key: 'screen', name: 'Экран', value: SCR[cur.s].id, options: SCR.map(x => ({ v: x.id, label: x.name })) },
      { key: 'fan', name: 'Зритель', value: FAN[cur.f].id, options: FAN.map(x => ({ v: x.id, label: x.name })) }],
    set: (k, v) => { if (k === 'screen') cur.s = SCR.findIndex(x => x.id === v); else cur.f = FAN.findIndex(x => x.id === v); draw() },
    caption: () => SCR[cur.s].why }
  draw()
</script>
<script src="_fx.js"></script>
</body></html>
