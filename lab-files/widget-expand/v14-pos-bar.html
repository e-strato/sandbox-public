<!-- v14-pos-bar — как v13, но кнопка раскрытия не в шапке справа (там «Архив» / «Смотреть все»): тонкая полоса внизу во всю ширину, в ней только стрелка; «Архив» / «Смотреть все» остаются в правом верхнем углу (дирижёр 29.10).
     v13-vs-normal — как v12, но рядом вторая колонка — те же виджеты обычные, как сейчас на странице (без сворачивания) (дирижёр 29.10).
     v12-key-info — как v11, но свёрнутый виджет показывает самое важное, а не только шапку: замены — строкой «✓ Новых расхождений нет», трансферы — последний трансфер; раскрыт — всё, без пустого места; все три свёрнуты сразу; MVP убран (дирижёр 29.10).
     v11-icon-subs-tr — как v9, но тот же значок — у замен (пустой виджет свёрнут до шапки) и трансферов (раскрыт); MVP не сворачивается (дирижёр 29.10).
     v10-icon-all — как v9, но значок с рамкой — и у других виджетов правой колонки: MVP матча свёрнут полосой (ник, команда, KDA), раскрыт — как есть (дирижёр 29.10).
     v9-icon-border — как v6, но у значка рамка вместо заливки (дирижёр 29.10).
     v6-icon — как «Свернуть составы» у «Участников»: маленький значок справа в шапке с подсказкой (дирижёр 29.10). Пример — турнир матча Vision — Spirit со страницы матча (gs-match-2 v29), под ним — места соседних виджетов. Код — _wx.js -->

<script>Object.values(T4.data.teams).forEach(t => { if (t.logo && t.logo.startsWith('img/')) t.logo = '../gs-match/' + t.logo }) // лого из данных страницы матча — от её папки
WXT4(document.getElementById('t'), { match: { a: 'Team Vision', b: 'Team Spirit' }, opt: { v3: true, tier: 'fill', tierEn: true, final: 'merge', dt: 'mono' } })
const fix = x => (typeof x === 'string' && x.startsWith('img/') ? '../gs-match/' + x : x) // фото и лого из данных страницы матча — от её папки
MVP_DATA.list.forEach(q => ['photo', 'hq', 'hero'].forEach(f => q[f] = fix(q[f]))); for (const n in MVP_DATA.teams) MVP_DATA.teams[n] = fix(MVP_DATA.teams[n])
// обычные — те же виджеты как есть, как на странице матча (gs-match/_gs.js, WIDGETS)
T4.render(document.getElementById('t0'), { match: { a: 'Team Vision', b: 'Team Spirit' }, opt: { v3: true, tier: 'fill', tierEn: true, final: 'merge', dt: 'mono' } })
S3.render(document.getElementById('s0'), { empty: true, game: 'when', big: true, plainHd: true, tint: true })
TR5.render(document.getElementById('r0'), { match: { a: 'Team Vision', b: 'Team Spirit' } })
