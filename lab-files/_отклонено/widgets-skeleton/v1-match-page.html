<!doctype html>
<html lang="ru"><head><meta charset="utf-8" />
<title>Скелетон страницы матча</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="../../кадр.css" /><link rel="stylesheet" href="../../widget-tournament/_w.css" /><link rel="stylesheet" href="../../widget-tournament-2/_t2.css" /><link rel="stylesheet" href="../../widget-tournament-3/_t3.css" />
<style>
  /* Скелетон страницы матча (созвон 20.10): один экран, 3 колонки, справа ⅓ — наши виджеты. Остальное — серые плашки. */
  body{ background:var(--w-page); }
  .sk{ background:var(--w-muted); border-radius:var(--w-r-sm); }
  .sk-l{ height:12px; border-radius:6px; background:var(--w-skel); }
  .pg{ font:400 14px/20px var(--w-font); color:var(--w-fg); }
  .pg .lab-full{ top:12px; }
  .pg-bar{ position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:24px; height:56px; padding:0 32px; background:var(--w-bg); border-bottom:1px solid var(--w-border); }
  .pg-bar b{ font-weight:600; }
  .pg-bar .w-seg{ margin:0; }
  .pg-bar .w-seg button{ flex:none; padding:0 12px; overflow:visible; }
  .pg-bar__g{ display:flex; align-items:center; gap:8px; }
  .pg-bar__g span{ font-size:12px; color:var(--w-muted-fg); }
  .pg-in{ display:grid; grid-template-columns:1fr 1fr 320px; gap:24px; max-width:1376px; margin:0 auto; padding:24px 32px; }
  .pg-hd{ grid-column:1 / 3; display:flex; align-items:center; gap:24px; height:96px; padding:0 24px; background:var(--w-bg); border:1px solid var(--w-border); border-radius:var(--w-r); }
  .pg-main{ grid-column:1 / 3; display:grid; grid-template-columns:2fr 1fr; gap:24px; }
  .pg-card{ background:var(--w-bg); border:1px solid var(--w-border); border-radius:var(--w-r); padding:16px; }
  .pg-side{ grid-column:3; grid-row:1 / 4; display:flex; flex-direction:column; gap:16px; }
  .pg-tag{ font-size:12px; line-height:16px; color:var(--w-muted-fg); margin-bottom:8px; }
  .ph{ margin:48px 32px 0; }
  .ph h2{ margin:0 0 16px; font-size:16px; line-height:24px; font-weight:600; }
  .ph__f{ width:390px; padding:16px; background:var(--w-bg); border:1px solid var(--w-border); border-radius:24px; display:flex; flex-direction:column; gap:16px; }
  .ph__f .w{ width:100%; }
</style></head>
<body><div class="pg">
  <div class="pg-bar"><b>Скелетон страницы матча</b><span class="w-cap">виджет турнира — итоговый v7</span>
  </div>
  <div class="pg-in">
    <div class="pg-hd"><div class="sk" style="width:48px;height:48px;border-radius:12px"></div><div class="sk-l" style="width:120px"></div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px"><div class="sk-l" style="width:80px;height:24px"></div><div class="sk-l" style="width:140px"></div></div>
      <div class="sk-l" style="width:120px"></div><div class="sk" style="width:48px;height:48px;border-radius:12px"></div></div>
    <div class="pg-main">
      <div class="pg-card"><div class="pg-tag">График золота + события · центр страницы</div><div class="sk" style="height:360px"></div>
        <div style="display:flex;gap:8px;margin-top:12px"><div class="sk" style="width:16px;height:16px;transform:rotate(45deg)"></div><div class="sk-l" style="flex:1;margin-top:2px"></div></div></div>
      <div style="display:flex;flex-direction:column;gap:24px">
        <div class="pg-card"><div class="pg-tag">Трансляция · маленьким окном</div><div class="sk" style="aspect-ratio:16/9"></div></div>
        <div class="pg-card"><div class="pg-tag">Прогноз по событию</div><div class="sk-l" style="width:80%"></div><div style="display:flex;gap:8px;margin-top:12px"><div class="sk" style="flex:1;height:32px"></div><div class="sk" style="flex:1;height:32px"></div></div></div>
      </div>
      <div class="pg-card" style="grid-column:1 / 3"><div class="pg-tag">Драфт / карты серии</div><div style="display:grid;grid-template-columns:repeat(10,1fr);gap:8px"><div class="sk" style="aspect-ratio:1"></div><div class="sk" style="aspect-ratio:1"></div><div class="sk" style="aspect-ratio:1"></div><div class="sk" style="aspect-ratio:1"></div><div class="sk" style="aspect-ratio:1"></div><div class="sk" style="aspect-ratio:1"></div><div class="sk" style="aspect-ratio:1"></div><div class="sk" style="aspect-ratio:1"></div><div class="sk" style="aspect-ratio:1"></div><div class="sk" style="aspect-ratio:1"></div></div></div>
    </div>
    <div class="pg-side"><div id="tw"></div><div class="pg-card"><div class="pg-tag">Другой виджет</div><div class="sk" style="height:120px"></div></div></div>
  </div>
  <div class="ph"><h2>Телефон 390 · тот же виджет по ширине экрана</h2>
    <div class="ph__f"><div class="sk" style="height:72px"></div><div class="sk" style="height:200px"></div><div id="tw2"></div><div class="sk" style="height:120px"></div></div></div>
</div>
<script src="../../widget-tournament/_full.js"></script><script src="../../widget-tournament-2/_t2.js"></script>
<script>
  // Итоговый виджет турнира — v7 из лабы «Виджет турнира · итог и рейтинг» (решение 23)
  for (const id of ['tw', 'tw2']) T2.render(document.getElementById(id), { start: 'epl', tap: 11, marks: 'arrows', live: true, sheet: 'anchor', when: 'chip', past: true, rf: 'profile-logo' })
</script>
</body></html>
