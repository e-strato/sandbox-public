<!doctype html>
<html lang="ru"><head><meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400..900&display=swap" />
<link rel="stylesheet" href="/sandbox-public/site/styles.css" /><link rel="stylesheet" href="../кадр.css" /><link rel="stylesheet" href="_v3.css" />
<style>
/* v8 · Рывок — быстрая, спортивная: всё идёт по диагонали скоса (один скос справа снизу). Полоса цвета команды за игроком,
   панель снизу с косым краем, бейджи-параллелограммы. Скорость — в формах, шрифт прямой и ровный. Шрифт один — Unbounded */
.r8 { --f-disp: 'Unbounded'; --f-ui: 'Unbounded'; --legend-glow: var(--team); --sk: polygon(.6em 0, 100% 0, calc(100% - .6em) 100%, 0 100%); }
.r8__face, .r8 .bk { font-family: 'Unbounded', sans-serif; }
.r8__face { position: absolute; inset: 0; }
.r8__plate { position: absolute; inset: 0; border-radius: var(--r); clip-path: var(--shape); overflow: hidden; background: var(--c-card-ink-2);
  box-shadow: 0 1.4em 2.6em -1em color-mix(in srgb, var(--c-black) 85%, transparent); }
.r8__sk { clip-path: var(--sk); }

/* 2 Фон: тёмный, широкая косая полоса цвета команды за игроком, логотип команды крупно */
.r8__bg { position: absolute; inset: 0;
  background:
    linear-gradient(135deg, transparent 30%, color-mix(in srgb, var(--team) 34%, transparent) 30% 52%, transparent 52%),
    linear-gradient(135deg, transparent 54%, color-mix(in srgb, var(--tier) 18%, transparent) 54% 58%, transparent 58%),
    radial-gradient(70% 45% at 50% 25%, color-mix(in srgb, var(--tier) 22%, transparent), transparent 75%),
    linear-gradient(180deg, color-mix(in srgb, var(--tier-2) 55%, var(--c-card-ink)), var(--c-card-ink) 80%); }
.r8__logo { left: 1em; top: 2.2em; width: 18em; height: 14em; background: color-mix(in srgb, var(--team) 24%, transparent); }
.r8__lines { position: absolute; inset: 0;
  background: repeating-linear-gradient(135deg, transparent 0 .9em, color-mix(in srgb, var(--c-white) 5%, transparent) .9em .96em);
  -webkit-mask: linear-gradient(180deg, var(--c-black), transparent 70%); mask: linear-gradient(180deg, var(--c-black), transparent 70%); }

/* 4 Эффекты: блеск; с Prism — вспышка бежит по диагонали; у Legend — бейдж рейтинга светится */
.r8__streak { position: absolute; inset: -20%; z-index: 3; mix-blend-mode: screen;
  background: linear-gradient(135deg, transparent 46%, color-mix(in srgb, var(--tier-hi) 55%, transparent) 50%, transparent 54%);
  translate: calc(var(--scan) - 50%) calc(var(--scan) - 50%); animation: scan 3.2s ease-in infinite; }

/* 5 Фото: туловище уходит под косую панель, свечение за головой */
.r8__halo { position: absolute; left: 9.6em; top: 6.4em; width: 13em; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--tier-hi) 55%, transparent), color-mix(in srgb, var(--team) 25%, transparent) 55%, transparent); }
.r8 .ph { left: 1.3em; top: 2em; width: 16.6em;
  -webkit-mask: linear-gradient(180deg, var(--c-black) 66%, transparent 84%); mask: linear-gradient(180deg, var(--c-black) 66%, transparent 84%); }

/* 8 Инфо (подложка): панель снизу, верхний край косой — по диагонали скоса */
.r8__panel { position: absolute; left: 0; right: 0; bottom: 0; height: 13.8em; z-index: 4;
  clip-path: polygon(0 3.2em, 100% 0, 100% 100%, 0 100%);
  background: linear-gradient(180deg, color-mix(in srgb, var(--tier-2) 45%, var(--c-card-ink)), var(--c-card-ink) 45%); }
.r8__edge { position: absolute; left: 0; right: 0; bottom: 13.8em; height: 3.2em; z-index: 5; translate: 0 100%; pointer-events: none;
  background: linear-gradient(to bottom right, transparent calc(50% - .08em), var(--tier) calc(50% - .08em) calc(50% + .08em), transparent calc(50% + .08em)); }

/* 7 Раскладка: рейтинг в бейдже-параллелограмме справа сверху, герои «в воздухе» под ним, номер карты слева сверху */
.r8__ovr { position: absolute; right: 1.1em; top: 1.1em; z-index: 7; padding: .25em .8em .3em 1em; background: var(--tier); color: var(--c-card-dark-text); }
.r8__ovr b { display: block; font-size: 2.5em; font-weight: 800; line-height: 1; letter-spacing: -.04em; }
.r8__glow { position: absolute; right: .6em; top: .6em; width: 6.4em; height: 4.4em; z-index: 6; filter: blur(.8em); background: var(--tier); animation: pulse 2.4s ease-in-out infinite; }
.r8__heroes { position: absolute; right: 1.3em; top: 5.4em; z-index: 7; display: grid; gap: .5em; justify-items: center; }
.r8__heroes div { display: grid; justify-items: center; gap: .2em; }
.r8__heroes .hero-ic { width: 3.2em; aspect-ratio: 4 / 3; clip-path: polygon(.5em 0, 100% 0, calc(100% - .5em) 100%, 0 100%); }
.r8__heroes small { font-size: .48em; font-weight: 500; line-height: 1.25; text-align: center; color: var(--c-muted); }
.r8__heroes small b { font-weight: 800; color: var(--c-white); }
.r8__serial { position: absolute; left: 1.2em; top: 1.2em; z-index: 7; line-height: 1.35; }
.r8__serial b { display: block; font-size: .66em; font-weight: 700; color: var(--tier-hi); }
.r8__serial small { display: block; font-size: .5em; font-weight: 400; color: var(--c-muted); }

/* 6 Игрок */
.r8__who { position: absolute; left: 1.4em; right: 1.4em; top: 19.6em; z-index: 6; text-align: center; }
.r8__nick { font-weight: 800; font-size: 2.2em; line-height: 1.05; letter-spacing: -.03em; }
.r8__name { display: flex; justify-content: center; align-items: center; gap: .5em; margin-top: .5em; font-size: .7em; font-weight: 400; color: var(--c-muted); }

/* 8 Инфо: роль бейджем на косом крае, статы параллелограммами строкой, команда бейджем снизу */
.r8__role { position: absolute; left: 50%; top: 17.5em; translate: -50% 0; z-index: 7; padding: .45em 1.3em; white-space: nowrap;
  font-size: .82em; font-weight: 600; background: var(--tier); color: var(--c-card-dark-text); }
.r8__role b { font-weight: 800; }
.r8__stats { position: absolute; left: 1.2em; right: 1.2em; top: 24.2em; z-index: 6; display: grid; grid-template-columns: repeat(6, 1fr); gap: .25em; }
.r8__stats span { display: grid; justify-items: center; padding: .45em 0 .4em; text-align: center; background: color-mix(in srgb, var(--tier) 12%, var(--c-card-ink-2)); }
.r8__stats b { font-size: 1.05em; font-weight: 800; line-height: 1; letter-spacing: -.03em; }
.r8__stats small { margin-top: .3em; font-size: .4em; font-weight: 500; color: var(--c-muted); }
.r8__team { position: absolute; left: 50%; bottom: 1.1em; translate: -50% 0; z-index: 6; display: flex; align-items: center; gap: .45em; white-space: nowrap;
  padding: .4em 1.1em .4em .8em; font-size: .56em; font-weight: 600; background: color-mix(in srgb, var(--tier) 18%, var(--c-card-ink)); }
.r8__team .logo { width: 1.7em; height: 1.7em; }

/* 9 Оборот: косые полосы, рейтинг бейджем-параллелограммом, статы косыми полосками, герои параллелограммами, форма косыми плашками */
.r8 .bk { box-shadow: none; padding: 1.5em 1.4em 1.4em; gap: .75em;
  background:
    linear-gradient(135deg, transparent 50%, color-mix(in srgb, var(--team) 22%, transparent) 50% 66%, transparent 66%),
    repeating-linear-gradient(135deg, transparent 0 .9em, color-mix(in srgb, var(--c-white) 4%, transparent) .9em .96em),
    linear-gradient(180deg, color-mix(in srgb, var(--tier-2) 55%, var(--c-card-ink)), var(--c-card-ink) 70%); }
.r8 .bk__top b { font-weight: 800; font-size: 1.25em; letter-spacing: -.03em; }
.r8 .bk__top em { padding: .1em .35em .12em .45em; font-size: 1.8em; letter-spacing: -.04em; background: var(--tier); color: var(--c-card-dark-text); clip-path: var(--sk); }
.r8 .bk__stats li { font-size: .62em; }
.r8 .bk__stats b { font-size: 1.15em; }
.r8 .bk__stats i, .r8 .bk__stats i::after { border-radius: 0; height: .5em; }
.r8 .bk__stats i { clip-path: polygon(.3em 0, 100% 0, calc(100% - .3em) 100%, 0 100%); }
.r8 .bk__heroes b { font-size: .7em; }
.r8 .bk__heroes em { font-size: .8em; }
.r8 .bk__heroes .hero-ic { border-radius: 0; clip-path: polygon(.4em 0, 100% 0, calc(100% - .4em) 100%, 0 100%); }
.r8 .bk__form li { border-radius: 0; clip-path: polygon(.3em 0, 100% 0, calc(100% - .3em) 100%, 0 100%); }
.r8 .bk__btn { margin-right: 2em; border-radius: 0; clip-path: var(--sk); font-weight: 700; font-size: .7em; height: 2.8em; }
</style></head>
<body><section class="section v3">
  <div class="sec-head">
    <h2 class="sec-title">v8 · Рывок</h2>
    <p class="sec-lead">Быстрая и спортивная: всё идёт по диагонали скоса. За игроком косая полоса цвета команды, у панели снизу косой край, бейджи — параллелограммы.
      Скорость передают формы, шрифт прямой и ровный — один Unbounded. С Prism по карте пробегает вспышка, у Legend светится бейдж рейтинга.</p>
  </div>
  <div id="v3"></div>
</section>
<script src="_v3.js"></script>
<script>
V3.страница({
  класс: 'r8 kc-cut',
  иерархия: [
    'Скруглённый прямоугольник с одним скосом справа снизу. Диагональ скоса задаёт все косые линии карты.',
    'Тёмный фон с широкой косой полосой цвета команды за игроком. Логотип команды крупно. С Holo — тонкие линии скорости.',
    'Контур цвета силы по форме, со скосом.',
    'Блеск редкости. С Prism по диагонали пробегает вспышка, у Legend светится бейдж рейтинга.',
    'Туловище уходит под косую панель, за головой свечение.',
    'Ник по центру, ниже флаг и настоящее имя. Шрифт прямой, без курсива.',
    'Рейтинг в бейдже-параллелограмме в правом верхнем углу. Под ним три героя прямо в воздухе: матчи и винрейт. Номер карты и сезон — слева сверху.',
    'Панель с косым краем: позиция и роль бейджем на крае, статы параллелограммами в строку, внизу команда бейджем.',
    'Свой оборот: косые полосы, рейтинг бейджем, статы косыми полосками, герои и форма параллелограммами, кнопка «Страница игрока».',
  ],
  оборот: (п, r, h) => h.оборот(п, h.контур()).replace('<div class="bk">', `<div class="bk" style="--team: var(--c-team-${п.команда})">`),
  лицо: (п, r, h) => `
<div class="r8__face" style="--team: var(--c-team-${п.команда})">
  <div class="r8__plate" data-l="1">
    <div class="r8__bg" data-l="2">
      ${h.маска(п, 'r8__logo')}
      <i class="r8__lines" data-deco="1"></i>
    </div>
    <i class="r8__halo" data-l="5"></i>
    ${h.фото(п)}
    <i class="r8__streak" data-l="4" data-deco="2"></i>
    <div class="r8__panel" data-l="8"></div>
    <i class="r8__edge" data-l="8"></i>
    ${h.блеск(r)}
  </div>
  ${h.контур()}
  <div class="r8__serial" data-l="7"><b>${h.серия(п)}</b><small>${h.СЕЗОН}</small></div>
  <i class="r8__glow" data-l="4" data-deco="3"></i>
  <div class="r8__ovr r8__sk" data-l="7"><b>${п.рейтинг}</b></div>
  <div class="r8__heroes" data-l="7">${п.герои.map((г) => `<div>${h.герой(г)}<small><b>${г[2]} М</b><br>${г[3]}%</small></div>`).join('')}</div>
  <span class="r8__role r8__sk" data-l="8"><b>Pos ${п.pos}</b> · ${h.РОЛИ[п.pos]}</span>
  <div class="r8__who" data-l="6"><div class="r8__nick">${п.ник}</div>${п.имя ? `<div class="r8__name">${h.флаг(п)}${п.имя}</div>` : ''}</div>
  <div class="r8__stats" data-l="8">${h.статы(п).map((с) => `<span class="r8__sk"><b data-v="${с.ур}">${с.v}</b><small>${с.к}</small></span>`).join('')}</div>
  <div class="r8__team r8__sk" data-l="8">${h.лого(п)}${h.команда(п)}</div>
</div>`,
})
</script>
</body></html>
