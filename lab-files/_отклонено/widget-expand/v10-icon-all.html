<!doctype html>
<html lang="ru"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>v10 · Значок у всех виджетов</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&family=Inter:wght@500;600&display=swap" />
<link rel="stylesheet" href="../widget-tournament/_w.css" /><link rel="stylesheet" href="../widget-tournament-5/_t5.css" /><link rel="stylesheet" href="../widgets-unified/_type.css" /><link rel="stylesheet" href="../widgets-unified/_cons.css" /><link rel="stylesheet" href="../widget-tournament-6/_t6.css" /><link rel="stylesheet" href="../widgets-23/_uni.css" /><link rel="stylesheet" href="../widget-mvp-3/_m5.css" /><link rel="stylesheet" href="_wx.css" />
</head>
<!-- v10-icon-all — как v9, но значок с рамкой — и у других виджетов правой колонки: MVP матча свёрнут полосой (ник, команда, KDA), раскрыт — как есть (дирижёр 29.10).
     v9-icon-border — как v6, но у значка рамка вместо заливки (дирижёр 29.10).
     v6-icon — как «Свернуть составы» у «Участников»: маленький значок справа в шапке с подсказкой (дирижёр 29.10). Пример — турнир матча Vision — Spirit со страницы матча (gs-match-2 v29), под ним — места соседних виджетов. Код — _wx.js -->
<body class="uni"><div class="wx-page">
  <div class="wx-col"><div class="wx-lbl">Правая колонка · компьютер</div><div id="t"></div><div id="m"></div><div class="wx-ph" style="height:120px">следующий виджет</div></div>
</div>
<script>window.WX = 'icon'; window.WX_ICB = true; window.MVP2_BASE = '../widget-mvp-2/'</script>
<script src="../gs-match/data/_matches.js"></script><script src="../gs-match/data/_tournament.js"></script>
<script src="../widget-tournament-4/_data.js"></script><script src="../widget-tournament-5/_logos.js"></script><script src="../widget-tournament-5/_demo.js"></script><script src="../widget-mvp/_data.js"></script><script src="../widget-mvp-2/_paths.js"></script>
<script src="../gs-match/_wfit.js"></script><script src="../widgets-unified/_cons.js"></script><script src="../widget-tournament-6/_t6.js"></script><script src="../widget-mvp-3/_m5.js"></script><script src="_wx.js"></script>
<script>Object.values(T4.data.teams).forEach(t => { if (t.logo && t.logo.startsWith('img/')) t.logo = '../gs-match/' + t.logo }) // лого из данных страницы матча — от её папки
WXMount(document.getElementById('t'), { match: { a: 'Team Vision', b: 'Team Spirit' }, opt: { v3: true, tier: 'fill', tierEn: true, final: 'merge', dt: 'mono' } })
const fix = x => (typeof x === 'string' && x.startsWith('img/') ? '../gs-match/' + x : x) // фото и лого из данных страницы матча — от её папки
MVP_DATA.list.forEach(q => ['photo', 'hq', 'hero'].forEach(f => q[f] = fix(q[f]))); for (const n in MVP_DATA.teams) MVP_DATA.teams[n] = fix(MVP_DATA.teams[n])
WXMvp(document.getElementById('m'), { mvp: { match: { a: 'Team Vision', b: 'Team Spirit' }, up: true, depth: true, dock: 'split' } })</script>
</body></html>
