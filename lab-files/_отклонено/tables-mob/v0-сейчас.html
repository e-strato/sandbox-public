<!-- Телефон: у компонентов ui/ своего телефона нет — телефон сейчас живёт в лабе страницы турнира (gs-tournament v46, TI). Она целиком, как есть -->
<main class="tm-page v0 v0-phone"><div class="tm-main">
  <h2>Страница турнира TI на телефоне — как сейчас (лаба gs-tournament v46)</h2>
  <iframe id="v0ph" data-src="../../gs-tournament/v46-hs.html?fit=1&amp;tour=ti" style="height:2400px"></iframe>
</div></main>
<script>
/* телефон: грузим страницу турнира, когда включили «Телефон 390»; высота кадра — по содержимому (тот же origin) */
(() => { const f = document.getElementById('v0ph')
  const fit = () => { try { const d = f.contentDocument; if (d && d.body) f.style.height = d.documentElement.scrollHeight + 'px' } catch (e) {} }
  f.addEventListener('load', () => { fit(); try { new ResizeObserver(fit).observe(f.contentDocument.body) } catch (e) {} })
  const on = () => { if (document.body.classList.contains('is-phone') && !f.src) f.src = f.dataset.src }
  new MutationObserver(on).observe(document.body, { attributes: true, attributeFilter: ['class'] }); on() })()
</script><script src="../../../tables-mob/_view.js"></script>
</body></html>
