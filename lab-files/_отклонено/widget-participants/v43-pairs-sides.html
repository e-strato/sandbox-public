<!-- 2.3 «Участники» v43 — как v41, но две пары в одной команде показаны иначе: первая пара — скобкой слева, вторая — скобкой справа, не накладываются (дирижёр 02.11: «два наложения не сильно лучше — ещё версии»). Смотреть на Team Liquid. ‼️ Пары — пример.
     v41 — как v40, но у команды может быть две пары — каждая своей дорожкой слева, вторая левее и голубая, линии не накладываются (Team Liquid: 1 + 4 и 2 + 5); тренер — значок-предмет из Доты на выбор в панели (Observer Ward · Gem · Aghanim · Aegis), при наведении «Тренер»; запасные (вкладка Subs) — как основной состав: позиция первой, один рейтинг (дирижёр 02.11). ‼️ Пары — пример. Код — WP.mount r10.
     v40 — как v39, но пар больше: Liquid m1CKe + Boxi, Astra OmaR + GH, GamerLegion — 4 игрока вместе (поз. 2–5), Spirit Yatoro + Larl; наведение на значок тренера — подсказка «Тренер», имя остаётся в строке (дирижёр 02.11). ‼️ Пары — пример. Код — WP.mount r9.
     v39 — как v38, но линия-скобка слева — у игроков, которые давно играют вместе (Team Liquid: m1CKe и Boxi), а не у замены; замена — снова одной строкой с тегом срока и «за …» (созвон 02.11, 2·20:03: «пара Boxi — пара m1CKe, линию между ними слева»; дирижёр 02.11). Код — WP.mount r8.
     v38 — как v37, но позиция — снова первой в строке (плашка 18), у тренера там же значок — на выбор в панели (доска с планом · гарнитура · буква C · свисток; своего значка тренера в Доте нет); частые пики и баны — не при наведении, а первой заметкой у каждой команды (кнопка «Заметки» внизу карточки) (дирижёр 02.11). Код — WP.mount r7.
     v37 — как v36, но позиция — снова справа в конце строки, как было, чуть меньше (18 вместо 20); у тренера там же — свисток; под названием команды — только Invited / Qualified; рейтинг команды со стрелкой ▲ / ▼ — справа в шапке, где был (дирижёр 02.11). Код — WP.mount r6.
     v36 — как v35, но рейтинг один (второго нет); тренер — снова строкой, вместо позиции значок свистка; под названием команды — снова Invited / Qualified и рейтинг команды со стрелкой ▲ / ▼ без числа; точек формы нет (дирижёр 02.11). Код — WP.mount r5.
     v35 — как v34 (виджет со страницы турнира: WP.mount flt, карточки по 4 в ряд), по созвону 02.11 §2.3 (сверено с дирижёром):
     рейтинг команды и игроков — четыре цифры, ближе к Elo / Glicko (1572, 1776); у игрока главный — крупно белым, второй — мелко серым, без слэша;
     позиция 1–5 — мелко и первой в строке; замена — заменённый (зачёркнут, тише) и замена друг под другом, слева линия-скобка;
     тренер — значок в шапке карточки, имя при наведении; под названием команды вместо Invited / Qualified — 5 точек формы и рейтинг со сдвигом «1572 ▲12»;
     наведение на команду (лого и имя) — частые пики и баны на турнире. Код — _wp.js (WP.mount r4) + _wp.css. ‼️ Рейтинги, форма, сдвиг, драфты, замены — пример. -->
<style>
  body{ margin:0; background:var(--w-page); color:var(--w-fg); font-family:var(--w-font); }
  .lab-board{ padding:32px 48px; } #w{ max-width:1100px; }
  .is-phone .lab-board{ padding:32px 0; } .is-phone #w{ width:390px; margin:0 auto; }

<body><div class="lab-board"><div id="w"></div></div>
<script src="../widgets-unified/_cons.js"></script>
<script>window.WP_BASE = ''</script><script src="_data.js"></script><script src="_wp.js"></script>
<script>
  const WHO = [{ v: 'fan', label: 'Зритель' }, { v: 'ed', label: 'Редактор' }], DEV = [{ v: 'desk', label: 'Компьютер' }, { v: 'phone', label: 'Телефон' }]
  const CO = [{ v: 'ward_observer', label: 'Вард' }, { v: 'gem', label: 'Гем' }, { v: 'ultimate_scepter', label: 'Аганим' }, { v: 'aegis', label: 'Аегис' }]
  const S = { who: 'fan', device: 'desk', co: 'ward_observer' }, w = document.getElementById('w')
  function render() { const ph = S.device === 'phone'; document.body.classList.toggle('is-phone', ph)
    WP.mount(w, { who: S.who, phone: ph, fit: 'w4', colMode: 'icon', colLeft: true, flt: true, r10: true, pm: 'sides', coIt: S.co }) }
  window.LAB = { view: 'toolbar', go: (f, i) => { S.device = DEV[i].v; render() }, cur: () => ({ f: 0, i: DEV.findIndex((d) => d.v === S.device) }),
    flows: () => [{ name: 'Экран', steps: DEV.map((d) => ({ name: d.label, what: d.label })) }],
    axes: () => [{ key: 'who', name: 'Кто смотрит', value: S.who, options: WHO }, { key: 'device', name: 'Экран', value: S.device, options: DEV }, { key: 'co', name: 'Значок тренера', value: S.co, options: CO }],
    set: (k, v) => { S[k] = v; render() },
    caption: () => 'Частые пики и баны — в «Заметках» внизу карточки; значок тренера — в панели. ‼️ Рейтинги, форма, драфты, замены — пример' }
  render()
</script>
