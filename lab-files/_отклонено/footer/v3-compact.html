<!doctype html>
<html lang="ru"><head><meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=Roboto+Condensed:wght@500..700&display=swap" />
<link rel="stylesheet" href="/sandbox-public/site/styles.css" /><link rel="stylesheet" href="_footer.css" />
<style>
/* v3 · Компактный: одна строка — бренд, разделы, соцсети, язык; под ней одна строка юридического. Остальное (правила, честная игра,
   помощь, о проекте) — раскрывающимися пунктами <details>: не мешает, но всё на месте. На телефоне — список-аккордеон, как в приложениях */
.f3 { margin: 12px 48px 0; padding: 18px 0 28px; border-top: 1px solid var(--c-ui-line); }
.f3__line { display: flex; align-items: center; gap: 24px; }
.f3__line nav { display: flex; flex-wrap: wrap; gap: 4px; }
.f3__line nav a { padding: 6px 10px; border-radius: 6px; color: var(--c-muted); font-size: 13.5px; font-weight: 500; }
.f3__line nav a:hover { background: var(--c-ui-item); color: var(--c-text); }
.f3__line .ft-soc { margin-left: auto; }
.f3__acc { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
.f3__acc details { border-radius: 8px; background: var(--c-ui-panel); }
.f3__acc summary { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; color: var(--c-text); font-size: 13.5px; font-weight: 600; cursor: pointer; list-style: none; }
.f3__acc summary::-webkit-details-marker { display: none; }
.f3__acc summary::after { content: '+'; color: var(--c-caption); font-size: 16px; font-weight: 400; }
.f3__acc details[open] summary::after { content: '−'; }
.f3__acc details > div { display: grid; gap: 8px; padding: 0 14px 14px; }
.f3__acc details > div p { margin: 0; }
.f3__acc details > div p b { color: var(--c-text); font-weight: 600; }
.f3__legal { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
.f3__legal .ft-fine { flex: 1; margin: 0; }
@container ft (max-width: 480px) {
  .f3 { margin: 12px 16px 0; padding: 16px 0 24px; }
  .f3__line { flex-wrap: wrap; gap: 14px; }
  .f3__line nav { order: 3; width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
  .f3__line nav a { padding: 8px 0; }
  .f3__line .ft-soc { margin-left: auto; }
  .f3__acc { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .f3__legal { flex-wrap: wrap; }
}
</style></head>
<body><div class="ft-lab" id="lab"></div>
<template id="ft">
<footer class="ft f3">
  <div class="f3__line">
    <span class="ft-brand"><i>F</i>Fantasy · Dota 2</span>
    <nav><a>Главная</a><a>Матчи</a><a>Бустеры</a><a>Коллекция</a><a>Квесты</a><a>Лидеры</a><a>История</a><a>Как это работает</a></nav>
    <div class="ft-soc"><a title="Telegram">TG</a><a title="Twitch">TW</a><a title="YouTube">YT</a><a title="Discord">DC</a></div>
    <span class="ft-lang">RU ▾</span>
  </div>
  <div class="f3__acc">
    <details open><summary>Честная игра</summary><div><p><b>Монеты</b> не покупаются и не выводятся — только для игры.</p><p><b>Шансы</b> каждого бустера открыты до покупки.</p><p><b>18+</b> · напомним о перерыве, лимит времени — в профиле.</p></div></details>
    <details><summary>Как это работает</summary><div><a>Правила очков</a><a>Сила и редкость карт</a><a>Шансы бустеров</a><a>Пыль и крафт</a></div></details>
    <details><summary>Помощь</summary><div><a>Частые вопросы</a><a>Написать в поддержку</a><a>Сообщить об ошибке</a></div></details>
    <details><summary>Игры и данные</summary><div><div class="ft-games"><span class="is-on">Dota 2</span><span>LoL</span><span>CS 2</span></div><p>Матчи и статистика — Liquipedia и OpenDota.</p></div></details>
  </div>
  <div class="f3__legal">
    <span class="ft-age">18+</span>
    <p class="ft-fine">© 2026 Fantasy · Dota 2 · не связан с Valve и Riot Games · <a>Условия</a> · <a>Конфиденциальность</a> · <a>Ответственная игра</a></p>
  </div>
</footer>
</template>
<script src="_footer.js"></script>
<script>FOOTER.страница({ имя: 'v3 · Компактный', описание: 'Одна строка — бренд, разделы, соцсети и язык; правила, честная игра, помощь и данные — раскрывающимися пунктами; юридическое — строкой. На телефоне — аккордеон, как в приложениях.' })</script>
</body></html>
