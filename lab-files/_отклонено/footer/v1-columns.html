<!doctype html>
<html lang="ru"><head><meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=Roboto+Condensed:wght@500..700&display=swap" />
<link rel="stylesheet" href="/sandbox-public/site/styles.css" /><link rel="stylesheet" href="_footer.css" />
<style>
/* v1 · Колонки, как у SofaScore: сверху бренд, игры, язык и соцсети; дальше пять колонок ссылок; внизу — честная игра и юридическое
   мелко. Плотно и полно: всё нужное на одном экране. На телефоне колонки — по две, юридическое — в конце */
.f1 { margin-top: 12px; padding: 36px 48px 28px; background: var(--c-ui-panel); }
.f1__top { display: flex; align-items: center; gap: 20px; padding-bottom: 28px; border-bottom: 1px solid var(--c-ui-line); }
.f1__top p { max-width: 380px; margin: 0; }
.f1__top .ft-games { margin-left: auto; }
.f1__cols { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px; padding: 28px 0; border-bottom: 1px solid var(--c-ui-line); }
.f1__cols h4 { margin: 0 0 12px; color: var(--c-text); font-size: 14px; font-weight: 600; }
.f1__cols ul { display: grid; gap: 9px; margin: 0; padding: 0; list-style: none; }
.f1__cols li small { margin-left: 6px; padding: 1px 6px; border-radius: 4px; background: var(--c-ui-item); color: var(--c-ui-dim); font-size: 11px; }
.f1__fair { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; padding: 22px 0; border-bottom: 1px solid var(--c-ui-line); }
.f1__fair div { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: start; }
.f1__fair b { grid-row: span 2; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 8px; background: var(--c-ui-item); color: var(--c-coin); font: 700 15px var(--font-c); }
.f1__fair strong { color: var(--c-text); font-size: 13.5px; font-weight: 600; }
.f1__bot { display: flex; align-items: center; gap: 16px; padding-top: 20px; }
.f1__bot .ft-fine { max-width: 760px; }
.f1__bot .ft-lang { margin-left: auto; flex: none; }
@container ft (max-width: 480px) {
  .f1 { padding: 24px 16px 20px; }
  .f1__top { flex-wrap: wrap; gap: 14px; padding-bottom: 20px; }
  .f1__top .ft-games { margin-left: 0; }
  .f1__cols { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 16px; padding: 20px 0; }
  .f1__fair { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .f1__bot { flex-direction: column; align-items: flex-start; }
  .f1__bot .ft-lang { margin-left: 0; }
}
</style></head>
<body><div class="ft-lab" id="lab"></div>
<template id="ft">
<footer class="ft f1">
  <div class="f1__top">
    <span class="ft-brand"><i>F</i>Fantasy · Dota 2</span>
    <p>Карты про-игроков и прогнозы на живые матчи — за игровые монеты, без денег.</p>
    <div class="ft-games"><span class="is-on">Dota 2</span><span>LoL</span><span>CS 2</span></div>
    <div class="ft-soc"><a title="Telegram">TG</a><a title="Twitch">TW</a><a title="YouTube">YT</a><a title="Discord">DC</a></div>
  </div>
  <div class="f1__cols">
    <div><h4>Играть</h4><ul><li><a>Главная</a></li><li><a>Матчи</a></li><li><a>Бустеры</a></li><li><a>Коллекция</a></li><li><a>Квесты</a></li></ul></div>
    <div><h4>Сезон</h4><ul><li><a>Лидеры</a></li><li><a>История</a></li><li><a>Фан-лиги</a></li><li><a>Турниры сезона</a><small>23</small></li></ul></div>
    <div><h4>Как это работает</h4><ul><li><a>Правила очков</a></li><li><a>Сила и редкость карт</a></li><li><a>Шансы бустеров</a></li><li><a>Пыль и крафт</a></li></ul></div>
    <div><h4>Помощь</h4><ul><li><a>Частые вопросы</a></li><li><a>Написать в поддержку</a></li><li><a>Сообщить об ошибке</a></li><li><a>Статус сервиса</a></li></ul></div>
    <div><h4>О проекте</h4><ul><li><a>Условия использования</a></li><li><a>Конфиденциальность</a></li><li><a>Ответственная игра</a></li><li><a>Контакты</a></li></ul></div>
  </div>
  <div class="f1__fair">
    <div><b>F</b><strong>Монеты не покупаются</strong><span>и не выводятся — только для игры: бустеры, бонусы, прогнозы</span></div>
    <div><b>%</b><strong>Шансы открыты</strong><span>у каждого бустера — до покупки, как в правилах</span></div>
    <div><b>18+</b><strong>Ответственная игра</strong><span>напомним о перерыве, лимит времени — в профиле</span></div>
  </div>
  <div class="f1__bot">
    <span class="ft-age">18+</span>
    <p class="ft-fine">© 2026 Fantasy · Dota 2. Проект не связан с Valve Corporation и Riot Games; Dota 2, League of Legends и CS 2 — их товарные знаки. Данные матчей — Liquipedia и OpenDota.</p>
    <span class="ft-lang">Русский ▾</span>
  </div>
</footer>
</template>
<script src="_footer.js"></script>
<script>FOOTER.страница({ имя: 'v1 · Колонки, как у SofaScore', описание: 'Плотный и полный: бренд, игры и соцсети сверху; пять колонок ссылок; три плашки честной игры (монеты, шансы, 18+); юридическое мелко внизу. На телефоне колонки — по две.' })</script>
</body></html>
