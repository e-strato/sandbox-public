<!doctype html>
<html lang="ru"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Сегмент · v9 · Общий цвет</title>
<style>
body { margin: 0; padding: 32px 0 64px; background: #000; color: #fafafa; font: 400 13px/18px system-ui, sans-serif; }
h1 { font: 600 20px/28px system-ui; margin: 0 32px 4px; }
.lead { color: #a1a1aa; margin: 0 32px 16px; }
.pick { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 32px 24px; }
.pick button, .pick label { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid #27272a; border-radius: 8px; background: none; color: #fafafa; font: 500 12px/16px system-ui; cursor: pointer; }
.pick .on { border-color: #fafafa; }
.pick i { width: 12px; height: 12px; border-radius: 3px; box-shadow: 0 0 0 1px #3f3f46; }
.pick input { width: 20px; height: 16px; padding: 0; border: 0; background: none; cursor: pointer; }
.spot { margin: 0 0 28px; }
.spot b { display: block; font: 500 12px/16px system-ui; color: #a1a1aa; margin: 0 32px 8px; }
iframe { display: block; width: 100%; height: 150px; border: 0; border-top: 1px solid #18181b; border-bottom: 1px solid #18181b; background: #000; }
</style></head><body>
<h1>v9 · Общий цвет</h1>
<p class="lead">Кнопка «О турнире» и ряд сегмента «О серии» одним цветом. Сейчас они разные: у кнопки #27272a, у сегмента #18181b. Выбери цвет — он ставится в обе.</p>
<div class="pick" id="pick"></div>
<div class="spot"><b>Турнир — кнопка «О турнире»</b><iframe data-sel=".ph-d .ph2-rt > .ph2-btn" src="../../ui-pages/tournament-engine.html" scrolling="no"></iframe></div>
<div class="spot"><b>Матч — «О серии · карты»</b><iframe data-sel=".segment" src="../../ui-pages/match-engine.html" scrolling="no"></iframe></div>
<script>
const OPTS = [['Как сейчас', null], ['#18181b', '#18181b'], ['#1b1b1d', '#1b1b1d'], ['#202023', '#202023'], ['#27272a', '#27272a']]
let cur = null
const css = () => cur ? '.ph2-btn:not(.ph2-btn--live):not(:hover):not([data-state="open"]){background:' + cur + ' !important}.segment{--seg-bg:' + cur + ' !important}' : ''
const paint = () => { for (const f of document.querySelectorAll('iframe')) { const st = f.contentDocument?.getElementById('v9'); if (st) st.textContent = css() } }
const pick = document.getElementById('pick')
const set = (v, b) => { cur = v; for (const x of pick.children) x.classList.toggle('on', x === b); paint() }
for (const [t, v] of OPTS) { const b = document.createElement('button'); b.type = 'button'; b.innerHTML = (v ? '<i style="background:' + v + '"></i>' : '') + t; b.onclick = () => set(v, b); pick.append(b) }
const own = document.createElement('label'); own.innerHTML = '<input type="color" value="#1f1f22">Свой'; pick.append(own)
own.querySelector('input').addEventListener('input', (e) => set(e.target.value, own))
pick.firstChild.classList.add('on')
for (const f of document.querySelectorAll('iframe')) f.addEventListener('load', () => {
  const d = f.contentDocument, st = d.createElement('style'); st.id = 'v9'; st.textContent = css(); d.head.appendChild(st)
  let n = 0; const t = setInterval(() => { const s = d.querySelector(f.dataset.sel); if (s || ++n > 50) { clearInterval(t)
    if (s) { for (const el of d.querySelectorAll('body *')) { const ps = f.contentWindow.getComputedStyle(el).position; if (ps === 'sticky' || ps === 'fixed') el.style.position = 'relative' }
      const r = s.getBoundingClientRect(); f.contentWindow.scrollTo(0, Math.max(0, r.top + f.contentWindow.scrollY - 50)) } } }, 100)
})
</script>
</body></html>
