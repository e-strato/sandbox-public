<!-- v15-gs-heat — как v14, но клетки — тепловая карта: цвет по разнице (2:0 ярче, 2:1 бледнее), крупный счёт без даты (дата — подсказкой), на пересечении с собой — лого команды; у карт — разница +/− (дирижёр 28.10: «на основе V14 — визуал дотянуть, концептуальные решения»).
     v14-gs-merged — как v9, но справа только «Формат»; на группу одна таблица: место, команда, результаты против каждого соперника, серии, карты (дирижёр 28.10: «две таблицы одного и того же — из боковой убрать, несколько версий»).
     v9-fmt-steps — как v6, но «Формат» — в правой колонке над виджетом турнира шагами: групповая стадия (пройдена) → плей-офф, даты и правила одной строкой (дирижёр 28.10: «перенеси в правую колонку, несколько версий»).
     v6-hdinfo — как v5, но тир, даты, команд, призовые, организатор, тип и патч — не отдельным блоком, а в шапке турнира справа от названия (на телефоне — под ним) (дирижёр 28.10).
     v5-tourw — как v4, но «О турнире» — полосой сверху (тир и даты первыми), а справа только наш виджет турнира (widget-tournament-6 v11) с таблицей групп PARI Universe (дирижёр 28.10).
     v4-heromain — как v3, но статистика героев — в главной колонке под групповой стадией, справа только «О турнире» (дирижёр 28.10).
     v3-notabs — как v2, но без вкладок «Обзор · Квалификация · Статистика» (дирижёр 28.10: «табы не нужны»).
     v2-ours — что осталось в v1, перерисовано в нашей стилистике (токены виджетов, шапка портала как на странице матча): «О турнире», формат, групповая стадия, статистика героев.
     «Участников» нет — их добавит Claude-B (Т2) (дирижёр 28.10). Вид — «Телефон 390 / Компьютер 1440» в панели песочницы. -->
