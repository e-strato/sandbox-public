<!doctype html>
<html lang="ru"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>О серии · v1 · Статистика как у Sentry Bot</title>
<style>html, body { margin: 0; background: #000; } iframe { display: block; width: 100%; height: 100vh; border: 0; }</style>
</head><body>
<iframe src="../ui-pages/match-engine.html?state=pre0" scrolling="no"></iframe>
<script>
const f = document.querySelector('iframe'), CSS = "\n.sx { margin-top: var(--space-28); }\n.sx .ss5__h { margin-top: 0; }\n.ss5__h .sx__tab { margin-left: var(--space-4); }\n.sx__per { margin-left: auto; }\n.sx__grid { display: grid; grid-template-columns: 1fr 284px 1fr; gap: var(--space-12); }\n.sx__card { min-width: 0; border-radius: var(--radius-12); background: color-mix(in srgb, var(--c-text) 4%, transparent); overflow: hidden; }\n.sx__hd { display: flex; align-items: center; justify-content: space-between; gap: var(--space-8); padding: var(--space-12) var(--space-16); }\n.sx__hd small, .sx__cap { color: var(--c-text-3); font: var(--type-caption-2); }\n.sx__row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--space-8); padding: var(--space-8) var(--space-12); border-top: 1px solid color-mix(in srgb, var(--c-text) 6%, transparent); cursor: pointer; }\n.sx__row:hover { background: color-mix(in srgb, var(--c-text) 3%, transparent); }\n.sx__row.is-on { background: color-mix(in srgb, var(--c-text) 7%, transparent); }\n.sx__row .etag { min-width: 0; pointer-events: none; }\n.sx__heroes { display: grid; grid-template-columns: auto auto; gap: var(--space-4) var(--space-8); }\n.sx__h { display: flex; align-items: center; gap: var(--space-6); font: var(--type-caption-2); color: var(--c-text-2); white-space: nowrap; }\n.sx__h img { width: 36px; height: 20px; border-radius: 4px; object-fit: cover; }\n.sx__h b { color: var(--c-text); font-weight: 500; font-family: var(--font-mono); }\n.sx__h span { font-family: var(--font-mono); }\n.sx__cmp { padding: var(--space-12) var(--space-16) var(--space-16); }\n.sx__vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--space-8); padding-bottom: var(--space-12); margin-bottom: var(--space-8); border-bottom: 1px solid color-mix(in srgb, var(--c-text) 6%, transparent); }\n.sx__vs > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }\n.sx__vs > div:last-child { align-items: flex-end; text-align: right; }\n.sx__vs b { font: var(--type-subtitle-1); color: var(--c-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.sx__vs small { font: var(--type-caption-2); color: var(--c-text-3); }\n.sx__vs em { font: var(--type-caption-2-medium); font-style: normal; color: var(--c-text-2); }\n.sx__m { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 30px; padding: 0 var(--space-6); border-radius: var(--radius-6); }\n.sx__m:nth-child(even) { background: color-mix(in srgb, var(--c-text) 3%, transparent); }\n.sx__m > span { font: var(--type-caption-2); color: var(--c-text-3); text-align: center; }\n.sx__m > b { justify-self: start; padding: 2px 6px; border-radius: 4px; font: 400 13px/18px var(--font-mono); color: var(--c-text-2); }\n.sx__m > b:last-child { justify-self: end; }\n.sx__m > b.is-best { color: var(--c-text); font-weight: 600; background: color-mix(in srgb, var(--c-text) 10%, transparent); }\n.sx__team { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-12); padding: var(--space-28) var(--space-16) var(--space-20); }\n.sx__team img { width: 72px; height: 72px; object-fit: contain; }\n.sx__team b { font: var(--type-subtitle-1); color: var(--c-text); }\n.sx__best { padding: var(--space-12) var(--space-16) var(--space-16); border-top: 1px solid color-mix(in srgb, var(--c-text) 6%, transparent); }\n.sx__best .sx__cap { display: block; text-align: center; margin-bottom: var(--space-10); }\n.sx__best .sx__heroes { justify-content: center; gap: var(--space-8) var(--space-16); }\n", JS = "\n(() => {\nconst d = document, HERO = k => '../gs-match/img/heroes/' + k + '.png'\nconst POOL = [['faceless_void','luna','terrorblade','morphling','phantom_assassin','troll_warlord','medusa','naga_siren'],\n  ['puck','storm_spirit','ember_spirit','queenofpain','void_spirit','lina','invoker','pangolier'],\n  ['mars','centaur','tidehunter','beastmaster','dark_seer','axe','primal_beast','bristleback'],\n  ['tusk','earth_spirit','rubick','hoodwink','mirana','earthshaker','snapfire','rattletrap'],\n  ['crystal_maiden','dazzle','shadow_shaman','lion','oracle','jakiro','witch_doctor','disruptor']]\nconst PER = ['\u0422\u0443\u0440\u043d\u0438\u0440', '\u041f\u0430\u0442\u0447 7.42', '\u041c\u0435\u0441\u044f\u0446', '3 \u043c\u0435\u0441\u044f\u0446\u0430', '\u0413\u043e\u0434']\nconst ROLE = ['\u041a\u0435\u0440\u0440\u0438', '\u041c\u0438\u0434', '\u041e\u0444\u0444\u043b\u0435\u0439\u043d', '\u0421\u0430\u043f\u043f\u043e\u0440\u0442 4', '\u0421\u0430\u043f\u043f\u043e\u0440\u0442 5']\nlet seed = 1; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647\nconst R = (a, b) => a + rnd() * (b - a)\nconst st = { tab: 0, per: 2, pos: 0 }\n\nfunction seg(opts, val, cls) {\n  return '<div class=\"segment segment--sm ' + cls + '\" role=\"tablist\"><span class=\"segment__thumb\"></span>' +\n    opts.map((o, i) => '<button type=\"button\" class=\"segment__btn' + (i === val ? ' is-on' : '') + '\" data-i=\"' + i + '\">' + o + '</button>').join('') + '</div>'\n}\nfunction placeThumbs(root) { for (const s of root.querySelectorAll('.segment')) { const b = s.querySelector('.is-on'), t = s.querySelector('.segment__thumb'); if (b) { t.style.width = b.offsetWidth + 'px'; t.style.transform = 'translateX(' + b.offsetLeft + 'px)' } } }\n\nfunction data(T) {\n  seed = 7 + st.per * 31\n  const span = [1, .8, 1, 2.6, 8][st.per]\n  return T.map((t, k) => ({ ...t,\n    players: t.players.map((p, i) => ({ ...p, heroes: POOL[i].slice(k * 2, k * 2 + 6).sort(() => rnd() - .5).slice(0, 4).map(h => ({ h, g: Math.max(1, Math.round(R(2, 10) * span / (k ? 1.2 : 1))), w: Math.round(R(45, 92)) })),\n      m: { win: Math.round(R(40, 70)), maps: Math.round(R(22, 40) * span), k: R(2, 10), d: R(2, 6), a: R(5, 16), kp: Math.round(R(52, 74)), gpm: Math.round(i < 3 ? R(520, 720) : R(300, 420)), xpm: Math.round(i < 3 ? R(620, 860) : R(380, 520)), dmg: R(i < 3 ? 22 : 9, i < 3 ? 36 : 16) } })),\n    team: { win: Math.round(R(42, 70)), maps: Math.round(R(26, 44) * span), k: R(26, 33), d: R(25, 33), fb: Math.round(R(42, 60)), r10: Math.round(R(36, 56)), ft: Math.round(R(40, 58)), rosh: Math.round(R(40, 56)), wfb: Math.round(R(55, 80)), w10: Math.round(R(66, 90)), len: Math.round(R(38, 46) * 60 + R(0, 59)) },\n    best: POOL.flatMap(x => x.slice(k * 2, k * 2 + 2)).sort(() => rnd() - .5).slice(0, 6).map(h => ({ h, g: Math.round(R(4, 13) * span), w: Math.round(R(50, 88)) })) }))\n}\nconst hero = x => '<span class=\"sx__h\"><img src=\"' + HERO(x.h) + '\" alt=\"\"><b>' + x.g + '</b><span>\u00b7 ' + x.w + '%</span></span>'\nconst f1 = v => v.toFixed(1), mmss = s => Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0')\nfunction rows(list) {  // [\u043f\u043e\u0434\u043f\u0438\u0441\u044c, a, b, \u0444\u043e\u0440\u043c\u0430\u0442, \u043c\u0435\u043d\u044c\u0448\u0435 \u2014 \u043b\u0443\u0447\u0448\u0435]\n  return list.map(([l, a, b, f, low]) => { const best = a === b ? -1 : (low ? (a < b ? 0 : 1) : (a > b ? 0 : 1))\n    return '<div class=\"sx__m\"><b class=\"' + (best === 0 ? 'is-best' : '') + '\">' + f(a) + '</b><span>' + l + '</span><b class=\"' + (best === 1 ? 'is-best' : '') + '\">' + f(b) + '</b></div>' }).join('')\n}\nconst pc = v => v + '%', n = v => String(v), k1 = v => f1(v) + 'K'\n\nfunction render(box, T) {\n  const D = data(T), [A, B] = D\n  let h = '<h3 class=\"ss5__h\">\u0421\u0442\u0430\u0442\u0438\u0441\u0442\u0438\u043a\u0430 ' + seg(['\u0418\u0433\u0440\u043e\u043a\u0438', '\u041a\u043e\u043c\u0430\u043d\u0434\u044b'], st.tab, 'sx__tab') + seg(PER, st.per, 'sx__per') + '</h3><div class=\"sx__grid\">'\n  if (st.tab === 0) {\n    const side = t => '<div class=\"sx__card\"><div class=\"sx__hd\">' + t.tag + '<small>\u041b\u0443\u0447\u0448\u0438\u0435 \u0433\u0435\u0440\u043e\u0438 \u00b7 ' + PER[st.per].toLowerCase() + '</small></div>' +\n      t.players.map((p, i) => '<div class=\"sx__row' + (i === st.pos ? ' is-on' : '') + '\" data-pos=\"' + i + '\">' + p.tag + '<div class=\"sx__heroes\">' + p.heroes.map(hero).join('') + '</div></div>').join('') + '</div>'\n    const a = A.players[st.pos], b = B.players[st.pos]\n    const cmp = '<div class=\"sx__card sx__cmp\"><div class=\"sx__vs\"><div><b>' + a.nick + '</b><small>' + A.name + '</small></div><em>' + ROLE[st.pos] + '</em><div><b>' + b.nick + '</b><small>' + B.name + '</small></div></div>' +\n      rows([['\u041f\u043e\u0431\u0435\u0434\u044b', a.m.win, b.m.win, pc], ['\u041a\u0430\u0440\u0442\u044b', a.m.maps, b.m.maps, n], ['\u0423\u0431\u0438\u0439\u0441\u0442\u0432\u0430', a.m.k, b.m.k, f1], ['\u0421\u043c\u0435\u0440\u0442\u0438', a.m.d, b.m.d, f1, 1], ['\u041f\u043e\u043c\u043e\u0449\u044c', a.m.a, b.m.a, f1],\n        ['\u0423\u0447\u0430\u0441\u0442\u0438\u0435 \u0432 \u0443\u0431\u0438\u0439\u0441\u0442\u0432\u0430\u0445', a.m.kp, b.m.kp, pc], ['GPM', a.m.gpm, b.m.gpm, n], ['XPM', a.m.xpm, b.m.xpm, n], ['\u0423\u0440\u043e\u043d \u043f\u043e \u0433\u0435\u0440\u043e\u044f\u043c', a.m.dmg, b.m.dmg, k1]]) + '</div>'\n    h += side(A) + cmp + side(B)\n  } else {\n    const side = t => '<div class=\"sx__card\"><div class=\"sx__team\"><img src=\"' + t.logo + '\" alt=\"\"><b>' + t.name + '</b></div><div class=\"sx__best\"><span class=\"sx__cap\">\u041b\u0443\u0447\u0448\u0438\u0435 \u0433\u0435\u0440\u043e\u0438 \u00b7 ' + PER[st.per].toLowerCase() + '</span><div class=\"sx__heroes\">' + t.best.map(hero).join('') + '</div></div></div>'\n    const a = A.team, b = B.team\n    const cmp = '<div class=\"sx__card sx__cmp\">' + rows([['\u041f\u043e\u0431\u0435\u0434\u044b', a.win, b.win, pc], ['\u041a\u0430\u0440\u0442\u044b', a.maps, b.maps, n], ['\u0423\u0431\u0438\u0439\u0441\u0442\u0432\u0430', a.k, b.k, f1], ['\u0421\u043c\u0435\u0440\u0442\u0438', a.d, b.d, f1, 1], ['\u041f\u0435\u0440\u0432\u0430\u044f \u043a\u0440\u043e\u0432\u044c', a.fb, b.fb, pc],\n      ['\u0413\u043e\u043d\u043a\u0430 \u0434\u043e 10 \u0443\u0431\u0438\u0439\u0441\u0442\u0432', a.r10, b.r10, pc], ['\u041f\u0435\u0440\u0432\u0430\u044f \u0431\u0430\u0448\u043d\u044f', a.ft, b.ft, pc], ['\u041f\u0435\u0440\u0432\u044b\u0439 \u0420\u043e\u0448\u0430\u043d', a.rosh, b.rosh, pc], ['\u041f\u043e\u0431\u0435\u0434\u0430 \u043f\u043e\u0441\u043b\u0435 \u043f\u0435\u0440\u0432\u043e\u0439 \u043a\u0440\u043e\u0432\u0438', a.wfb, b.wfb, pc], ['\u041f\u043e\u0431\u0435\u0434\u0430 \u043f\u043e\u0441\u043b\u0435 10 \u0443\u0431\u0438\u0439\u0441\u0442\u0432', a.w10, b.w10, pc], ['\u0414\u043b\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0441\u0442\u044c \u043a\u0430\u0440\u0442\u044b', a.len, b.len, mmss, 1]]) + '</div>'\n    h += side(A) + cmp + side(B)\n  }\n  box.innerHTML = h + '</div>'; placeThumbs(box)\n}\n\nlet tries = 0; const t = setInterval(() => {\n  const lu = d.querySelector('.ss10__lu .st-lineups'); if (!lu && ++tries < 100) return; clearInterval(t); if (!lu) return\n  const T = [...lu.querySelectorAll('.st-lineups__cols > div')].map(c => { const tag = c.querySelector('.st-lineups__team .etag')\n    return { tag: tag.outerHTML, name: tag.title, logo: tag.querySelector('img').getAttribute('src'),\n      players: [...c.querySelectorAll('.st-lineups__row')].map(r => { const e = r.querySelector('.etag'); return { tag: e.outerHTML, nick: e.title } }) } })\n  const host = lu.closest('.ss10__lu'), box = d.createElement('div'); box.className = 'sx'; host.replaceWith(box)\n  box.addEventListener('click', e => { const b = e.target.closest('.segment__btn'), r = e.target.closest('.sx__row')\n    if (b) { if (b.closest('.sx__tab')) st.tab = +b.dataset.i; else st.per = +b.dataset.i; render(box, T) }\n    else if (r) { st.pos = +r.dataset.pos; render(box, T) } })\n  render(box, T)\n}, 100)\n})()\n"
f.addEventListener('load', () => {
  const d = f.contentDocument
  if (CSS) { const s = d.createElement('style'); s.textContent = CSS; d.head.appendChild(s) }
  if (JS) { const s = d.createElement('script'); s.textContent = JS; d.body.appendChild(s) }
  for (const el of d.querySelectorAll('body *')) { const p = f.contentWindow.getComputedStyle(el).position; if (p === 'fixed') el.style.position = 'absolute' }
  const fit = () => { f.style.height = d.documentElement.scrollHeight + 'px' }
  new f.contentWindow.ResizeObserver(fit).observe(d.body); fit()
})
</script>
