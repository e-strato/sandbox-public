<script>
const f = document.querySelector('iframe'); f.addEventListener('load', () => {
  const d = f.contentDocument, w = f.contentWindow
  let n = 0; const t = setInterval(() => { const b = d.querySelector('.mpage__main .segment__btn'); if (!b && ++n < 60) return; clearInterval(t)
    if (b) b.click()
    for (const el of d.querySelectorAll('body *')) { if (w.getComputedStyle(el).position === 'fixed') el.style.position = 'absolute' }

})
