<!-- v2 — по правкам 23.10: дата слева (U.when), значок игры 16, лого 16 у тега (PR — IC), число серым без подложки; в матче без табов — команды друг под другом, только игроки с заменой, без ID-чипов и плашки «не сверены»; роли и Map по-английски; второй состав Nemiga (CS2) — пример -->
<body><div class="lab-board"><div class="z2"><div id="w"></div></div></div>
<script src="_data.js"></script><script src="../widget-subs-2/_data.js"></script><script src="../widget-subs-2/_games.js"></script><script src="../widget-subs-3/_s3data.js"></script>
<script src="../widgets-unified/_cons.js"></script><script src="../widget-subs-3/_s3.js"></script>
<script>
  const K = [{ id: 'home', name: 'На главной', why: 'Матчи с новыми заменами: дата слева, значок игры, теги команд, число замен серым. У Nemiga две строки — матч по Dota 2 и матч по CS2 (пример); нажми матч — его замены по командам', o: {} },
    { id: 'match', name: 'В матче', why: 'Открыт матч PR — IC (идёт Map 2): команды друг под другом, только игроки с заменой — Shiro → fading, Kz → ? (нет в базе), Dukalis → Yamich; нажми строку — шаги Кто → Позиция → Срок → Проверь', o: { match: 'm1' } },
    { id: 'map', name: 'Замена на карту', why: 'CD выпустили Nikobaby с Map 2 серии — срок «на карту»', o: { match: 'm2' } },
    { id: 'none', name: 'Замен нет', why: 'YS — Bot$: составы совпадают с базой', o: { match: 'm5' } }]
  const w = document.getElementById('w'); let cur = 0
  const go = (f, i) => { cur = i; S3.render(w, { ...K[i].o }) }
  window.LAB = { view: 'toolbar', flows: () => [{ name: 'Экраны', steps: K.map(k => ({ name: k.name, what: k.why })) }], go, cur: () => ({ f: 0, i: cur }),
    axes: () => [{ key: 'screen', name: 'Экран', value: K[cur].id, options: K.map(k => ({ v: k.id, label: k.name })) }],
    set: (k, v) => go(0, K.findIndex(x => x.id === v)), caption: () => K[cur].why }
  go(0, 0)
</script>
