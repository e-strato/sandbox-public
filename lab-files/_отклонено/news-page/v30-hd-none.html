<!-- Страница новостей v30 — как v28, но сторис без заголовка и подложки — просто линия кружков; у блоков нет заголовков: «Главное» без подписи, турнир — в подписи главной новости блока (дирижёр 03.11: «заголовки у больших виджетов не нравятся — отказаться или вынести»).
     v28 — как v27, но блок «Главное» ниже: 460 px вместо ~630; в первой колонке 6 новостей, у средних фото ужимается, заголовок в 2 строки (дирижёр 03.11: «по высоте поменьше»).
     v27 — как v26, но в первой колонке 8 новостей и строки делят высоту блока поровну — снизу нет пустоты (дирижёр 03.11: «почему пустое место»).
     v26 — как v25, но починено: лого турнира в подписи растягивалось на всё фото (в слайдере перекрывало затемнение, в средних — полосой под заголовком) (дирижёр 03.11: «где затемнение», «тут что так криво»).
     v25 — как v24, но сторис — одна линия важных событий (делают редакторы), без дней; блок «Главное» — колонки поровну, как в v21, не выше оригинала (дирижёр 03.11).
     v24 — как v23, но первая колонка — 6 своих новостей (не те, что в слайдере), слайдер с ней не связан (дирижёр 03.11: «больше четырёх, но не 20; новость по центру — отдельная»); сторис — виджетом в правой колонке, над турнирами (дирижёр 03.11).
     v23 — как v22, но виджеты турниров и трансферов снова справа (начальник 1·27:08 говорил про колонку мелких новостей — она и так слева; дирижёр 03.11) и стили проще, как у виджетов сайта: шапки блоков как .w-hd, кольцо сторис без градиента, шрифты мельче.
     v22 — по созвону 02.11 §3 (дирижёр 03.11: «забери страницу новостей, сделай лабу»), код — _np2.js / _np2.css:
     ранги и фильтр рангов убраны, игры — переключателем в шапке; матч-бар под шапкой вместо бегущей строки; полоса сторис по дням; чипы идущих турниров (все включены);
     «Темы / Ранги / Время» убраны — главное (плотная колонка 10 строк · слайдер 5 главных, 6 с, активная подсвечена слева · 2 средние), дальше лента по дням, внутри дня — блоки турниров со ссылками на источник;
     колонка турниров и трансферов — слева. ‼️ Матч-бар (счёт, время) и сторис (фото из новостей) — пример.
     v21 — как v20, но без «Активности» справа (дирижёр 30.10: «активность убери»).
     v20 — как v19, но справа вместо «Матчей» — виджет трансферов (widget-transfers-2 v12, решение 32; дирижёр 30.10: «вида матчей у нас не было — не должно быть и тут, лучше другой виджет»).
     v19 — как v18, плюс (дирижёр 30.10: «да, всё это сделай»): одна бегущая строка сверху — слабые (C) и не вошедшие в блоки (в группах строк больше нет); группы из одной новости — общим блоком «Ещё»; справа «Матчи» (из новостей) вместо «Горячего»; телефон — главная, средние, мелкие одной колонкой, лишнее — в строку; пустых колонок нет; код удалённых версий вычищен.
     v18 — как v13 (строго, линии, заголовки одного размера, главная — фото с текстом на нём, справа виджеты), но блок группы — законченная композиция без рядов после:  4 мелких · большая · 2 средние:колонками — слева 4 мелких, в центре большая, справа 2 средние с фото; что не вошло — в бегущую строку группы. Дирижёр 30.10: «почему главная + 3 справа, а там ещё 3 снизу? большая на 2 колонки + большая на 1 колонку сверху и 3 снизу; или колонками: большая, 2 средние с фото, 4–6 в правой; ещё идеи». Концепт (дирижёр 30.10: «v1–v3 похожи на SofaScore, скучно; концептуальнее, ближе к нашим; две колонки — ок»). Дирижёр 30.10: «сделай новую страницу новостей на основе своих решений» (виджет widget-news v36, DECISIONS 30.10).
     Данные — 92 настоящие новости cybersport.ru (../news/_feed.js, лаба news Claude-B), фото — у 30 самых читаемых. ‼️ Ранг — наш расчёт из просмотров и комментариев. Вид — «Телефон 390 / Компьютер 1440» в панели. -->
