<!-- w-gold-2 v9 · Страница · v5 (щипок + палец) — страница матча v41 (gs-match-2/v41-gap) целиком, график — из лабы w-gold-2 (дирижёр 30.10: «посмотреть, как полноценно будет выглядеть на странице»).
     v41-gap — как v40, но под шапкой отступ 4 — верх окна матча и виджетов не обрезается (дирижёр 29.10).
     v40-noline — как v39, но без линии на всю ширину под шапкой портала (дирижёр 29.10).
     v39-crumbs — как v38, но в шапке портала вторая строка из лабы w-subhead v2: назад и путь «Матчи › турнир › стадия › матч»; в окне матча «назад» и строки турнира нет (дирижёр 29.10).
     v38-live — как v37, но «Пульс матча», «Обсуждение» и голосование — только в live и до матча; до матча — своим видом (постер с отсчётом и «Напомнить», анонс эфиров; лучший прогноз на экране; «Кто выиграет серию?»); после матча их нет (дирижёр 29.10).
     v37-mvp — как v36, но виджет MVP показывается только когда матч завершён (дирижёр 29.10).
     v36-pulse — как v35, но первым в правой колонке «Пульс матча» из лабы w-actions v15 (эфир, мини тепловая карта эфиров, пульс, циферблат, поделиться / сохранить / следить); на телефоне — док над нижним баром; нижней группы ♡ / 💬 / поделиться и кнопки «Трансляция» нет (дирижёр 29.10).
     v35-vote16 — как v34, но голосование из лабы widget-vote v16: заголовок — вопрос, таймер мелко (точка + моно), значки Material (кубок, рост, часы), итог — сегментная полоса трибун (дирижёр 29.10).
     v34-vote — как v33, но под «Обсуждением» голосование из лабы widget-vote v5: шаг 1 — за кого болеешь, шаг 2 — ответ, таймер 3 мин, итог по трибунам (дирижёр 29.10: «ставь пока v5»).
     v33-disc — как v32, но справа сверху виджет «Обсуждение» (лаба widget-promo v50): экран-телевизор с самым залайканным сообщением, голосование лайками, чат Twitch + Kick, на широкой мобилке — две колонки (дирижёр 29.10).
     v30-wx — шаг 4, как v27, но виджеты правой колонки сворачиваются, как в лабе widget-expand v20: свёрнут — главное (турнир — две команды матча, замены — одной строкой), раскрыт — всё; значок справа внизу (дирижёр 29.10). MVP не сворачивается.
     v27-dr-tall — как v26, но график выше: 480 на ПК (было 380), 320 на телефоне (было 260) (дирижёр 28.10).
     v26-dr-kda — шаг 3, как v21, но KDA тремя числами цветом: убийства зелёным, смерти красным, помощь серым (дирижёр 28.10).
     v21-dr-below — шаг 3, как v20, но график выше (380), кнопки графика — маленькой группой справа сверху; под графиком пятёрки без банов: мини-иконка, позиция 1–5, ник, KDA; между ними счёт по убийствам и перевес по золоту (созвон 28.10 §2.1–2.7). Код — ../gs-match-2/_dr3.js.
     v20-btn-soft — как v19, но «назад» и «поделиться» меньше (30) и тише — без рамки, лёгкий фон, серая иконка; значки — SVG ровно по центру (дирижёр 28.10).
     v19-tabs-flush — как v18, но без отступов слева и справа: вкладки от края до края окна (дирижёр 28.10).
     v18-tabs-fill-nosep — как v14, но вкладки карт растянуты на всю ширину окна поровну, без разделителей между ними (дирижёр 28.10).
     v14-hdj-sq — как v13, но серая полоса в две строки: сверху мелко «TI 2026 · Плей-офф, день 2 из 3 · Bo3», ниже матч и счёт; «назад» и «поделиться» — квадратными кнопками по краям (дирижёр 28.10).
     v13-hd-col — как v12, но серая полоса с путём — не во всю ширину, а наверху окна в главной колонке, над вкладками карт; правая колонка начинается вровень с ним (дирижёр 28.10).
     v12-hd-win — как v10, но сверху — серая полоса с путём «турнир › стадия › матч», а вкладки карт — только в главной колонке окном браузера; график и драфт — внутри этого окна, без своих рамок (дирижёр 28.10).
     v10-hd-chrome — как v3, но как в Chrome: полоса вкладок карт, под ней «страница» со строкой пути, как адресная строка (дирижёр 28.10: «может как в браузере — вкладки, под ними путь»). Без лого турнира, «Сетки», колокольчика. Код — ../gs-match-2/_hd2.js.
     v3-live — как v2, но открывается сразу live-матч (Vision — Spirit, карта 3) и нигде нет «Записей карт» (дирижёр 28.10).
     v2-flat — как v1, но у графика одна рамка: карточка вокруг виджета графика без своей рамки (дирижёр 28.10: «убрать двойную окантовку»).
     v1-lean — как v0, но убрано по созвону 28.10 (созвон-2-матч.html): «Статистика к матчу» — только в «Превью» и до матча (§2.8); на карте нет игроков — блока «О матче» (§4.2);
     справа нет трансферов (§3.2); остров снят (§3.4) — в нижней группе ♡ / 💬 / поделиться / «Трансляция»; две колонки от 1920 убраны, шире 1920 — поля по бокам (§4.2). -->
