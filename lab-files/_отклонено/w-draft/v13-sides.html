<!-- w-draft v13 · Колонками по бокам — страница матча v31 (Live без паузы): команды колонками слева и справа от графика: логотип, 5 пиков сверху вниз, баны (начальник [1 · 28:03] «поставил бы слева-справа»); на телефоне — Radiant над графиком, Dire под ним (дирижёр 27.10: «версии драфта сделай ещё»). Пути — от gs-match (<base>).
     v30-pip — как v29, но «Статистика к матчу» — последним блоком на любой карте и в «Превью», а трансляция — не вкладкой у графика, а кнопкой в углу → мини-окно без звука (дирижёр 27.10).
     v29-hd-scroll — как v28, но шапка матча сжимается вслед за прокруткой (w-header v10, window.WH_COLLAPSE = 'scroll'): на сколько прокрутил, на столько и ниже, до одной строки, без порога (дирижёр 27.10).
     v28-stat — как v27, но «Факты к матчу» и «Очные и форма» до матча и в «Превью» заменены виджетом «Статистика к матчу» из лабы w-preview (v21, ../w-preview/_wstat.js): досье команд и новости таймлайном (дирижёр 26.10: «пока перенесём таймлайн 21»).
     v27-wide3 — как v26, но на очень широком экране (от 1920) три колонки: главная делится пополам — график слева, игроки справа, карты матча над обеими (дирижёр 27.10).
     v26-maps-main — как v25, но карты матча — первым виджетом в главной колонке, а не во всю ширину (дирижёр 27.10).
     v25-maps — как v24, но под шапкой во всю ширину — карты матча из лабы w-maps (v9, ../w-maps/_wmseg.js): «Превью» + все карты серии, не начатые бледные; нажал — ниже превью (факты, очные, составы) или график и игроки этой карты; плашка переезжает плавно (дирижёр 26.10: «9 переноси»).
     v24-notabs — как v23, но в шапке матча нет вкладок (Обзор, Карты, События, Новости, Статистика) — под шапкой будут карты матча, лаба w-maps (дирижёр 26.10).
     v23-bar — как v22, но в центре нижнего бара — остров из лабы w-bar (v11 «Вопрос крупно», ../w-bar/_wbar.js): что сейчас у матча; прилетело событие — светится, нажал — карточка с вопросом. На компьютере — в правой колонке. Переключатель «Прилетело событие» (дирижёр 26.10).
     
     v22-header — как v21, но шапка матча — виджет из лабы w-header (v5 «Счёт по центру», ../w-header/_wheader.js): вкладки матча в ней же, при скролле — одна строка (дирижёр 26.10).
      v21-widgets — как v20, но «Перевес по золоту» и «Игроки» — виджеты из лаб w-gold и w-players (../w-gold/_wgold.js, data-wd="gold"): страница собирается только из виджетов (дирижёр 26.10).
      v20-wide — как v19, но на компьютере без «ушей»: страница во всю ширину окна, главная колонка тянется сколько угодно, поля по бокам 32 (дирижёр 26.10).
     v19-widgets — как v18, но всё на странице — виджеты трёх мест: во всю ширину (шапка матча с вкладками), главная колонка, правая. Ничего не висит само по себе:
     плашка паузы — внутри шапки, «последняя карта…» — ссылкой низом виджета графика, «Все новости / Вся статистика» — низом своего виджета.
     На телефоне: шапка → главная колонка → правая (на любой вкладке). Переключатель «Подписи виджетов» в панели — место и название над каждым.
     v18-mid — как v17, на телефоне шапка матча одного среднего размера (между полной и сжатой), не сжимается при прокрутке, полные названия всегда.
     v17-full — как v16, на телефоне виджеты (турнир, замены, трансферы, MVP) — во всю ширину, как остальные карточки.
     v16-smooth — как v15, на телефоне в шапке нет пилюль килов и строки турнира; при прокрутке вниз шапка плавно сжимается (логотипы и счёт меньше, названия уходят).
     v15-widgets — как v14, на телефоне виджеты правой колонки (турнир, замены — вошедшему, трансферы, MVP) — под контентом вкладки.
     v14-shrink — как v13, на телефоне шапка матча ужимается при прокрутке вниз (логотипы, короткие названия, счёт, статус) и раскрывается при прокрутке вверх.
     v13-sticky — как v12, вкладки матча прилипают к верху под шапкой матча, пока листаешь.
     v12-tabs — как v11, без вкладок «Турнир» и «Очные».
     v11-cards — как v10, но график, записи карт и драфт — отдельными карточками; переключатель — только в live.
     v8-now — «Обзор» — самое интересное сейчас (в live — идущая карта: график, трансляция, драфт, игроки), новости, очные, турнир, статистика — своими вкладками; угадайки одним блоком с «Ты в матче» справа.
     v7-series — как v6, но «Обзор» — вся серия без разбора одной карты (серия по картам с мини-графиками, трансляция, игроки за серию), разбор карты — только во вкладке «Карты».
     v6-overview — как v5, но вкладки матча — над главной колонкой; «Обзор» — матч сейчас (идущая или последняя карта, без чипов), разбор по картам — во вкладке «Карты», события — вкладкой «События».
     v5-gold — страница матча, шапка «Перевес по золоту» (под Доту, от «столбиком»): под счётом — полоса перевеса: кто впереди на карте и на сколько золота, ниже — слоты килов по картам. Иначе — копия v4-typical:
     v4-typical — по типовым сайтам (Cyberscore, DLTV — Figma, снимки 06.10): шапка матча со счётом в два уровня (серия · карта, время, килы),
     под ней вкладки матча, в центре график, таблица игроков и сыгранные карты, справа виджеты. Код — _gs.js (window.GS_LAYOUT = v4) -->
