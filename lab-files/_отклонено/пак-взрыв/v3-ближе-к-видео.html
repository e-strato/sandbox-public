<!doctype html>
<html lang="ru"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>v3 · Открытие пака — ближе к видео</title>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<style>
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 500 13px/1.35 Inter, system-ui, sans-serif; color: #e4e4e7; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
.hint { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); color: #a1a1aa; font-size: 14px; pointer-events: none; transition: opacity .3s; }
.pn { position: fixed; top: 12px; right: 12px; width: 276px; max-height: calc(100% - 24px); overflow: auto; box-sizing: border-box; background: rgba(15, 15, 18, .86); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, .08); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; z-index: 2; }
.pn.is-min > :not(.pn-hd) { display: none; }
.pn-hd { display: flex; align-items: center; justify-content: space-between; }
.pn-hd b { font-weight: 600; font-size: 14px; }
.btn { all: unset; cursor: pointer; padding: 6px 10px; border-radius: 8px; background: rgba(255, 255, 255, .08); color: #e4e4e7; font-weight: 500; text-align: center; }
.btn:hover { background: rgba(255, 255, 255, .14); }
.btn--p { background: #8b5cf6; color: #fff; } .btn--p:hover { background: #7c3aed; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.row { display: flex; align-items: center; gap: 8px; } .row > span { flex: 1; color: #a1a1aa; }
.row input[type=number] { width: 52px; background: rgba(255, 255, 255, .06); border: 0; border-radius: 6px; color: #e4e4e7; padding: 3px 6px; font: inherit; font-variant-numeric: tabular-nums; }
.img { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; }
.img img { width: 44px; height: 62px; object-fit: contain; border-radius: 6px; background: #27272a; }
.img .col { display: flex; flex-direction: column; gap: 4px; } .img .col b { font-weight: 600; }
.img .col .btns { grid-template-columns: 1fr 1fr 1fr; } .img .btn { padding: 4px 6px; font-size: 12px; }
input[type=color] { width: 30px; height: 22px; border: 0; padding: 0; background: none; cursor: pointer; }
input[type=range] { width: 100%; accent-color: #8b5cf6; margin: 0; }
.sec { color: #71717a; font-size: 12px; margin-top: 4px; }
.tl { display: flex; align-items: center; gap: 8px; } .tl b { width: 42px; text-align: right; font-variant-numeric: tabular-nums; color: #a1a1aa; font-weight: 500; }
.note { color: #f59e0b; font-size: 12px; }
</style></head>
<body>
<!-- v3 · Ближе к видео (дирижёр 06.11: «сравни с видео» → «да»): тайминг на 0,3 с раньше, пак вылетает маленьким снизу по диагонали, туннель мягкий без полос, фольга мятая, сфера на 70% кадра, крупные кристаллы, лучи от карты, карта смотрит на нас; дальше — как v2.
     v2 · Открытие пака — объёмно (дирижёр 06.11: «пока слабо, хотелось бы более 3d»). Всё в 3D: пак — подушка из фольги с толщиной и зажимами, наклоняется за мышью;
     туннель — полосы света и кольца летят мимо камеры; лучи — объёмные конусы из-за пака; при взрыве пак рвётся на куски со своей картинкой;
     кристаллы и сфера — настоящее стекло (преломление), камера облетает сферу и влетает в неё; радужное расслоение по краям кадра;
     карта — с толщиной, золотым торцом и рубашкой, раскручивается. Панель и настройки — общие с v1. -->
<canvas id="c"></canvas>
<div class="hint" id="hint">Нажми на пак</div>
<div class="pn" id="pn">
  <div class="pn-hd"><b>Настройки</b><button class="btn" id="min">Свернуть</button></div>
  <div class="btns"><button class="btn btn--p" id="play">Открыть</button><button class="btn" id="pause">Пауза</button></div>
  <div class="tl"><input type="range" id="tl" min="0" max="6.2" step="0.01" value="0" /><b id="tlv">0,00</b></div>
  <div class="row"><span>Скорость</span><input type="range" id="speed" min="0.2" max="2" step="0.05" style="width:110px" /><input type="number" id="speedN" min="0.2" max="2" step="0.05" /></div>
  <div class="sec">Картинки</div>
  <div class="img"><img id="packI" alt="" /><div class="col"><b>Пак</b><div class="btns"><button class="btn" data-f="pack">Файл</button><button class="btn" data-u="pack">Ссылка</button><button class="btn" data-d="pack">Базовый</button></div></div></div>
  <div class="img"><img id="cardI" alt="" /><div class="col"><b>Карта</b><div class="btns"><button class="btn" data-f="card">Файл</button><button class="btn" data-u="card">Ссылка</button><button class="btn" data-d="card">Базовая</button></div></div></div>
  <div class="note" id="note" hidden></div>
  <div class="sec">Цвета</div>
  <div class="row"><span>Туннель 1</span><input type="color" data-c="c1" /></div>
  <div class="row"><span>Туннель 2</span><input type="color" data-c="c2" /></div>
  <div class="row"><span>Лучи</span><input type="color" data-c="beam" /></div>
  <div class="row"><span>Сфера</span><input type="color" data-c="sphere" /></div>
  <div class="row"><span>Кристаллы</span><input type="color" data-c="shard" /></div>
  <div class="row"><span>Белый экран</span><input type="color" data-c="white" /></div>
  <div class="row"><span>Свечение</span><input type="range" id="bloom" min="0" max="2.5" step="0.05" style="width:110px" /><input type="number" id="bloomN" min="0" max="2.5" step="0.05" /></div>
  <button class="btn" id="reset">Сбросить всё к базовым</button>
  <input type="file" id="file" accept="image/*" hidden />
</div>
<script type="module">
import * as THREE from 'three'
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js'
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js'
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js'
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js'
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js'

// ── настройки: общие с v1 (картинки и цвета переносятся) ──
const KEY = 'lab-pack-burst-v1'
const DEF = { pack: '', card: '', c1: '#12b5c9', c2: '#3aa860', beam: '#e9fdff', sphere: '#2b1f66', shard: '#dff4ff', white: '#f1ecff', speed: 1, bloom: 0.35 }
let S = { ...DEF }
try { S = { ...DEF, ...JSON.parse(localStorage.getItem(KEY) || '{}') } } catch (e) {}
const note = (t) => { const n = document.getElementById('note'); n.hidden = !t; n.textContent = t || '' }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); note('') } catch (e) { note('Картинка большая — не сохранилась, но в этом окне работает') } }
const col = (h) => new THREE.Color(h)

// ── рендер ──
const cv = document.getElementById('c')
const R = new THREE.WebGLRenderer({ canvas: cv, antialias: true })
R.setPixelRatio(Math.min(devicePixelRatio, 2))
R.toneMapping = THREE.ACESFilmicToneMapping
const scene = new THREE.Scene()
const cam = new THREE.PerspectiveCamera(38, 1, 0.05, 200)
cam.position.set(0, 0, 8)
const pm = new THREE.PMREMGenerator(R)
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture
scene.add(new THREE.AmbientLight(0xffffff, 0.3))
const key = new THREE.DirectionalLight(0xffffff, 1.8); key.position.set(3, 4, 6); scene.add(key)
const rim = new THREE.PointLight(0xffffff, 0, 14); rim.position.set(0, .5, -1.6); scene.add(rim)
const fill = new THREE.PointLight(0xffffff, 0, 10); fill.position.set(-2, -1, 3); scene.add(fill)

const composer = new EffectComposer(R)
composer.addPass(new RenderPass(scene, cam))
// защита от NaN / бесконечности перед свечением (иначе свечение разносит чёрные квадраты)
composer.addPass(new ShaderPass({ uniforms: { tDiffuse: { value: null } }, vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }', fragmentShader: 'uniform sampler2D tDiffuse; varying vec2 vUv; void main(){ vec4 c = texture2D(tDiffuse, vUv); if (isnan(c.r) || isnan(c.g) || isnan(c.b)) c.rgb = vec3(0.); gl_FragColor = vec4(min(c.rgb, vec3(40.)), 1.); }' }))
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), S.bloom, 0.3, 1.1)
composer.addPass(bloom)
// радужное расслоение по краям кадра — как в видео на сфере
const chroma = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uAmt: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uAmt; varying vec2 vUv;
    void main(){ vec2 d = vUv - .5; float k = uAmt * .022 * dot(d, d) * 4.; vec2 o = d * k;
      vec3 c = vec3(texture2D(tDiffuse, vUv + o).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - o).b);
      gl_FragColor = vec4(c, 1.); }`,
})
composer.addPass(chroma)
composer.addPass(new OutputPass())

// ── дальний фон (шейдер): белое начало, тон туннеля, радужное кольцо, тёмный фон сферы с радужными полосами, финал ──
const U = {
  uRes: { value: new THREE.Vector2(1, 1) }, uTime: { value: 0 }, uIntro: { value: 1 }, uTunnel: { value: 0 }, uZoom: { value: 0 }, uRain: { value: 0 },
  uStage: { value: 0 }, uChroma: { value: 0 }, uFin: { value: 0 },
  uC1: { value: col(S.c1) }, uC2: { value: col(S.c2) }, uSph: { value: col(S.sphere) },
}
const GL_N = `
  float h2(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float h1(float n){ return fract(sin(n * 127.1) * 43758.5453); }
  float rayN(float a, float z, float K){ float x = (a / 6.2831853 + 0.5) * K; float i = floor(x), f = fract(x); f = f * f * (3. - 2. * f); float i1 = mod(i + 1., K);
    float zi = floor(z), zf = smoothstep(0., 1., fract(z));
    return mix(mix(h2(vec2(i, zi)), h2(vec2(i1, zi)), f), mix(h2(vec2(i, zi + 1.)), h2(vec2(i1, zi + 1.)), f), zf); }
  float adiff(float a, float b){ return abs(mod(a - b + 3.14159265, 6.2831853) - 3.14159265); }`
const bg = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms: U, depthTest: false, depthWrite: false,
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.9999, 1.0); }',
  fragmentShader: `uniform vec2 uRes; uniform float uTime, uIntro, uTunnel, uZoom, uRain, uStage, uChroma, uFin; uniform vec3 uC1, uC2, uSph; varying vec2 vUv;
  ${GL_N}
  void main(){
    vec2 p = (vUv - .5) * uRes / uRes.y; float r = length(p), a = atan(p.y, p.x);
    vec3 c = mix(vec3(1.6), vec3(.012, .012, .018), uIntro) + vec3(.16, .15, .22) * exp(-r * r * 6.) * uIntro * (1. - uTunnel);
    float z = .3 / (r + .04) + uZoom, nc = rayN(a + .7, z * .2, 7.);
    vec3 tc = mix(uC1, uC2, smoothstep(.35, .8, nc));
    vec3 tun = tc * (.12 + .95 * pow(rayN(a, z * .6, 20.), 1.6) * (.45 + rayN(a + 2., z * .3, 9.))) * (.35 + 1.5 * exp(-r * 2.2)) + vec3(.8, 1., 1.) * exp(-r * 6.) * .45;
    for (int i = 0; i < 3; i++) { float rr = fract(uTime * .42 + float(i) / 3.) * 1.4; tun += tc * .7 * exp(-pow((r - rr) * 8., 2.)) * (1. - rr / 1.4); }
    c = mix(c, tun, uTunnel);
    float r0 = .62; c += vec3(exp(-pow((r - r0 - .035) * 20., 2.)), exp(-pow((r - r0) * 20., 2.)), exp(-pow((r - r0 + .035) * 20., 2.))) * uRain * 1.1;
    vec3 b = vec3(.014, .01, .036) + uSph * .35 * exp(-r * 1.6);
    b += vec3(.6, .6, .95) * pow(rayN(a, .55 / (r + .05) + uTime * 3., 90.), 14.) * smoothstep(.2, .9, r) * .6;
    vec3 hue = .5 + .5 * cos(6.2831853 * (a * .48 + r * 1.6 + vec3(0., .33, .67)));
    b += hue * pow(rayN(a, .5 / (r + .05) + uTime * 2.5, 70.), 6.) * uChroma * smoothstep(.3, .7, r) * 1.8;
    c = mix(c, b, uStage);
    vec3 f = vec3(.02, .015, .045) + uSph * .55 * exp(-r * 1.7) + mix(uC1, uC2, .5) * .2 * pow(rayN(a, uTime * .15, 24.), 3.) * exp(-r * 1.1);
    c = mix(c, f, uFin);
    c *= 1. - .4 * smoothstep(.5, 1.4, r);
    gl_FragColor = vec4(c, 1.);
  }`,
}))
bg.frustumCulled = false; bg.renderOrder = -10; scene.add(bg)

// ── туннель в 3D: полосы света летят мимо камеры, кольца ──
const NT = 520
const tunMat = new THREE.MeshBasicMaterial({ transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0 })
const tun = new THREE.InstancedMesh(new THREE.BoxGeometry(.035, .035, 1), tunMat, NT); tun.frustumCulled = false; scene.add(tun)
const TS = []
for (let i = 0; i < NT; i++) { const th = Math.random() * 6.283, rr = 2.2 + Math.pow(Math.random(), .7) * 9; TS.push({ x: Math.cos(th) * rr, y: Math.sin(th) * rr, z: -80 + Math.random() * 88, k: Math.random(), b: .6 + Math.random() * 1.6 }) }
const tunColors = () => { const c = new THREE.Color(); for (let i = 0; i < NT; i++) { c.copy(U.uC1.value).lerp(U.uC2.value, TS[i].k).multiplyScalar(TS[i].b); if (TS[i].k > .93) c.setRGB(2, 2.2, 2.2); tun.setColorAt(i, c) } tun.instanceColor.needsUpdate = true }
const rings = []
for (let i = 0; i < 4; i++) { const m = new THREE.Mesh(new THREE.TorusGeometry(3.4, .025, 8, 128), new THREE.MeshBasicMaterial({ transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0 })); m.userData.z = -60 + i * 17; scene.add(m); rings.push(m) }

// ── объёмные лучи из-за пака (конусы) ──
const beamMat = new THREE.ShaderMaterial({
  uniforms: { uCol: { value: col(S.beam) }, uA: { value: 0 } }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  vertexShader: 'varying float vY; varying vec3 vN; varying vec3 vV; void main(){ vY = position.y; vec4 mv = modelViewMatrix * vec4(position, 1.); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }',
  fragmentShader: 'uniform vec3 uCol; uniform float uA; varying float vY; varying vec3 vN; varying vec3 vV; void main(){ float along = smoothstep(-10., -.2, vY) * smoothstep(0., -.6, vY); float edge = pow(abs(dot(vN, vV)), 2.); gl_FragColor = vec4(uCol * 2.2 * along * edge * uA, 1.); }',
})
const beams = new THREE.Group(); scene.add(beams)
const coneG = new THREE.ConeGeometry(.55, 10, 32, 1, true); coneG.translate(0, -5, 0)
const BD = [[.95, .25, .25], [-.9, .35, .3], [.2, .95, .35], [-.35, -.9, .4], [.85, -.5, .2], [-.8, -.45, .6], [.1, -.2, 1]]
BD.forEach((d, i) => { const m = new THREE.Mesh(coneG, beamMat); const v = new THREE.Vector3(...d).normalize(); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), v); m.scale.set(.5 + (i % 3) * .45, 1, .5 + (i % 3) * .45); beams.add(m) })

// ── звезда-вспышка и белый экран — плоскости перед камерой ──
const starMat = new THREE.ShaderMaterial({
  uniforms: { uA: { value: 0 }, uT: { value: 0 } }, transparent: true, depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',
  fragmentShader: `uniform float uA, uT; varying vec2 vUv; ${GL_N}
    void main(){ vec2 p = (vUv - .5) * 2.; float r = length(p), a = atan(p.y, p.x), st = 0.;
      for (int i = 0; i < 11; i++) { float fi = float(i); float d = adiff(a, fi * .571 + h1(fi + 11.) * .35 + uT * .1); float len = .45 + .55 * h1(fi + 5.); st += exp(-d * (40. + r * 150.)) * smoothstep(len, 0., r); }
      vec3 c = vec3(.9, 1., 1.) * (st * 1.7 + exp(-r * 6.) * 1.3 + exp(-r * 1.6) * .25);
      gl_FragColor = vec4(c * uA, 1.); }`,
})
const star = new THREE.Mesh(new THREE.PlaneGeometry(9, 9), starMat); star.renderOrder = 50; scene.add(star)
const whMat = new THREE.ShaderMaterial({ uniforms: { uA: { value: 0 }, uC: { value: col(S.white) } }, transparent: true, depthTest: false, depthWrite: false,
  vertexShader: 'void main(){ gl_Position = vec4(position.xy, 0., 1.); }', fragmentShader: 'uniform float uA; uniform vec3 uC; void main(){ gl_FragColor = vec4(uC * 3., uA); }' })
const wh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), whMat); wh.frustumCulled = false; wh.renderOrder = 100; scene.add(wh)

// ── картинки по умолчанию ──
function defPack() {
  const w = 512, h = 820, c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d')
  const gr = g.createLinearGradient(0, 0, w, h); ['#6d28d9', '#22d3ee', '#f0abfc', '#a3e635', '#818cf8', '#f472b6'].forEach((x, i, a) => gr.addColorStop(i / (a.length - 1), x))
  g.fillStyle = gr; g.fillRect(0, 0, w, h)
  for (let i = 0; i < 40; i++) { g.globalAlpha = .08 + Math.random() * .12; g.fillStyle = i % 2 ? '#fff' : '#1e1b4b'; g.save(); g.translate(Math.random() * w, Math.random() * h); g.rotate(-.6); g.fillRect(-300, 0, 600, 4 + Math.random() * 18); g.restore() }
  g.globalAlpha = 1
  const crimp = (y) => { const cg = g.createLinearGradient(0, y, 0, y + 46); cg.addColorStop(0, '#e5e7eb'); cg.addColorStop(.5, '#9ca3af'); cg.addColorStop(1, '#f3f4f6'); g.fillStyle = cg; g.fillRect(0, y, w, 46); g.fillStyle = 'rgba(0,0,0,.18)'; for (let x = 0; x < w; x += 8) g.fillRect(x, y, 3, 46) }
  crimp(0); crimp(h - 46)
  g.fillStyle = 'rgba(15,10,40,.35)'; g.beginPath(); g.arc(w / 2, 330, 130, 0, 7); g.fill()
  g.lineWidth = 14; g.strokeStyle = '#fff'; g.beginPath(); g.arc(w / 2, 330, 120, 0, 7); g.stroke()
  g.fillStyle = '#fff'; g.font = '900 170px Inter, system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('F', w / 2, 338)
  g.font = '900 78px Inter, system-ui, sans-serif'; g.lineWidth = 10; g.strokeStyle = '#1e1b4b'; g.strokeText('FANTASY', w / 2, 560); g.fillText('FANTASY', w / 2, 560)
  g.font = '700 30px Inter, system-ui, sans-serif'; g.fillStyle = '#1e1b4b'; g.fillText('DOTA 2 · БУСТЕР', w / 2, 630)
  return c.toDataURL('image/png')
}
function defCard() {
  const w = 512, h = 716, c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d')
  return new Promise((res) => {
    const draw = (img) => {
      const fr = g.createLinearGradient(0, 0, w, h); fr.addColorStop(0, '#fde68a'); fr.addColorStop(.5, '#b45309'); fr.addColorStop(1, '#fef3c7')
      g.fillStyle = fr; g.beginPath(); g.roundRect(0, 0, w, h, 34); g.fill()
      g.fillStyle = '#120d24'; g.beginPath(); g.roundRect(14, 14, w - 28, h - 28, 24); g.fill()
      if (img) { g.save(); g.beginPath(); g.roundRect(30, 30, w - 60, 480, 16); g.clip(); const s = Math.max((w - 60) / img.width, 480 / img.height); g.drawImage(img, w / 2 - img.width * s / 2, 30, img.width * s, img.height * s); g.restore() }
      else { const gg = g.createLinearGradient(0, 30, 0, 510); gg.addColorStop(0, '#7c3aed'); gg.addColorStop(1, '#0e7490'); g.fillStyle = gg; g.beginPath(); g.roundRect(30, 30, w - 60, 480, 16); g.fill() }
      const sh = g.createLinearGradient(0, 380, 0, 510); sh.addColorStop(0, 'rgba(18,13,36,0)'); sh.addColorStop(1, 'rgba(18,13,36,1)'); g.fillStyle = sh; g.fillRect(30, 380, w - 60, 131)
      g.fillStyle = '#facc15'; g.font = '900 64px Inter, system-ui, sans-serif'; g.textAlign = 'left'; g.textBaseline = 'top'; g.fillText('92', 48, 44)

  const cvz = !idle && tt >= 2.25
  card.visible = cvz
  if (cvz) {
    const h = CH * K(tt, [[2.25, 0], [2.6, .3, 'o'], [4.3, .38], [4.85, .38], [5.9, 1, 'o']])
    card.scale.set(h * cardAspect, h, h)
    const em = K(tt, [[2.25, 3], [4.95, 3], [6, 0, 'o']]); cardFront.emissiveIntensity = cardBackM.emissiveIntensity = cardEdge.emissiveIntensity = em
    card.rotation.set(Math.sin(clock * 1.3) * .05, K(tt, [[4.85, .5], [5.9, 0, 'o']]) + Math.sin(clock * .9) * (done ? .14 : .04) + (done ? smx * .35 : 0), done ? smy * .2 : 0)
    card.position.set(0, done ? Math.sin(clock * 1.4) * .05 : 0, 0)
  }
  // кристаллы
  const shv = !idle && tau > 0 && tt < 4.8
  shards.visible = shv
  if (shv) {
    const k = (1 - Math.exp(-tau * 1.5)) / 1.5
    for (let i = 0; i < NS; i++) { const s = SH[i]; V.copy(s.d).multiplyScalar(SR * .3 + s.v * k + .35 * tau); Q2.setFromAxisAngle(s.ax, s.w * tau); Q.copy(s.q0).multiply(Q2); SC.copy(s.sc).multiplyScalar(Math.min(1, tau * 7)); M.compose(V, Q, SC); shards.setMatrixAt(i, M) }
    shards.instanceMatrix.needsUpdate = true
  }
  // крошки
  bits.visible = !idle && tt > .8 && tt < 2.2
  if (bits.visible) {
    for (let i = 0; i < NB; i++) { const b = BT[i], a = tt - b.t0
      if (a < 0 || a > 1.2) M.compose(ZERO, Q.identity(), SC.set(0, 0, 0)); else { V.copy(b.p).multiply(pack.scale).applyEuler(pack.rotation).add(pack.position).addScaledVector(b.v, a); Q.setFromAxisAngle(b.ax, a * 8); SC.setScalar(b.s * (1 - a / 1.2)); M.compose(V, Q, SC) }
      bits.setMatrixAt(i, M) }
    bits.instanceMatrix.needsUpdate = true
  }
  if (!scrub) { tlI.value = tt; tlV.textContent = tt.toFixed(2).replace('.', ',') }
  composer.render()
}

function resize() { const w = innerWidth, h = innerHeight; R.setSize(w, h, false); composer.setSize(w, h); cam.aspect = w / h; cam.updateProjectionMatrix(); U.uRes.value.set(w, h) }
addEventListener('resize', resize); resize()
let last = performance.now()
// в лабе открыты все версии сразу — рисует только видимая и та, что под мышью или играет; остальные — раз в 20 кадров
let onScreen = true, hot = document.hasFocus(), skip = 0
new IntersectionObserver((e) => { onScreen = e[0].isIntersecting }).observe(document.body)
document.documentElement.addEventListener('pointerenter', () => (hot = true)); document.documentElement.addEventListener('pointerleave', () => (hot = false))
const awake = () => onScreen && (hot || playing || ++skip % 20 === 0)
R.setAnimationLoop((now) => { if (!awake()) { last = now; return } const dt = Math.min(.05, (now - last) / 1000); last = now; frame(dt) })

// ── управление ──
const pauseB = document.getElementById('pause')
const start = () => { mode = 'play'; t = 0; playing = true; setHint(); pauseB.textContent = 'Пауза' }
cv.addEventListener('click', () => { if (mode === 'idle') start(); else if (mode === 'done') { mode = 'idle'; setHint() } })
document.getElementById('play').onclick = start
pauseB.onclick = () => { if (mode !== 'play') return; playing = !playing; pauseB.textContent = playing ? 'Пауза' : 'Дальше' }
const tlI = document.getElementById('tl'), tlV = document.getElementById('tlv'); let scrub = false
tlI.max = T_END
tlI.addEventListener('input', () => { scrub = true; mode = 'play'; playing = false; t = +tlI.value; pauseB.textContent = 'Дальше'; tlV.textContent = t.toFixed(2).replace('.', ','); setHint() })
tlI.addEventListener('change', () => { scrub = false })
document.getElementById('min').onclick = (e) => { const p = document.getElementById('pn'); p.classList.toggle('is-min'); e.target.textContent = p.classList.contains('is-min') ? 'Открыть' : 'Свернуть' }
function pair(id, k, on) { const r = document.getElementById(id), n = document.getElementById(id + 'N'); const set = (v, from) => { v = Math.max(+r.min, Math.min(+r.max, +v || 0)); S[k] = v; if (from !== r) r.value = v; if (from !== n) n.value = v; on && on(v); save() }; r.value = n.value = S[k]; on && on(S[k]); r.oninput = () => set(r.value, r); n.onchange = () => set(n.value, n) }
pair('speed', 'speed')
pair('bloom', 'bloom', (v) => { bloom.strength = v })
const applyColors = () => { U.uC1.value.set(S.c1); U.uC2.value.set(S.c2); U.uSph.value.set(S.sphere); beamMat.uniforms.uCol.value.set(S.beam); whMat.uniforms.uC.value.set(S.white); shardMat.color.set(S.shard); inMat.uniforms.uC.value.set(S.sphere); tunColors() }
document.querySelectorAll('[data-c]').forEach((el) => { el.value = S[el.dataset.c]; el.oninput = () => { S[el.dataset.c] = el.value; applyColors(); save() } })
applyColors()
async function setImg(kind, src) {
  const def = kind === 'pack' ? DEF_PACK : DEF_CARD
  let im; try { im = await loadImg(src || def) } catch (e) { note('Картинка не грузится по ссылке — скачай её и загрузи файлом'); return false }
  const tex = texOf(im)
  if (kind === 'pack') { packMat.map?.dispose(); packMat.map = tex; backMat.map = tex; fragMat.map = tex; [packMat, backMat, fragMat].forEach((m) => (m.needsUpdate = true)); packAspect = im.width / im.height }
  else { cardFront.map?.dispose(); cardFront.map = tex; cardFront.needsUpdate = true; cardAspect = im.width / im.height }
  document.getElementById(kind + 'I').src = src || def
  return true
}
function shrink(im, png) { const m = 1024, s = Math.min(1, m / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); return c.toDataURL(png ? 'image/png' : 'image/jpeg', .9) }
let fileKind = 'pack'; const fileI = document.getElementById('file')
document.querySelectorAll('[data-f]').forEach((b) => (b.onclick = () => { fileKind = b.dataset.f; fileI.value = ''; fileI.click() }))
fileI.onchange = () => { const f = fileI.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = async () => { const im = await loadImg(rd.result); const url = shrink(im, f.type === 'image/png' || f.type === 'image/webp'); if (await setImg(fileKind, url)) { S[fileKind] = url; save() } }; rd.readAsDataURL(f) }
document.querySelectorAll('[data-u]').forEach((b) => (b.onclick = async () => { const u = prompt('Ссылка на картинку'); if (!u) return; if (await setImg(b.dataset.u, u)) { S[b.dataset.u] = u; save() } }))
document.querySelectorAll('[data-d]').forEach((b) => (b.onclick = async () => { S[b.dataset.d] = ''; await setImg(b.dataset.d, ''); save() }))
document.getElementById('reset').onclick = async () => {
  S = { ...DEF }; save()
  document.querySelectorAll('[data-c]').forEach((el) => (el.value = S[el.dataset.c])); applyColors()
  ;['speed', 'bloom'].forEach((id) => { document.getElementById(id).value = document.getElementById(id + 'N').value = S[id] }); bloom.strength = S.bloom
  await setImg('pack', ''); await setImg('card', '')
}
DEF_CARD = await defCard()
await setImg('pack', S.pack); await setImg('card', S.card)
setHint()
