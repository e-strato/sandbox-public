<!-- Т2 «Участники» v34 — «Вид» первым везде (ПК: значки вида, потом порядок; шторка: Вид → дальше только то, что есть у этого вида: Порядок — у карточек и списка, Колонки «Состав / Форма» — у списка, Позиция — у «по позиции»);
     на телефоне «Состав / Форма» и Pos 1–5 — только в шторке (дирижёр 30.10: «вид первый, остальное в зависимости от того, что открыто»). Сегменты (шторка, «Состав / Форма») — общие t5-seg, как в виджетах (дирижёр 30.10). Как v33, но на телефоне в шапке виджета вместо «Посев · Рейтинг · А–Я» и значков вида — одна кнопка «Фильтры»; по ней снизу выезжает шторка: Порядок, Вид;
     закрывается «Готово» или тапом мимо. «Состав / Форма» над списком — как в v33. На компьютере — как было (дирижёр 30.10: «кнопка фильтры, все фильтры внутри в боттом-шите»).
     v33 — как v32, но на телефоне колонки не влезали: в строке заголовков переключатель «Состав / Форма» — «Состав»: замены, Subs, рейтинг; «Форма»: клетки серий, рейтинг;
     «Заметки» на телефоне нет; название команды в одну строку с многоточием (дирижёр 30.10: «на телефоне не вмещается, надо другой переключатель»).
     v32 — как v30, но форма только в списке (в карточках нет, переключателя нет); список разложен по колонкам с заголовками (Команда · Замены · Subs · Заметки · Форма · Рейтинг); форма — 5 последних серий клетками со счётом,
     цвет как в тепловой карте групповой стадии (2:0 ярко, 2:1 бледно), соперник и дата — подсказкой; на телефоне без колонок Subs и Заметки (дирижёр 30.10: «разделялась на колонки, форму — как тепловую карту»).
     v31 — как v30, но форма команды (5 последних W/L) — всегда в виде «Список», в карточках её нет; переключателя «Форма команды» больше нет (дирижёр 30.10: «в этом варианте показывать, в карточках не надо»).
     v30 — как v29, но «Посев · Рейтинг · А–Я» — в шапке виджета (строки под шапкой нет); перетаскивание переделано: у редактора при «Посеве» ручка ⋮⋮ у каждой команды
     (в карточке — слева от лого), тянешь — команда едет за курсором, на её месте пунктирная рамка, остальные плавно расступаются; работает и пальцем (дирижёр 28.10: «не понял, как перетаскивать — сделай качественнее»).
     v29 — как v28 + порядок команд (дирижёр 28.10: «сворачивание и перетаскивание — попробуем»):
     вид — три значка: карточки · список · по позиции; список — команда одной строкой (посев, лого, статус, запас, заметки, рейтинг);
     строка «Порядок: Посев · Рейтинг · А–Я» под шапкой; посев по умолчанию — как на Liquipedia (Invited по алфавиту, потом квалификация);
     редактор при «Посеве» перетаскивает карточки и строки (⋮⋮) — так задаёт посев; зритель только выбирает порядок.
     v28 — как v27, но открыл заметки — шапка карточки меняется: «‹» назад, заголовок «Заметки · N», под ним лого и название команды (дирижёр 28.10).
     v27 — как v25, но «+» редактора — отдельной квадратной кнопкой 24×24 в 4 px от заметок, не в одной подложке (дирижёр 28.10).
     v25 — как v23, но заметки — квадратный значок размером с кнопку щита, число — кружком в углу, как у Subs (у редакционных — жёлтым); нет заметок — тусклый значок; открыты — белый, нажал ещё раз — назад (дирижёр 28.10).
     v23 — как v22, но щит без запаса не «выбран» (серый, тонкая рамка), заметки открыты — на кнопке «‹ Состав», нажал — назад (как в v19);
     у замены нет ▲▼ разницы рейтинга — это не рейтинг, у разных игроков он может совпадать (дирижёр 28.10).
     v22 — как v21, но заметок нет — кнопка «Нет заметок» (неактивна); у редактора рядом всегда «+» — добавить заметку (редакционную); без запаса — один щит, при наведении подсказка
     «Основной состав без изменений» (или «… · N замен»); Coach — залитой плашкой, как позиция, со значком свистка спереди (дирижёр 28.10).
     v21 — как v19, но нижняя строка — только кнопки размером с переключатель, всегда в одной позиции по центру, без линии над ней: слева «заметки» (открыты — белая), справа Main (щит) / Subs (стрелки, число запасных); без запаса — только щит;
     у кнопок нет обводки (дирижёр 28.10).
     v19 — как v17, но «рассказ ростера» открывается в самой карточке на месте состава (высота та же), внизу вместо счётчика — «‹ Состав».
     Общее v18–v20 (дирижёр 28.10): статус (Invited / Qualified · Qualifier 1st) — под названием команды; сворачивания карточки нет (стрелки нет);
     нет запаса — переключателя Main / Subs нет, строка заметок на всю ширину.
     v17 — как v16, но два состояния виджета, подписаны прямо в заголовке: «Участники · Зритель» — только смотреть (состав, запас, кто на кого заменён), игроки не нажимаются, «Вернуть состав» нет;
     «Участники · Редактор» — для того, кто ведёт турнир: нажал игрока — замена из Subs со сроком, «Вернуть состав». Переключатель «Кто смотрит» — в панели лабы (дирижёр 28.10).
     v16 — как v14, но у крошечных переключателей явные состояния: выбранный — белая подложка, тёмный значок; доступный — серый значок в рамке; недоступный (запаса нет) — пунктирная рамка, почти не виден; у значка Subs — число запасных.
     Цвет рейтинга — как в v13 (число цветом), зелёный ярче, жёлтый и красный приглушённые (дирижёр 28.10: «по цветам V13 лучший, зелёный можно ярко»).
     v14 — как v11, но вид — крошечным переключателем из двух значков в шапке; Main / Subs — такой же крошечный переключатель внизу вместо строки Subs (как v10, но не ссылкой); замена: тег срока и серым «за Stojkov»; рейтинг белым, цвет — маленькой точкой перед числом (дирижёр 28.10).
     v11 — как v8, но переключателя нет: запасные — одной мелкой строкой под тренером «Subs: Mikoto 2 · …», у кого нет — «Subs —»; в замену выбираются как раньше (дирижёр 28.10: «Main / Subs — маленьким, внизу или не сегментом»).
     v8 — как v6, но у всех карточек одинаковый набор строк, высота одна без скролла (дирижёр 28.10: «чтобы все были одного размера»): статус и квалификация — строкой у всех;
     Main / Subs — у всех (Subs · 0 — неактивна); список — всегда 6 строк; «вместо …» — подсказкой; «рассказ ростера» — одной строкой «N заметки», нажал — всплывают. Метка Astra поправлена (OmaR + GH).
     v6 — как v5, но второй рейтинг ещё мельче (9px) через тонкий слэш: «84/87» (дирижёр 28.10).
     v5 — как v4, но плашка позиции снова справа; рейтинг цветом по месту среди игроков той же позиции на турнире (топ-3 — зелёный, середина — жёлтый, последние 3 — красный); второй рейтинг мельче и серым; цифры мельче; Coach — тегом в рамке на месте позиции (дирижёр 28.10).
     v4 — как v3, но позиция — плашкой с номером перед ником, как ранг у игроков на странице матча (w-players), подсказка при наведении — роль (дирижёр 28.10: «позицию надо как-то выделить»).
     v3 — v2 (стиль итоговых виджетов) + идеи начальника, созвон 28.10 §2.1–2.16 (дирижёр 28.10: «все идеи начальника в новой версии»):
     до 16 команд · статус не выпячен · форма (в панели) · тренер · замены с типом (Map / Series / Day / Tournament) · состав меняется (нажми игрока) ·
     смена позиции · пары и «сколько вместе» · замена ▲▼ к прежнему · вернулся · новая команда (с нуля / группами) · метки авто / редакция ·
     рейтинг игрока «базовый · производный» на этот турнир, рейтинг команды · вид «По позиции».
     Составы, запас, тренеры — _data.js (Liquipedia). ‼️ Пример: рейтинги, форма, объявленные замены, «Запасной А» у команд без запаса, тексты меток. -->

  .pt-rt{ font:600 11px/16px var(--w-font); font-variant-numeric:tabular-nums; white-space:nowrap; text-align:right; }

  .pt-rt b{ font-weight:600; } .pt-rt .up{ color:var(--w-up); } .pt-rt .dn{ color:#c98a8a; }
  .pt-was{ font:var(--t-sub); color:var(--w-muted-fg); margin-left:4px; }
  .pt-nt{ display:flex; gap:8px; padding:6px 0; } .pt-nt + .pt-nt{ border-top:1px solid var(--w-border); }
  .pt-nt .ico{ flex:none; width:16px; height:16px; display:grid; place-items:center; color:var(--w-muted-fg); } .pt-nt.ed .ico{ color:var(--w-star); font-size:11px; }
  .pt-nt p{ margin:0; font:var(--t-cell); color:var(--w-fg); } .pt-nt p small{ display:block; font:var(--t-sub); color:var(--w-muted-fg); margin-top:2px; }
  .pt-notes{ height:100%; overflow-y:auto; scrollbar-width:thin; }
  .pt-foot{ display:flex; align-items:center; gap:8px; height:28px; margin-top:8px; } .pt-foot .sp{ flex:1; }
  .pt-ty{ font:var(--t-tag); color:var(--w-a-fg); background:var(--w-a-bg); border-radius:4px; padding:0 4px; margin-left:4px; }
  .pt-mk{ font:var(--t-tag); color:var(--w-muted-fg); border:1px solid var(--w-border); border-radius:4px; padding:0 4px; margin-left:4px; white-space:nowrap; }
  /* метки истории — строками через линию, «авто» серым, «редакция» звездой */
  .pt-st{ margin-top:8px; padding-top:8px; border-top:1px solid var(--w-border); display:flex; flex-direction:column; gap:4px; }
  .pt-st div{ display:flex; gap:6px; font:var(--t-sub); color:var(--w-fg); }
  .pt-st em{ flex:none; width:52px; font:var(--t-tag); font-style:normal; color:var(--w-muted-fg); }
  .pt-st .ed em{ color:var(--w-star); }
  .pt-reset{ font:var(--t-link); color:var(--w-muted-fg); margin-top:6px; }
  .pt-reset:hover{ color:var(--w-fg); }
  .w .pt-ic{ display:inline-flex; gap:2px; padding:2px; border-radius:7px; background:var(--w-mid-bg); flex:none; }
  .w .pt-ic button{ position:relative; min-width:24px; height:20px; display:flex; align-items:center; justify-content:center; gap:4px; border-radius:5px; color:var(--w-muted-fg); }
  .w .pt-ic button:not(.is-on):hover{ color:var(--w-fg); background:var(--w-muted); }
  .w .pt-ic button.is-on{ background:var(--w-fg); color:var(--w-bg); }
  .w .pt-ic button.is-only, .w .pt-ic button.is-only.is-on{ cursor:default; background:none; color:var(--w-muted-fg); box-shadow:inset 0 0 0 1px var(--w-border); }
  .w .pt-ic button.is-only:hover{ background:none; color:var(--w-muted-fg); }
  .w .pt-ic .pt-nb.is-off{ color:var(--w-ring); cursor:default; background:none; }
  .w .pt-ic .pt-add{ width:24px; }
  .pt-foot{ gap:4px; }
  .w .pt-sq{ display:inline-flex; }
  .w .pt-sq .pt-add{ width:24px; height:24px; display:grid; place-items:center; border-radius:7px; background:var(--w-mid-bg); color:var(--w-muted-fg); }
  .w .pt-sq .pt-add:hover{ color:var(--w-fg); background:var(--w-muted); }
  .pt-foot > .pt-sq [data-tip]:hover::after{ right:auto; left:0; }
  .pt-foot > .pt-ic:first-child [data-tip]:hover::after{ right:auto; left:0; }
  .w .pt-ic .pt-nc{ width:24px; padding:0; }
  .w .pt-ic .pt-nc:disabled{ color:var(--w-hover); cursor:default; background:none; }
  .w .pt-ic .pt-nc.is-ed sup, .w .pt-ic .pt-nc .st{ color:var(--w-star); }
  .w .pt-ic .pt-nc.is-ed sup{ background:#3a3214; }

  .w [data-tip]{ position:relative; }
  .w [data-tip]:hover::after{ content:attr(data-tip); position:absolute; right:0; bottom:calc(100% + 6px); z-index:6; white-space:nowrap; padding:4px 8px; border-radius:6px;
    background:#18181b; border:1px solid var(--w-border); box-shadow:0 8px 20px #000a; font:var(--t-sub); color:var(--w-fg); pointer-events:none; }
  .w .pt-ic button sup{ position:absolute; top:-5px; right:-5px; min-width:12px; height:12px; padding:0 3px; border-radius:6px; background:var(--w-muted); color:var(--w-fg); font:600 8px/12px var(--w-font); text-align:center; }
  .w .pt-ic .pt-nb{ padding:0 8px; font:var(--t-tag); white-space:nowrap; }

  .w .pt-more{ display:block; width:100%; margin-top:8px; padding-top:8px; border-top:1px solid var(--w-border); font:var(--t-sub); color:var(--w-muted-fg); text-align:left; }
  .pt-subl{ height:16px; margin-top:4px; font:var(--t-sub); color:var(--w-muted-fg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pt-subl span{ color:var(--w-fg); } .pt-subl i{ font-style:normal; color:var(--w-muted-fg); } .pt-subl img.f{ width:12px; height:8px; margin-right:3px; vertical-align:0; border-radius:1px; }
  .w .pt-more:not(:disabled):hover{ color:var(--w-fg); } .w .pt-more:disabled{ color:var(--w-ring); cursor:default; }
  /* По позиции */
  .pt-pos{ padding:8px 16px 12px; }
  .pt-pos .pt-seg{ margin-bottom:8px; max-width:320px; }
  .pt-pos .pt-r .k{ width:20px; font:var(--t-num-s); color:var(--w-muted-fg); flex:none; }
  .pt-pos .pt-r .tm{ display:flex; align-items:center; gap:6px; width:150px; font:var(--t-sub); color:var(--w-muted-fg); }
  .is-phone .pt-pos .pt-r .tm{ width:auto; } .is-phone .pt-pos .pt-r .tm span{ display:none; }
  .pt-pos .pt-r .tm img{ width:16px; height:16px; object-fit:contain; }
  .pt-pos .pt-r .bar{ width:80px; height:4px; border-radius:2px; background:var(--w-muted); overflow:hidden; }
  .is-phone .pt-pos .pt-r .bar{ display:none; }
  .pt-pos .pt-r .bar i{ display:block; height:100%; background:var(--w-fg); }
  /* замена — всплывашка */
  .pt-pop{ position:fixed; z-index:9; width:260px; padding:12px; border-radius:10px; background:#18181b; border:1px solid var(--w-border); box-shadow:0 12px 32px #000a; display:flex; flex-direction:column; gap:8px; font-family:var(--w-font); }
  .pt-pop .lbl{ font:var(--t-label); color:var(--w-muted-fg); }
  .pt-pop .t{ font:var(--t-title); }
  .pt-pop .opt{ display:flex; align-items:center; gap:8px; width:100%; min-height:36px; padding:0 8px; border-radius:6px; font:var(--t-cell); color:var(--w-fg); background:none; border:0; cursor:pointer; text-align:left; }

<body><div class="lab-board"><div id="w"></div></div>
<script src="_data.js"></script>
<script src="../widgets-unified/_cons.js"></script>
<script>
  const DEV = [{ id: 'desk', name: 'Компьютер' }, { id: 'phone', name: 'Телефон' }]
  const ID = { '1w Team': '1w', 'Astra Invicta': 'astra', 'BetBoom Team': 'bb', GamerLegion: 'gl', OG: 'og', PARIVISION: 'pv', 'Team Liquid': 'liq', 'Team Spirit': 'ts', 'Team Yandex': 'ya', LEGION: 'lg' }
  const TEAMS = PU_TEAMS.map((t) => {
    const main = t.tabs[0].m, subs = t.tabs.find((x) => x.tab === 'Subs')?.m ?? []
    return { ...t, id: ID[t.name], p: main.filter((x) => x.role !== 'Coach'), coach: main.find((x) => x.role === 'Coach'), subs }
  })
  // Типы замены (§2.5) — игровые термины по-английски (решение 34)
  const TYPES = [['map', 'Map'], ['series', 'Series'], ['day', 'Day'], ['tour', 'Tournament']]
  const ROLE = { 1: 'Pos 1 · Carry', 2: 'Pos 2 · Mid', 3: 'Pos 3 · Offlane', 4: 'Pos 4 · Soft support', 5: 'Pos 5 · Hard support' }
  const tl = (k) => TYPES.find((x) => x[0] === k)[1]
  // ‼️ пример: замены, уже объявленные на турнире
  const SUBS0 = { ya: [{ pos: 3, who: 'Xibbe', type: 'day', why: 'день 2' }], lg: [{ pos: 2, who: '4nalog', type: 'map', why: 'Map 2 против BB' }] }
  // Метки у игрока (§2.7, 2.8, 2.10) и «рассказ ростера» (§2.11, 2.12): auto — система, ed — редакция. ‼️ тексты — пример по словам начальника
  const MARK = { 'Save-': '4 → 2', swedenstrong: 'новый на 4', Batyuk: 'вернулся', m1CKe: 'пара · Boxi', Boxi: 'пара · m1CKe', Yuma: '1 мес. в команде', ATF: 'вместо DM' }
  const STORY = {
    astra: [['auto', 'OmaR и GH — долго в одной команде'], ['auto', 'lorenof играл с OmaR и GH один турнир']],
    bb: [['auto', 'Save- перешёл с 4 на 2, на 4 — swedenstrong']],
    gl: [['auto', '4 игрока вместе 3 турнира'], ['ed', 'Yuma пришёл месяц назад — с ним стали играть лучше']],
    liq: [['auto', 'm1CKe и Boxi — 500+ матчей вместе']],
    ts: [['auto', 'Batyuk вернулся: Spirit → академия → Spirit']],
    ya: [['auto', 'ATF вместо DM на 3 — рейтинг выше']],
    pv: [['auto', 'Новая команда — раньше вместе не играли']],
  }
  // ‼️ пример: рейтинг на этот турнир (§2.14, 2.16) — устойчивое псевдослучайное от ника; базовый 60–94, производный ±6
  const h = (s) => { let x = 7; for (const c of s) x = (x * 31 + c.charCodeAt(0)) >>> 0; return x }
  const rate = (n) => { const b = 60 + h(n) % 35; return { b, d: b - 6 + h(n + '·') % 13 } }
  const rOf = (t, n) => rate(n.startsWith('Запасной') ? n + t.id : n)
  const FORM = (id) => [...Array(5)].map((_, i) => (h(id + i) % 3 ? 'W' : 'L'))
  // v32: форма — серии со счётом (пример): [наши, их, соперник, дата]
  const SER = (id) => FORM(id).map((r, i) => { const x = h(id + 'm' + i), o = TEAMS[x % TEAMS.length].id === id ? TEAMS[(x + 1) % TEAMS.length] : TEAMS[x % TEAMS.length], c = x % 2 ? 0 : 1
    return r === 'W' ? [2, c, o.name, 24 - i * 3] : [c, 2, o.name, 24 - i * 3] })
  const tone = (v) => v[0] > v[1] ? (v[1] === 0 ? 'w2' : 'w1') : (v[0] === 0 ? 'l2' : 'l1')
  const flagOf = (t, n) => [...t.p, ...t.subs, t.coach].find((x) => x?.nick === n)?.fsrc

  const WHO = [{ id: 'fan', name: 'Зритель' }, { id: 'ed', name: 'Редактор' }]
  const S = { order: TEAMS.map((_, i) => i), sort: 'seed', story: {}, who: 'fan', dev: 0, view: 'teams', lm: 'info', sheet: false, pos: 1, n16: 'off', col: {}, tab: {}, swap: structuredClone(SUBS0) }
  const w = document.getElementById('w')
  const chev = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  const cur = (t) => t.p.map((x, i) => { const s = (S.swap[t.id] || []).find((y) => y.pos === i + 1); return s ? { nick: s.who, sub: s, was: x.nick } : { nick: x.nick } })
  const teamRate = (t) => Math.round(cur(t).reduce((a, x) => a + rOf(t, x.nick).b, 0) / 5)
  const fl = (src) => (src ? `<img class="f" src="${src}">` : '<img class="f" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">')
  // место среди игроков той же позиции на турнире (основа, с текущими заменами): топ-3 — hi, последние 3 — lo, остальные — mid
  const tier = (pos, b) => { const all = TEAMS.map((t) => rOf(t, cur(t)[pos - 1].nick).b).sort((x, y) => y - x); return b >= all[2] ? 'hi' : b <= all[all.length - 3] ? 'lo' : 'mid' }
  const rt = (r, d = '', pos) => `<span class="pt-rt"><b class="${pos ? tier(pos, r.b) : ''}">${r.b}</b><i>${r.d}</i>${d}</span>`

  function main(t, i) {
    return cur(t).map((x, k) => {
      const r = rOf(t, x.nick); let d = ''
      const mk = !x.sub && MARK[x.nick] ? `<span class="pt-mk">${MARK[x.nick]}</span>` : ''
      return `<div class="pt-r${S.who === 'ed' ? ' is-btn' : ''}" data-t="${i}" data-i="${k}"${x.sub ? ` title="вместо ${x.was}${x.sub.why ? ' · ' + x.sub.why : ''}"` : ''}>${fl(flagOf(t, x.nick))}<span class="n"><span>${x.nick}${x.sub ? `<span class="pt-ty">${tl(x.sub.type)}</span><span class="pt-was">за ${x.was}</span>` : mk}</span></span>${rt(r, d, k + 1)}<span class="p" title="${ROLE[k + 1]}">${k + 1}</span></div>`
    }).join('') + `<div class="pt-r coach">${fl(t.coach.fsrc)}<span class="n"><span>${t.coach.nick}</span></span><span class="cz"><svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="4.5" cy="7.2" r="2.8"/><path d="M6.8 5.6 11 3.5M7.3 7.2H11"/></svg>Coach</span></div>`
  }
  const subsList = (t) => t.subs.map((x) => `<div class="pt-r">${fl(x.fsrc)}<span class="n"><span>${x.nick}</span></span>${x.team ? `<span class="x"><img src="${x.team[1]}" title="${x.team[0]}"></span>` : ''}${rt(rOf(t, x.nick), '', +x.role)}<span class="p" title="${ROLE[x.role]}">${x.role}</span></div>`).join('')

  function team(t, i) {
    const col = S.col[i] ?? false, tab = S.tab[i] ?? 0, sw = S.swap[t.id] || []
    return `<div class="pt-tm ${col ? 'is-col' : ''}" data-drag="${i}">
      ${S.story[i] ? `<div class="pt-th"><button class="pt-back" data-story="${i}" aria-label="Назад к составу"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg></button><span class="nm"><b>Заметки · ${STORY[t.id].length}</b><small><img src="${t.logo}" alt="">${t.name}</small></span></div>` : `<div class="pt-th">${canDrag() ? `<span class="pt-grip" data-grip aria-label="Перетащить">${GRIP}</span>` : ''}<img src="${t.logo}" alt=""><span class="nm"><b>${t.name}</b><small>${t.st}${t.q ? ` · ${t.q[0]} <i>${t.q[1]}</i>` : ''}</small></span>${sw.length && S.who === 'ed' ? `<button class="pt-reset" data-reset="${i}">Вернуть состав</button>` : ''}<span class="tr" title="Рейтинг команды">${teamRate(t)}</span></div>`}
      <div class="pt-bd">
        <div class="pt-list">${S.story[i] ? `<div class="pt-notes">${notes(t)}</div>` : tab ? subsList(t) : main(t, i)}</div>
        <div class="pt-foot"><div class="pt-ic"><button class="pt-nc${STORY[t.id]?.some((x) => x[0] === 'ed') ? ' is-ed' : ''} ${S.story[i] ? 'is-on' : ''}" data-story="${i}" data-tip="${S.story[i] ? 'Назад к составу' : STORY[t.id]?.length ? `Рассказ ростера · ${STORY[t.id].length} ${STORY[t.id].length === 1 ? 'заметка' : 'заметки'}` : 'Нет заметок'}" ${STORY[t.id]?.length ? '' : 'disabled'}>${STORY[t.id]?.length ? `<sup>${STORY[t.id].length}</sup>` : ''}<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2.5 3h7M2.5 6h7M2.5 9h4.5"/></svg></button></div>${S.who === 'ed' ? `<span class="pt-sq"><button class="pt-add" data-add="${i}" data-tip="Добавить заметку"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M6 2.5v7M2.5 6h7"/></svg></button></span>` : ''}<span class="sp"></span><div class="pt-ic" role="group" aria-label="Состав"><button data-tab="${i}:0" data-tip="${t.subs.length ? 'Main — основной состав' : sw.length ? `Основной состав · ${sw.length} ${sw.length === 1 ? 'замена' : 'замены'}` : 'Основной состав без изменений'}" class="${!S.story[i] && !tab ? 'is-on' : ''} ${t.subs.length ? '' : 'is-only'}"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M6 1.2 10 2.6v3.1c0 2.4-1.7 4.3-4 5.1-2.3-.8-4-2.7-4-5.1V2.6z"/></svg></button>${t.subs.length ? `<button data-tab="${i}:1" data-tip="Subs — запасные · ${t.subs.length}" class="${!S.story[i] && tab ? 'is-on' : ''}"><sup>${t.subs.length}</sup><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h7l-2-2M10 8H3l2 2"/></svg></button>` : ''}</div></div>
      </div></div>`
  }

  function byPos() {
    const all = TEAMS.map((t) => { const x = cur(t)[S.pos - 1]; return { t, x, r: rOf(t, x.nick) } }).sort((a, b) => b.r.b - a.r.b)
    return `<div class="pt-pos"><div class="pt-seg">${[1, 2, 3, 4, 5].map((p) => `<button data-pos="${p}" class="${S.pos === p ? 'is-on' : ''}">Pos ${p}</button>`).join('')}</div>
      ${all.map((a, k) => `<div class="pt-r"><span class="k">${k + 1}</span>${fl(flagOf(a.t, a.x.nick))}<span class="n"><span>${a.x.nick}${a.x.sub ? `<span class="pt-ty">${tl(a.x.sub.type)}</span>` : ''}</span></span><span class="tm"><img src="${a.t.logo}"><span>${a.t.name}</span></span><span class="bar"><i style="width:${a.r.b}%"></i></span>${rt(a.r, "", S.pos)}</div>`).join('')}</div>`
  }

  // Порядок: посев (S.order — задаёт редактор перетаскиванием), рейтинг команды, по алфавиту
  const SORTS = [['seed', 'Посев'], ['rate', 'Рейтинг'], ['az', 'А–Я']]
  const ordered = () => S.sort === 'seed' ? S.order : [...S.order].sort(S.sort === 'rate' ? (a, b) => teamRate(TEAMS[b]) - teamRate(TEAMS[a]) : (a, b) => TEAMS[a].name.localeCompare(TEAMS[b].name))
  const canDrag = () => S.who === 'ed' && S.sort === 'seed'
  const sortSeg = () => `<div class="pt-ic" role="group" aria-label="Порядок">${SORTS.map(([k, n]) => `<button class="pt-nb ${S.sort === k ? 'is-on' : ''}" data-sort="${k}" data-tip="Порядок: ${n.toLowerCase()}">${n}</button>`).join('')}</div>`
  const GRIP = '<svg width="10" height="12" viewBox="0 0 10 12" fill="currentColor"><circle cx="3" cy="3" r="1"/><circle cx="7" cy="3" r="1"/><circle cx="3" cy="6" r="1"/><circle cx="7" cy="6" r="1"/><circle cx="3" cy="9" r="1"/><circle cx="7" cy="9" r="1"/></svg>'
  function list() {
    const hd = `<div class="pt-lh">${canDrag() ? '<span class="pd"></span>' : ''}<span class="pd">#</span><span class="pd pd--lg"></span><span class="nm">Команда</span><span class="pt-c pt-c--sw">Замены</span><span class="pt-c pt-c--sb">Subs</span><span class="pt-c pt-c--nt">Заметки</span><span class="pt-c pt-c--fm">Форма</span><span class="pt-c pt-c--tr">Рейтинг</span></div>`
    return `<div class="pt-lst pt-lst--${S.lm}">${hd}${ordered().map((i, k) => { const t = TEAMS[i], sw = S.swap[t.id] || [], n = STORY[t.id]?.length ?? 0
      return `<div class="pt-li" data-drag="${i}">${canDrag() ? `<span class="pt-grip" data-grip aria-label="Перетащить">${GRIP}</span>` : ''}<span class="sd">${k + 1}</span><img src="${t.logo}" alt="">
        <span class="nm"><b>${t.name}</b><small>${t.st}${t.q ? ` · ${t.q[0]} <i>${t.q[1]}</i>` : ''}</small></span>
        <span class="pt-c pt-c--sw">${sw.length ? `<span class="pt-ty">${sw.length} ${sw.length === 1 ? 'замена' : 'замены'}</span>` : '—'}</span>
        <span class="pt-c pt-c--sb">${t.subs.length || '—'}</span><span class="pt-c pt-c--nt">${n || '—'}</span>
        <span class="pt-c pt-c--fm">${SER(t.id).map((v) => `<span class="pt-hf ${tone(v)}" title="${t.name} — ${v[2]} · ${v[3]}.10">${v[0]}:${v[1]}</span>`).join('')}</span>
        <span class="tr">${teamRate(t)}</span></div>` }).join('')}</div>`
  }

  // v34: шторка фильтров (телефон)
  const VIEWS = [['teams', 'Карточки'], ['list', 'Список'], ['pos', 'По позиции']]
  const seg = (arr, key, cur) => `<div class="t5-seg">${arr.map(([k, n]) => `<button class="${cur === k ? 'is-on' : ''}" ${key}="${k}">${n}</button>`).join('')}</div>`
  const SX = [['view', 'Вид', VIEWS, 'data-view'], ['sort', 'Порядок', SORTS, 'data-sort'], ['lm', 'Колонки', [['info', 'Состав'], ['form', 'Форма']], 'data-lm'],
    ['pos', 'Позиция', [1, 2, 3, 4, 5].map((p) => [String(p), 'Pos ' + p]), 'data-pos']]
  const shown = (k) => k === 'view' || (k === 'sort' && S.view !== 'pos') || (k === 'lm' && S.view === 'list') || (k === 'pos' && S.view === 'pos')
  const SH = document.createElement('div'); SH.className = 'w pt-shost'
  SH.innerHTML = `<div class="pt-ov" data-sheet="0"></div><div class="pt-sh" role="dialog" aria-label="Фильтры"><div class="gr"></div><div class="hd">Фильтры</div>
    ${SX.map(([k, n, arr, key]) => `<div class="pt-sx" data-sx="${k}"><div><div><div class="lbl">${n}</div>${seg(arr, key, '')}</div></div></div>`).join('')}
    <button class="ok" data-sheet="0">Готово</button></div>`
  document.body.append(SH)
  function sheet() { // только классы — DOM шторки живёт, поэтому сегмент переезжает (_cons.js), а разделы раскрываются переходом
    SH.classList.toggle('is-open', S.sheet && DEV[S.dev].id === 'phone')
    SX.forEach(([k, , , key]) => { const box = SH.querySelector(`[data-sx="${k}"]`), cur = String(S[k])
      box.classList.toggle('is-hide', !shown(k)); box.querySelectorAll('button').forEach((b) => b.classList.toggle('is-on', b.getAttribute(key) === cur)) }) }
  SH.addEventListener('click', (e) => { const b = e.target.closest('[data-sheet], [data-view], [data-sort], [data-lm], [data-pos]'); if (!b) return
    if (b.dataset.sheet) S.sheet = false
    else if (b.dataset.view) S.view = b.dataset.view; else if (b.dataset.sort) S.sort = b.dataset.sort; else if (b.dataset.lm) S.lm = b.dataset.lm; else S.pos = +b.dataset.pos
    close(); render() })

  let sortWas = S.view !== 'pos'
  function render() {
    document.body.classList.toggle('is-phone', DEV[S.dev].id === 'phone')
    const n = S.n16 === 'on' ? 16 : TEAMS.length
    w.innerHTML = `<div class="w pt"><div class="w-hd"><span class="w-hd__t">Участники <span class="pt-who pt-who--${S.who}">${WHO.find((x) => x.id === S.who).name}</span></span><span class="sub">${canDrag() && S.view !== 'pos' ? 'Тяни ⋮⋮ — задашь посев' : `${n} команд · рейтинг на этот турнир`}</span>
        <button class="pt-flt" data-sheet="1"><svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><rect x="1" y="2" width="10" height="1.5" rx=".75"/><rect x="3" y="5.25" width="6" height="1.5" rx=".75"/><rect x="5" y="8.5" width="2" height="1.5" rx=".75"/></svg>Фильтры</button><div class="pt-ic" role="group" aria-label="Вид"><button data-view="teams" title="Команды" class="${S.view === 'teams' ? 'is-on' : ''}"><svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><rect x="1" y="1" width="4" height="4" rx="1"/><rect x="7" y="1" width="4" height="4" rx="1"/><rect x="1" y="7" width="4" height="4" rx="1"/><rect x="7" y="7" width="4" height="4" rx="1"/></svg></button><button data-view="list" title="Список" class="${S.view === 'list' ? 'is-on' : ''}"><svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><rect x="1" y="2" width="10" height="2" rx="1"/><rect x="1" y="5" width="10" height="2" rx="1"/><rect x="1" y="8" width="10" height="2" rx="1"/></svg></button><button data-view="pos" title="По позиции" class="${S.view === 'pos' ? 'is-on' : ''}"><svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><rect x="1" y="1.5" width="2" height="2" rx=".5"/><rect x="4.5" y="1.5" width="6.5" height="2" rx="1"/><rect x="1" y="5" width="2" height="2" rx=".5"/><rect x="4.5" y="5" width="5" height="2" rx="1"/><rect x="1" y="8.5" width="2" height="2" rx=".5"/><rect x="4.5" y="8.5" width="3.5" height="2" rx="1"/></svg></button></div><span class="pt-hx${sortWas ? '' : ' is-hide'}"><span>${sortSeg()}</span></span></div>
      ${S.view === 'list' ? list() : S.view === 'teams' ? `<div class="pt-grid">${ordered().map((i) => team(TEAMS[i], i)).join('')}${S.n16 === 'on' ? [...Array(16 - TEAMS.length)].map(() => '<div class="pt-tm slot">TBD · квалификация</div>').join('') : ''}</div>` : byPos()}</div>`
    // ПК: «Посев · Рейтинг · А–Я» уезжает / выезжает, как разделы шторки — рисуем в прошлом состоянии, в следующем кадре переключаем
    const hx = w.querySelector('.pt-hx'), on = S.view !== 'pos'; sortWas = on
    requestAnimationFrame(() => requestAnimationFrame(() => hx?.classList.toggle('is-hide', !on)))
    sheet()
  }

  let pop = null
  const close = () => { pop?.remove(); pop = null }
  function openPop(el, t, k) {
    close()
    const orig = t.p[k].nick, has = (S.swap[t.id] || []).find((x) => x.pos === k + 1)
    const cands = t.subs.length ? t.subs.map((x) => x.nick) : ['Запасной А']
    let type = has?.type || 'map'
    pop = document.createElement('div'); pop.className = 'pt-pop w'
    const draw = () => {
      pop.innerHTML = `<div class="t">Замена · ${orig} · Pos ${k + 1}</div><div class="lbl">Срок</div>
        <div class="pt-seg">${TYPES.map(([v, s]) => `<button data-type="${v}" class="${type === v ? 'is-on' : ''}">${s}</button>`).join('')}</div>
        <div class="lbl">Кто выходит</div>
        <div>${cands.map((n) => `<button class="opt" data-who="${n}">${fl(flagOf(t, n))}<span>${n}</span>${rt(rOf(t, n), "", k + 1)}</button>`).join('')}
        ${has ? `<button class="opt" data-who=""><span>Вернуть ${orig}</span></button>` : ''}</div>`
    }
    draw()
    pop.addEventListener('click', (e) => {
      e.stopPropagation()
      const ty = e.target.closest('[data-type]'); if (ty) { type = ty.dataset.type; return draw() }
      const o = e.target.closest('[data-who]'); if (!o) return
      const list = (S.swap[t.id] || []).filter((x) => x.pos !== k + 1)
      if (o.dataset.who) list.push({ pos: k + 1, who: o.dataset.who, type })
      S.swap[t.id] = list; close(); render()
    })
    document.body.append(pop)
    const b = el.getBoundingClientRect()
    pop.style.left = Math.max(8, Math.min(b.left, innerWidth - 268)) + 'px'
    pop.style.top = Math.max(8, Math.min(b.bottom + 4, innerHeight - pop.offsetHeight - 8)) + 'px'
  }

  const notes = (t) => STORY[t.id].map(([k, s]) => `<div class="pt-nt ${k}"><span class="ico">${k === 'ed' ? '★' : '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M6 1.5v2M6 8.5v2M1.5 6h2M8.5 6h2M3 3l1.2 1.2M7.8 7.8L9 9M9 3L7.8 4.2M4.2 7.8L3 9"/></svg>'}</span><p>${s}<small>${k === 'ed' ? 'Редакция' : 'Авто · по данным матчей'}</small></p></div>`).join('')
  function openAdd(el, t) {
    close()
    pop = document.createElement('div'); pop.className = 'pt-pop w'
    pop.innerHTML = `<div class="t">Заметка · ${t.name}</div><div class="lbl">★ Редакция — видят все</div>
      <textarea rows="3" placeholder="Например: Yuma пришёл месяц назад — с ним стали играть лучше" style="resize:none;background:var(--w-mid-bg);border:1px solid var(--w-border);border-radius:6px;color:var(--w-fg);font:var(--t-cell);padding:8px"></textarea>
      <button class="opt" data-save style="justify-content:center;background:var(--w-fg);color:var(--w-bg)">Добавить</button>`
    pop.addEventListener('click', (e) => {
      e.stopPropagation()
      if (!e.target.closest('[data-save]')) return
      const v = pop.querySelector('textarea').value.trim(); if (!v) return
      ;(STORY[t.id] ||= []).push(['ed', v]); close(); render()
    })
    document.body.append(pop)
    const b = el.getBoundingClientRect()
    pop.style.left = Math.max(8, Math.min(b.left, innerWidth - 268)) + 'px'
    pop.style.top = Math.max(8, Math.min(b.bottom + 4, innerHeight - pop.offsetHeight - 8)) + 'px'
    pop.querySelector('textarea').focus()
  }
  function openStory(el, t) {
    close()
    pop = document.createElement('div'); pop.className = 'pt-pop w'
    pop.innerHTML = `<div class="t">${t.name} · рассказ ростера</div><div class="pt-st" style="margin:0;padding:0;border:0">${STORY[t.id].map(([k, s]) => `<div class="${k}"><em>${k === 'ed' ? '★ редакция' : 'авто'}</em>${s}</div>`).join('')}</div>`
    pop.addEventListener('click', (e) => e.stopPropagation())
    document.body.append(pop)
    const b = el.getBoundingClientRect()
    pop.style.left = Math.max(8, Math.min(b.left, innerWidth - 268)) + 'px'
    pop.style.top = Math.max(8, Math.min(b.bottom + 4, innerHeight - pop.offsetHeight - 8)) + 'px'
  }

  w.addEventListener('click', (e) => {
    e.stopPropagation()
    const v = e.target.closest('[data-view]'); if (v) { S.view = v.dataset.view; close(); return render() }
    const sh = e.target.closest('[data-sheet]'); if (sh) { S.sheet = sh.dataset.sheet === '1'; close(); return render() }
    const lm = e.target.closest('[data-lm]'); if (lm) { S.lm = lm.dataset.lm; return render() }
    const so = e.target.closest('[data-sort]'); if (so) { S.sort = so.dataset.sort; return render() }
    const p = e.target.closest('[data-pos]'); if (p) { S.pos = +p.dataset.pos; return render() }
    const tb = e.target.closest('[data-tab]'); if (tb) { const [i, k] = tb.dataset.tab.split(':'); S.tab[i] = +k; S.story[i] = false; return render() }
    const c = e.target.closest('[data-col]'); if (c) { const i = c.dataset.col; S.col[i] = !S.col[i]; return render() }
    const rs = e.target.closest('[data-reset]'); if (rs) { S.swap[TEAMS[+rs.dataset.reset].id] = []; return render() }
    const ad = e.target.closest('[data-add]'); if (ad) return openAdd(ad, TEAMS[+ad.dataset.add])
    const st = e.target.closest('[data-story]'); if (st && !st.disabled) { const i = st.dataset.story; S.story[i] = !S.story[i]; return render() }
    const r = e.target.closest('.pt-r[data-t]'); if (r && S.who === 'ed') openPop(r, TEAMS[+r.dataset.t], +r.dataset.i)
  })
  document.addEventListener('click', close)
  // перетаскивание за ручку (редактор, порядок «Посев»): указателем — мышь и палец. Призрак едет за курсором,
  // на месте — пунктир, соседи расступаются плавно (FLIP); отпустил — новый порядок в S.order
  w.addEventListener('pointerdown', (e) => {
    const g = e.target.closest('[data-grip]'); if (!g || !canDrag()) return
    e.preventDefault(); close()
    const item = g.closest('[data-drag]'), box = item.parentElement, r0 = item.getBoundingClientRect()
    const dx = e.clientX - r0.left, dy = e.clientY - r0.top
    const ghost = item.cloneNode(true); ghost.classList.add('pt-ghost', 'w'); ghost.style.width = r0.width + 'px'; ghost.style.height = r0.height + 'px'
    ghost.style.left = r0.left + 'px'; ghost.style.top = r0.top + 'px'; document.body.append(ghost)
    item.classList.add('is-ph'); document.body.classList.add('is-dragging')
    const items = () => [...box.querySelectorAll(':scope > [data-drag]')]
    const flip = (fn) => { const before = new Map(items().map((x) => [x, x.getBoundingClientRect()])); fn()
      items().forEach((x) => { if (x === item) return; const a = before.get(x), b = x.getBoundingClientRect(); if (!a) return
        const tx = a.left - b.left, ty = a.top - b.top; if (!tx && !ty) return
        x.style.transition = 'none'; x.style.transform = `translate(${tx}px, ${ty}px)`; x.getBoundingClientRect()
        x.style.transition = 'transform .18s ease'; x.style.transform = '' }) }
    const move = (ev) => {
      ghost.style.left = ev.clientX - dx + 'px'; ghost.style.top = ev.clientY - dy + 'px'
      const over = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('[data-drag]')
      if (!over || over === item || over.parentElement !== box) return
      const list = items(), from = list.indexOf(item), to = list.indexOf(over)
      flip(() => box.insertBefore(item, from < to ? over.nextSibling : over))
    }
    const up = () => {
      removeEventListener('pointermove', move); removeEventListener('pointerup', up)
      document.body.classList.remove('is-dragging'); ghost.remove()
      S.order = items().map((x) => +x.dataset.drag); render()
    }
    addEventListener('pointermove', move); addEventListener('pointerup', up)
  })

  const OFFON = [{ v: 'off', label: 'Нет' }, { v: 'on', label: 'Да' }]
  window.LAB = { view: 'toolbar', go: (f, i) => { S.dev = i; render() }, cur: () => ({ f: 0, i: S.dev }),
    flows: () => [{ name: 'Экран', steps: DEV.map((d) => ({ name: d.name, what: d.name })) }],
    axes: () => [{ key: 'who', name: 'Кто смотрит', value: S.who, options: WHO.map((x) => ({ v: x.id, label: x.name })) },
      { key: 'device', name: 'Экран', value: DEV[S.dev].id, options: DEV.map((d) => ({ v: d.id, label: d.name })) },
      { key: 'n16', name: '16 команд', value: S.n16, options: OFFON }],
    set: (k, v) => { if (k === 'device') S.dev = DEV.findIndex((d) => d.id === v); else S[k] = v; close(); render() },
    caption: () => (S.who === 'ed' ? 'Редактор: нажми игрока — замена из Subs со сроком (Map / Series / Day / Tournament), состав и рейтинг команды пересчитаются; «Вернуть состав» — отменить замены команды.' : 'Зритель: только смотрит — состав, запас и кто на кого заменён; нажать игрока нельзя.') + ' ‼️ Рейтинги, форма, объявленные замены — пример' }
  render()
</script>
</body></html>
