<!doctype html>
<html lang="ru"><head><meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&family=Archivo:wdth,wght@62..125,700..900&display=swap" />
<link rel="stylesheet" href="/sandbox-public/site/styles.css" /><link rel="stylesheet" href="../бустеры/_бустер.css" />
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<!-- v5 · Пасть. Пак — голографическая фольга. Режешь поперёк (наклон — как хочешь, до 40°) — половины не разлетаются,
     а раскрываются к тебе, как створки раковины: верх на верхнем шве, низ на нижнем. Из пасти льётся свет — сначала узкой
     щелью, потом во всю ширину; карты вылетают прямо из неё, створки захлопываются за ними и пак падает. -->
<div class="bs"></div>
<script type="module">
import { start } from '../бустеры/_бустер.js'
import { THREE, RAR, makePack, Trail, Cutter } from './_пак.js'
const W = 1.6, H = 2.45
start({
  name: 'Пасть',
  note: 'Голографический пак. Режь поперёк — половины раскрываются к тебе, как створки раковины, из щели льётся свет, карты вылетают прямо из пасти.',
  hint: 'Режь поперёк пака',
  build(K) {
    const g = new THREE.Group(), P = makePack(K, { W, H, finish: 'foil', irid: 1, name: 'Голо · ' + RAR[K.rar].ru }); g.add(P.g)
    const trail = new Trail(K), cutter = new Cutter(g, P.g, W, H)
    let a = null, drawing = false, done = false
    // Свет из пасти: тонкая плоскость по линии разреза, растёт в высоту, пока створки раскрываются
    const mouthMat = new THREE.MeshBasicMaterial({ color: K.glow(), map: K.softTex, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false })
    const mouth = new THREE.Mesh(new THREE.PlaneGeometry(W * 1.4, 1), mouthMat); mouth.scale.y = 0.02; g.add(mouth)
    const open = async (p1, p2) => {
      done = true; K.hint('')
      const [[A, B]] = cutter.cut(p1, p2)
      const up = A.n.y > 0 ? A : B, dn = up === A ? B : A
      // Створки на петлях: верх — у верхнего шва, низ — у нижнего
      const hinge = (pc, y) => { const pv = new THREE.Group(); pv.position.set(0, y, 0); g.add(pv); pc.h.position.y -= y; pv.add(pc.h); return pv }
      const hu = hinge(up, H / 2), hd = hinge(dn, -H / 2)
      mouth.position.copy(A.mid).setZ(0.05); mouth.rotation.z = Math.atan2(A.dir.y, A.dir.x)
      const c = g.localToWorld(A.mid.clone()).setZ(0.6)
      // 1. Щель: створки приоткрываются, свет узкой полосой
      K.sparks(c, 0.5, 0.3)
      await K.tween(500, (k) => { hu.rotation.x = -k * 0.25; hd.rotation.x = k * 0.25; mouthMat.opacity = k * 0.8; mouth.scale.y = 0.02 + k * 0.12; K.lightAt(c, k * 0.35, 1) }, K.back)
      await K.wait(250)
      // 2. Пасть распахивается
      K.flash(0.6); K.shock(c, 8); K.confetti(c, 1, 2.2); K.sparks(c, 1.1, 0.8)
      await K.tween(520, (k) => { hu.rotation.x = -0.25 - k * 1.05; hd.rotation.x = 0.25 + k * 1.05; mouth.scale.y = 0.14 + k * 0.9; mouthMat.opacity = 0.8 + k * 0.2; K.lightAt(c, 0.35 + k * 0.65, 1.3); K.rays(c, k) }, K.back)
      K.reveal(45)
      // 3. Створки захлопываются, пак падает
      await K.wait(500)
      K.tween(380, (k) => { hu.rotation.x = -1.3 * (1 - k); hd.rotation.x = 1.3 * (1 - k); mouthMat.opacity = 1 - k }, (k) => k * k)
      K.tween(1000, (k) => { g.position.y = -k * k * 4.3 })
      await K.tween(1500, (k) => { K.lightAt(c, 1 - k * 0.7, 1.3); K.rays(c, 1 - k * 0.6) })
    }
    // Поперёк: угол разреза к горизонтали не больше 40°
    const across = (p1, p2) => Math.abs(Math.atan2(p2.y - p1.y, Math.abs(p2.x - p1.x))) < 0.7
    return {
      g, open: async () => {},
      down(e) { if (done) return; drawing = true; trail.push(trail.local(e)); a = K.onPlane(e) },
      move(e) { if (drawing) trail.push(trail.local(e)) },
      up(e) {
        if (!drawing) return; drawing = false
        const b = K.onPlane(e), la = P.g.worldToLocal(a.clone()), lb = P.g.worldToLocal(b.clone())
        if (!Cutter.crosses(la, lb, W, H)) K.hint('Режь через весь пак — от края до края')
        else if (!across(la, lb)) K.hint('Поперёк — слева направо')
        else { K.open(); open(a, b) }
      },
      auto() {
        if (done) return
        const a0 = P.g.localToWorld(new THREE.Vector3(-W * 0.9, 0.12, 0)), b0 = P.g.localToWorld(new THREE.Vector3(W * 0.9, -0.05, 0))
        K.tween(260, (k) => trail.push(trail.screen(a0.clone().lerp(b0, k))), (k) => k).then(() => { K.open(); open(a0, b0) })
      },
      tick(dt, t) { trail.draw(); if (!done) P.g.position.y = Math.sin(t * 1.5) * 0.05; cutter.update() },
    }
  },
})
</script>
</body></html>
