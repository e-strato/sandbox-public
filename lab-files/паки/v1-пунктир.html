<!doctype html>
<html lang="ru"><head><meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&family=Archivo:wdth,wght@62..125,700..900&display=swap" />
<link rel="stylesheet" href="/sandbox-public/site/styles.css" /><link rel="stylesheet" href="../бустеры/_бустер.css" />
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<!-- v1 · Разрез по пунктиру. Помесь «зажми и сорви» и «разрежь»: под верхним швом — пунктир «отрезать здесь». Ведёшь по нему —
     разрез идёт ровно за курсором: щель светится, на кончике сыплются искры, пак подрагивает. Дошёл до края — верхняя полоска
     отгибается, как крышка, и отлетает, из прорези бьёт свет, карты вылетают. Пак — мятая фольга. -->
<div class="bs"></div>
<script type="module">
import { start } from '../бустеры/_бустер.js'
import { THREE, packFace, foil, crimpMat, pillow, Trail } from './_пак.js'
const W = 1.6, H = 2.45, D = 0.14, CH = 0.1, Y = H / 2 - 0.34
const zig = (x) => Math.sin(x * 61) * 0.008 + Math.sin(x * 23 + 2) * 0.006
start({
  name: 'Разрез по пунктиру',
  note: 'Веди по пунктиру под верхним швом — разрез идёт за курсором, щель светится, на кончике искры. Дошёл до края — полоска отгибается и отлетает.',
  hint: 'Веди по пунктиру',
  build(K) {
    const g = new THREE.Group(), pack = new THREE.Group(); g.add(pack)
    const front = foil(K.rar, packFace(K.rar)), back = foil(K.rar, packFace(K.rar, { back: true })), cm = crimpMat(K.rar)
    const part = (y0, y1, z0, z1) => { const p = new THREE.Group(); p.add(new THREE.Mesh(pillow(W, H, D, { y0, y1, zig0: z0, zig1: z1 }), front)); const b = new THREE.Mesh(pillow(W, H, D, { y0, y1, zig0: z0, zig1: z1, back: true }), back); b.rotation.y = Math.PI; p.add(b); return p }
    const body = part(-H / 2, Y, null, zig), strip = part(Y, H / 2, zig, null)
    const crimp = (y) => { const m = new THREE.Mesh(new THREE.BoxGeometry(W * 1.01, CH, 0.024), cm); m.position.y = y; return m }
    body.add(crimp(-H / 2 + CH / 2)); strip.add(crimp(H / 2 - CH / 2))
    // Полоска отгибается вокруг линии разреза — опора на ней
    const hinge = new THREE.Group(); hinge.position.y = Y; strip.position.y = -Y; hinge.add(strip)
    pack.add(body, hinge)
    // Пунктир «отрезать здесь» и ножницы-метка слева
    const zFront = (x) => D * Math.pow(Math.max(0, 1 - (x / (W / 2)) ** 2), 0.55) * (1 - THREE.MathUtils.smoothstep(Math.abs(Y / (H / 2)), 0.76, 0.92)) + 0.006
    const dashMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.75 })
    for (let x = -W / 2 + 0.08; x < W / 2 - 0.06; x += 0.09) { const m = new THREE.Mesh(new THREE.PlaneGeometry(0.05, 0.012), dashMat); m.position.set(x + 0.025, Y, zFront(x + 0.025)); pack.add(m) }
    // Светящаяся щель: растёт от точки начала до курсора
    const slitMat = new THREE.MeshBasicMaterial({ color: K.glow(), transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false })
    const slit = new THREE.Mesh(new THREE.PlaneGeometry(1, 0.03), slitMat); slit.position.set(0, Y, D * 0.5); slit.scale.x = 0.0001; pack.add(slit)
    const tip = new THREE.Sprite(new THREE.SpriteMaterial({ color: K.glow(), map: K.softTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0 })); tip.scale.setScalar(0.5); pack.add(tip)

    const trail = new Trail(K, { life: 250, width: 10 })
    let lo = null, hi = null, cutting = false, done = false, fizz = 0
    const setCut = () => { const a = lo, b = hi; slit.scale.x = Math.max(0.0001, b - a); slit.position.x = (a + b) / 2; K.lightAt(pack.localToWorld(new THREE.Vector3(0, Y, -0.2)), Math.min(0.5, (b - a) / W * 0.5), 1.2) }
    const near = (p) => Math.abs(p.y - Y) < 0.28 && Math.abs(p.x) < W / 2 + 0.4
    const at = (e) => pack.worldToLocal(K.onPlane(e, D * 0.4))
    const advance = (x) => {
      x = THREE.MathUtils.clamp(x, -W / 2, W / 2)
      if (lo === null) lo = hi = x
      lo = Math.min(lo, x); hi = Math.max(hi, x); setCut()
      tip.position.set(x, Y, D * 0.6); tip.material.opacity = 1
      if ((fizz -= 1) < 0) { fizz = 3; K.sparks(pack.localToWorld(new THREE.Vector3(x, Y, 0.2)), 0.18, 0.4) }
      pack.position.x = (Math.random() - 0.5) * 0.012
      if (lo <= -W / 2 + 0.04 && hi >= W / 2 - 0.04) K.open()
    }
    const go = async () => {
      done = true; cutting = false; K.hint(''); tip.material.opacity = 0
      const mouth = pack.localToWorld(new THREE.Vector3(0, Y + 0.05, 0.3))
      // Полоска отгибается назад, как крышка, и улетает с кувырком
      await K.tween(260, (k) => { hinge.rotation.x = -k * 0.9 }, K.back)
      K.flash(0.6); K.shock(mouth, 8); K.sparks(mouth, 1, 2.6); K.confetti(mouth, 1, 3.4)
      K.tween(1100, (k) => { hinge.position.set(k * 1.8, Y + k * 2.4 - k * k * 0.7, -k * 0.6); hinge.rotation.set(-0.9 - k * 4, k * 1.2, -k * 2) })
      await K.tween(450, (k) => { K.lightAt(mouth, 0.5 + k * 0.5, 1.25); K.rays(mouth, k); slitMat.opacity = 1 - k })
      K.reveal(40)
      K.tween(900, (k) => { pack.position.y = -k * 4.2; pack.rotation.z = -k * 0.2 }, (k) => k * k)
      await K.tween(1600, (k) => { K.lightAt(mouth, 1 - k * 0.7, 1.25); K.rays(mouth, 1 - k * 0.6) })
    }
    return {
      g, open: go,
      down(e) { if (done) return; const p = at(e); if (near(p)) { cutting = true; trail.push(trail.local(e)); advance(p.x) } else K.hint('Начни с пунктира под верхним швом') },
      move(e) { if (!cutting || done) return; trail.push(trail.local(e)); const p = at(e); if (near(p)) advance(p.x) },
      up() { cutting = false; if (!done) tip.material.opacity = 0.4 },
      auto() { if (done) return; const x0 = lo ?? -W / 2; K.tween(900, (k) => { const x = x0 + (W / 2 - x0) * k; advance(x); if (k < 1) advance(-W / 2 + (x0 + W / 2) * (1 - k)); trail.push(trail.screen(pack.localToWorld(new THREE.Vector3(x, Y, D)))) }, (k) => k) },
      tick(dt, t) {
        trail.draw()
        if (done) return
        pack.position.y = Math.sin(t * 1.5) * 0.05
        if (!cutting && lo !== null) tip.material.opacity = 0.4 + Math.sin(t * 5) * 0.2
      },
    }
  },
})
</script>
</body></html>
