<!doctype html>
<html lang="ru"><head><meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&family=Archivo:wdth,wght@62..125,700..900&display=swap" />
<link rel="stylesheet" href="/sandbox-public/site/styles.css" /><link rel="stylesheet" href="../бустеры/_бустер.css" />
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<style>
.cuts { position: absolute; left: 50%; top: 92px; z-index: 5; translate: -50% 0; display: flex; gap: 8px; pointer-events: none; }
.cuts i { width: 34px; height: 6px; border-radius: 3px; background: var(--c-ui-item); transition: background .3s, box-shadow .3s; }
.cuts i.is-on { background: var(--rc); box-shadow: 0 0 14px var(--rc); }
</style>
</head>
<body>
<!-- v4 · Нарезка: три разреза. Пак — мятая фольга. Каждый разрез делит все куски, которые задел; куски чуть разъезжаются и висят,
     между ними сочится свет — с каждым разрезом сильнее. Можно резать как угодно: крест, звезда, полосы. Третий разрез — куски
     разлетаются во все стороны от центра, свет, карты. Сверху — три деления, сколько разрезов осталось. -->
<div class="bs"></div>
<script type="module">
import { start } from '../бустеры/_бустер.js'
import { THREE, RAR, makePack, Trail, Cutter } from './_пак.js'
const W = 1.6, H = 2.45, N = 3
start({
  name: 'Нарезка: три разреза',
  note: 'Каждый разрез делит задетые куски — они разъезжаются и висят, между ними свет. Режь крестом, звездой, полосами. Третий — куски разлетаются.',
  hint: 'Режь — 3 раза',
  build(K) {
    const g = new THREE.Group(), P = makePack(K, { W, H, finish: 'foil', name: RAR[K.rar].ru }); g.add(P.g)
    const trail = new Trail(K, { life: 300 }), cutter = new Cutter(g, P.g, W, H)
    const bar = K.host.querySelector('.cuts') || K.host.appendChild(Object.assign(document.createElement('div'), { className: 'cuts', innerHTML: '<i></i>'.repeat(N) }))
    bar.querySelectorAll('i').forEach((i) => i.classList.remove('is-on'))
    let a = null, drawing = false, done = false, n = 0
    // У каждого куска — куда он «висит» (смещение от разрезов), плюс лёгкое покачивание
    const off = new Map()
    const slice = async (p1, p2) => {
      const pairs = cutter.cut(p1, p2)
      if (!pairs.length) return K.hint('Мимо — режь через куски')
      n++; bar.querySelectorAll('i').forEach((i, k) => i.classList.toggle('is-on', k < n))
      // Новые куски — копии родителя на его месте; разводим их по нормали разреза
      pairs.forEach(([A, B]) => { const base = A.h.position.clone(); off.set(A.h, base.clone().addScaledVector(A.n, 0.09)); off.set(B.h, base.clone().addScaledVector(A.n, -0.09)) })
      // Куски, которых не задело, сохраняют своё смещение
      cutter.pieces.forEach((p) => { if (!off.has(p.h)) off.set(p.h, new THREE.Vector3()) })
      const c = g.localToWorld(pairs[0][0].mid.clone()).setZ(0.3)
      K.sparks(c, 0.45 + n * 0.15, 0.4)
      K.lightAt(new THREE.Vector3(0, 0, -0.2), n / N * 0.6, 1.3)
      K.tween(220, (k) => g.position.x = Math.sin(k * 30) * 0.03 * (1 - k), (k) => k)
      if (n >= N) { K.open(); boom() } else K.hint(`Ещё ${N - n}`)
    }
    const boom = async () => {
      done = true; K.hint('')
      const c = new THREE.Vector3(0, 0, 0.3)
      K.flash(0.85); K.shock(c, 10); K.sparks(c, 1.3, 1.6); K.confetti(c, 1.2, 3)
      // Каждый кусок летит от центра пака по направлению к своему центру
      const pieces = cutter.pieces.map((p) => { const ctr = p.poly.reduce((s, q) => s.add(new THREE.Vector3(q.x, q.y, 0)), new THREE.Vector3()).divideScalar(p.poly.length); return { p, dir: ctr.lengthSq() < 1e-4 ? new THREE.Vector3(0, -1, 0) : ctr.normalize(), base: p.h.position.clone(), spin: new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).multiplyScalar(6) } })
      K.tween(1400, (k) => pieces.forEach(({ p, dir, base, spin }) => { p.h.position.copy(base).addScaledVector(dir, k * 3.4).add(new THREE.Vector3(0, -k * k * 2.5, k * 1.5)); p.h.rotation.set(spin.x * k, spin.y * k, spin.z * k) }))
      await K.tween(420, (k) => { K.lightAt(c, 0.6 + k * 0.4, 1.3); K.rays(c, k) })
      K.reveal(46)
      await K.tween(1600, (k) => { K.lightAt(c, 1 - k * 0.7, 1.3); K.rays(c, 1 - k * 0.6) })
    }
    const cross = (p1, p2) => { const A = P.g.worldToLocal(p1.clone()), B = P.g.worldToLocal(p2.clone()); return A.distanceTo(B) > 0.8 }
    return {
      g, open: async () => {},
      down(e) { if (done) return; drawing = true; trail.push(trail.local(e)); a = K.onPlane(e) },
      move(e) { if (drawing) trail.push(trail.local(e)) },
      up(e) { if (!drawing) return; drawing = false; const b = K.onPlane(e); if (cross(a, b)) slice(a, b); else K.hint('Длиннее — режь через пак') },
      // «Открыть»: три разреза звездой
      async auto() {
        const L = [[[-1, 0.7], [1, -0.5]], [[1, 0.7], [-1, -0.5]], [[0, 1.3], [0.15, -1.3]]]
        for (const [[x1, y1], [x2, y2]] of L.slice(n)) {
          if (done) break
          const a0 = new THREE.Vector3(x1 * W * 0.9, y1 * H * 0.5, 0), b0 = new THREE.Vector3(x2 * W * 0.9, y2 * H * 0.5, 0)
          await K.tween(220, (k) => trail.push(trail.screen(a0.clone().lerp(b0, k))), (k) => k)
          await slice(a0, b0); await K.wait(380)
        }
      },
      tick(dt, t) {
        trail.draw()
        if (!done) {
          g.position.y = Math.sin(t * 1.5) * 0.05
          cutter.pieces.forEach((p, i) => { const o = off.get(p.h); if (o) { p.h.position.lerp(o, 0.12); p.h.rotation.z = Math.sin(t * 1.2 + i) * 0.015 * Math.min(1, o.length() * 8) } })
        }
        cutter.update()
      },
    }
  },
})
</script>
</body></html>
