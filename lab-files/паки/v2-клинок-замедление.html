<!doctype html>
<html lang="ru"><head><meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&family=Archivo:wdth,wght@62..125,700..900&display=swap" />
<link rel="stylesheet" href="/sandbox-public/site/styles.css" /><link rel="stylesheet" href="../бустеры/_бустер.css" />
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<style>
/* Замедление: сцена чуть выцветает и уходит в холодный тон, по краям виньетка — как «время остановилось» */
.bs::after { content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0; transition: opacity .25s;
  background: radial-gradient(70% 70% at 50% 45%, transparent 40%, color-mix(in srgb, var(--c-black) 70%, transparent)); }
.bs.is-slow::after { opacity: 1; }
.bs.is-slow canvas:first-child { filter: saturate(.55) brightness(1.1); transition: filter .25s; }
</style>
</head>
<body>
<!-- v2 · Клинок и замедление. Пак — зеркальный хром с переливом. Проводишь клинком через пак под любым углом — в момент разреза
     время почти останавливается: половины медленно расходятся, в щели видно свет, искры висят в воздухе, сцена выцветает.
     Через секунду время срывается обратно — вспышка, волна, половины разлетаются, карты. -->
<div class="bs"></div>
<script type="module">
import { start } from '../бустеры/_бустер.js'
import { THREE, RAR, makePack, Trail, Cutter } from './_пак.js'
const W = 1.6, H = 2.45
start({
  name: 'Клинок и замедление',
  note: 'Хромированный пак. Режь под любым углом — в момент разреза время почти останавливается: половины медленно расходятся, искры висят. Потом время срывается — вспышка.',
  hint: 'Проведи клинком через пак',
  build(K) {
    const g = new THREE.Group(), P = makePack(K, { W, H, finish: 'chrome', irid: 1, name: 'Хром · ' + RAR[K.rar].ru, D: 0.11 }); g.add(P.g)
    const trail = new Trail(K, { life: 420, width: 12 }), cutter = new Cutter(g, P.g, W, H)
    let a = null, drawing = false, done = false, pair = null, slowK = 0
    const cut = async (p1, p2) => {
      done = true; K.hint('')
      ;[pair] = cutter.cut(p1, p2)
      const [A, B] = pair, c = g.localToWorld(A.mid.clone()).setZ(0.25)
      const seam = new THREE.Mesh(new THREE.PlaneGeometry(Math.hypot(W, H) * 1.1, 0.03), new THREE.MeshBasicMaterial({ color: K.glow(), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }))
      seam.position.copy(A.mid).setZ(0.1); seam.rotation.z = Math.atan2(A.dir.y, A.dir.x); g.add(seam)
      // 1. Замедление: время ×0,08, половины еле расходятся, щель светится
      K.host.classList.add('is-slow'); K.timeScale = 0.08
      K.sparks(c, 0.9, 0.6)
      await K.tween(1300, (k) => { [A, B].forEach((p, i) => { const s = i ? -1 : 1; p.h.position.copy(A.n).multiplyScalar(s * k * 0.12); p.h.rotation.z = s * k * 0.03 }); K.lightAt(c, k * 0.45, 1); seam.material.opacity = 0.6 + k * 0.4 }, (k) => k)
      // 2. Время срывается
      K.host.classList.remove('is-slow'); K.timeScale = 1
      K.flash(0.9); K.shock(c, 10, 700); K.confetti(c, 1.2, 2.8)
      K.tween(1300, (k) => [A, B].forEach((p, i) => { const s = i ? -1 : 1; p.h.position.copy(A.n).multiplyScalar(s * (0.12 + k * 1.6)); p.h.position.y -= k * k * 3.5; p.h.rotation.set(0, s * k * 0.8, s * (0.03 + k * 0.7)) }))
      await K.tween(380, (k) => { K.lightAt(c, 0.45 + k * 0.55, 1.3); K.rays(c, k); seam.material.opacity = 1 - k })
      K.reveal(46)
      await K.tween(1600, (k) => { K.lightAt(c, 1 - k * 0.7, 1.3); K.rays(c, 1 - k * 0.6) })
    }
    return {
      g, open: async () => {},
      down(e) { if (done) return; drawing = true; trail.push(trail.local(e)); a = K.onPlane(e) },
      move(e) { if (drawing) trail.push(trail.local(e)) },
      up(e) {
        if (!drawing) return; drawing = false
        const b = K.onPlane(e)
        if (Cutter.crosses(P.g.worldToLocal(a.clone()), P.g.worldToLocal(b.clone()), W, H)) { K.open(); cut(a, b) } else K.hint('Режь через весь пак — от края до края')
      },
      auto() {
        if (done) return
        const a0 = P.g.localToWorld(new THREE.Vector3(-W * 0.9, H * 0.62, 0)), b0 = P.g.localToWorld(new THREE.Vector3(W * 0.9, -H * 0.3, 0))
        K.tween(260, (k) => trail.push(trail.screen(a0.clone().lerp(b0, k))), (k) => k).then(() => { K.open(); cut(a0, b0) })
      },
      tick(dt, t) {
        trail.draw()
        if (!done) { P.g.position.y = Math.sin(t * 1.5) * 0.05; P.g.rotation.z = Math.sin(t * 0.9) * 0.03 }
        cutter.update()
      },
    }
  },
})
</script>
</body></html>
