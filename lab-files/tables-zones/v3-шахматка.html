<!doctype html>
<html lang="ru"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>v3 · Шахматка</title>
<link rel="stylesheet" href="_tm.css" />
<style>
/* v3 — шахматка «команда × команда» (A → C 17.11 п. 3, 5; дирижёр: «ни один не похож на шахматку», скрин начальника): Universe Ep. 7, группы «каждый с каждым», в клетке счёт. Собрана из частей общей таблицы. История «Общие/Таблица/Зоны · Шахматка» (Storybook :6007). */
.v2 iframe{display:block;width:100%;border:0;background:var(--w-page)}
.v2 section{display:flex;flex-direction:column;gap:10px}
.v2 p{margin:0;max-width:760px;color:var(--w-muted-fg);font:400 13px/19px var(--w-font)}
.v2-sw{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.v2-sw b{min-width:64px;font:500 12px/16px var(--w-font);color:var(--w-muted-fg)}
.v2-sw button{all:unset;cursor:pointer;padding:6px 12px;border-radius:8px;background:var(--w-mid-bg);font:500 13px/18px var(--w-font);color:var(--w-fg)}
.v2-sw button.on{background:var(--w-violet);color:#fff}
</style></head>
<body><main class="tm-page v2"><div class="tm-main"><section>
  <p>Universe Ep. 7 — группы «каждый с каждым», в клетке — счёт команды строки против команды колонки. Первые двое выходят — зона, как в v2. Переключайте вид клетки, черту и группу.</p>
  <div class="v2-sw" data-k="look"><b>Клетка</b><button data-v="fill" class="on">Плитка (как у начальника)</button><button data-v="pill">Плашка</button><button data-v="text">Только цвет цифр</button></div>
  <div class="v2-sw" data-k="zone"><b>Черта</b><button data-v="line" class="on">Линия</button><button data-v="thick">Толстая</button><button data-v="dash">Пунктир</button><button data-v="dots">Точки</button><button data-v="label">Подпись поверх линии</button><button data-v="none">Без черты</button></div>
  <div class="v2-sw" data-k="group"><b>Группа</b><button data-v="0" class="on">A</button><button data-v="1">B</button></div>
  <div class="v2-sw" data-k="dev"><b>Экран</b><button data-v="desk" class="on">Компьютер</button><button data-v="phone">Телефон</button></div>
  <iframe id="f" style="height:720px"></iframe>
</section></div></main>
<script>
const st={look:'fill',zone:'line',group:'0',dev:'desk'}
const f=document.getElementById('f')
function go(){const a=['look:'+st.look,'zoneLook:'+st.zone,'group:'+st.group];if(st.dev==='phone')a.push('narrow:!true')
 f.style.maxWidth=st.dev==='phone'?'420px':'';f.style.height='420px'
 f.src='../_stories/story.html?id=%D0%BE%D0%B1%D1%89%D0%B8%D0%B5-%D1%82%D0%B0%D0%B1%D0%BB%D0%B8%D1%86%D0%B0-%D0%B7%D0%BE%D0%BD%D1%8B--%D1%88%D0%B0%D1%85%D0%BC%D0%B0%D1%82%D0%BA%D0%B0&viewMode=story&args='+a.join(';')}
document.querySelectorAll('.v2-sw').forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));st[g.dataset.k]=b.dataset.v;go()}))
go()
</script>
</body></html>
