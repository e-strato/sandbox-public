<!-- v23-social — как v37, но кнопки сообщества (w-social v34, дирижёр 27.10: «34 норм, переносим в продукт»): телефон — остров вынесен из бара, рядом три круглые стеклянные кнопки ♡ / 💬 / поделиться, под баром матовое стекло, у бара своей подложки нет, листаешь вниз — бар уезжает, кнопки остаются; остров и 💬 открывают панель «Событие / Обсуждение»; компьютер — колонка кнопок слева от главной.
     v22-own — как v36, но в правой колонке только наши виджеты — без карточки «Ты в матче» (MVP, «Кто победит») (дирижёр 27.10: «эти баннеры не нужны, нужны только те, которые мы собирали»).
     v21-icons — как v35, но в острове значок и одно слово (w-barst v3, дирижёр 27.10: «v3 · Значок и слово — супер»): событие — «Рошан», «Убит», «Башня» и таймер (последние 10 с — красным); пауза, счёт скрыт, нет данных, перенос, отмена, «уточняется» — каждое своим значком; остров 176.
     v20-logos — как v34, но остров — логотипы команд (w-island v3, дирижёр 27.10: «возьмём V3»): итог — лого 2 : 1 лого, идёт — время и лого того, кто впереди; кнопки бара — рисованные значки с подписями.
     v19-split — как v33, но два подписанных блока: «Карта N» — сегмент карт, график, драфт; «О матче» — игроки и статистика к матчу; от 1920 — рядом (слева карта, справа матч), уже — друг под другом (gs-res v5, дирижёр 27.10: «V5 норм»).
     v18-draft — как v32, но драфт карты — карточкой под графиком в стиле Cyberscore: обе команды рядом, 5 героев с никами, баны перечёркнутыми; вкладки «Драфт» у графика нет (w-draft v21, дирижёр 27.10: «давай возьмём как в Cyberscore»).
     v17-island — как v31, но нижний бар на телефоне прячется, пока листаешь вниз: кнопки гаснут, остров остаётся (w-bar v14, дирижёр 27.10: «V14 берём»).
     v16-live — как v30, но Live — без паузы (в «сейчас» 33:30 пауза не идёт), а «Live · пауза» — отдельное состояние в панели (дирижёр 27.10: «заебала эта плашка, сделай её доп состоянием»).
     gs-gold v15 — как v14, но страница матча v30 (дирижёр 27.10).
     gs-gold v14 — как v13, но страница матча v29: шапка сжимается вслед за прокруткой (дирижёр 27.10).
     gs-gold v13 — как v12, но страница матча v28: «Статистика к матчу» вместо фактов и очных (дирижёр 26.10).
     gs-gold v12 — как v11, но страница матча v27: от 1920 главная колонка делится пополам (дирижёр 27.10).
     gs-gold v11 — как v10, но страница матча v26: карты матча — в главной колонке (дирижёр 27.10).
     gs-gold v10 — как v9, но страница матча v25: карты матча под шапкой — виджет из лабы w-maps (дирижёр 26.10).
     gs-gold v9 — как v8, но страница матча v24: шапка матча без вкладок (дирижёр 26.10).
     gs-gold v8 — как v7, но страница матча v23: остров нижнего бара — виджет из лабы w-bar (дирижёр 26.10).
     
     gs-gold v7 — как v6, но страница матча v22: шапка матча — виджет из лабы w-header (дирижёр 26.10).
      gs-gold v6 — как v5, но страница матча v21: «Перевес по золоту» и «Игроки» — виджеты из лаб w-gold и w-players (дирижёр 26.10).
      gs-gold v5 — как v4, но в «Виджет» есть и шапка сайта (дирижёр 26.10).
     v4 — как v3, но страница матча v20: на компьютере без «ушей», поля 32 (дирижёр 26.10).
     v3 — вся страница матча (gs-match v19), выделен один виджет: он на своём месте и обычный, остальное затемнено (дирижёр 26.10).
     Какой — «Виджет» в панели: все виджеты страницы (шапка, главная колонка, правая), список — тот же, что у «Подписей виджетов». Обвязка — ../gs-gold/_gold.js.
     v2-focus — только «Перевес по золоту» (_old). Пути — от gs-match (<base>).
     v19-widgets — как v18, но всё на странице — виджеты трёх мест: во всю ширину (шапка матча с вкладками), главная колонка, правая. Ничего не висит само по себе:
     плашка паузы — внутри шапки, «последняя карта…» — ссылкой низом виджета графика, «Все новости / Вся статистика» — низом своего виджета.
     На телефоне: шапка → главная колонка → правая (на любой вкладке). Переключатель «Подписи виджетов» в панели — место и название над каждым.
     v18-mid — как v17, на телефоне шапка матча одного среднего размера (между полной и сжатой), не сжимается при прокрутке, полные названия всегда.
     v17-full — как v16, на телефоне виджеты (турнир, замены, трансферы, MVP) — во всю ширину, как остальные карточки.
     v16-smooth — как v15, на телефоне в шапке нет пилюль килов и строки турнира; при прокрутке вниз шапка плавно сжимается (логотипы и счёт меньше, названия уходят).
     v15-widgets — как v14, на телефоне виджеты правой колонки (турнир, замены — вошедшему, трансферы, MVP) — под контентом вкладки.
     v14-shrink — как v13, на телефоне шапка матча ужимается при прокрутке вниз (логотипы, короткие названия, счёт, статус) и раскрывается при прокрутке вверх.
     v13-sticky — как v12, вкладки матча прилипают к верху под шапкой матча, пока листаешь.
     v12-tabs — как v11, без вкладок «Турнир» и «Очные».
     v11-cards — как v10, но график, записи карт и драфт — отдельными карточками; переключатель — только в live.
     v8-now — «Обзор» — самое интересное сейчас (в live — идущая карта: график, трансляция, драфт, игроки), новости, очные, турнир, статистика — своими вкладками; угадайки одним блоком с «Ты в матче» справа.
     v7-series — как v6, но «Обзор» — вся серия без разбора одной карты (серия по картам с мини-графиками, трансляция, игроки за серию), разбор карты — только во вкладке «Карты».
     v6-overview — как v5, но вкладки матча — над главной колонкой; «Обзор» — матч сейчас (идущая или последняя карта, без чипов), разбор по картам — во вкладке «Карты», события — вкладкой «События».
     v5-gold — страница матча, шапка «Перевес по золоту» (под Доту, от «столбиком»): под счётом — полоса перевеса: кто впереди на карте и на сколько золота, ниже — слоты килов по картам. Иначе — копия v4-typical:
     v4-typical — по типовым сайтам (Cyberscore, DLTV — Figma, снимки 06.10): шапка матча со счётом в два уровня (серия · карта, время, килы),
     под ней вкладки матча, в центре график, таблица игроков и сыгранные карты, справа виджеты. Код — _gs.js (window.GS_LAYOUT = v4) -->
