<!doctype html>
<html lang="ru"><head>
<!-- fonts v4 (дирижёр 18.11 по v3: «Geist выглядит хорошо — сделать без багов»). Только Geist Mono в цифрах и плашках. Баг v3: плашка счёта («2:1») шире ячейки на 5 px, ячейка
     обрезала правый край — теперь плашка не обрезается, поля 5 px, текст по центру; заголовки колонок таблиц — обычным шрифтом (в v3 тоже ушли в моно). Заголовки виджетов — как сейчас / Oswald. -->
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Шрифты — Geist Mono</title>
<style>
:root{ --bg:#F2F2F7; --card:#fff; --tx:#000; --tx2:rgba(60,60,67,.6); --ac:#AF52DE; --chip:#E5E5EA; }
:root[data-theme="dark"]{ --bg:#000; --card:#1C1C1E; --tx:#fff; --tx2:rgba(235,235,245,.6); --ac:#BF5AF2; --chip:#2C2C2E; }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--tx); font:400 15px/1.45 "SF Pro Rounded", ui-rounded, -apple-system, system-ui, sans-serif; }
.wrap{ max-width:1440px; margin:0 auto; padding:28px 24px 96px; }
.top{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
h1{ margin:0 0 6px; font-size:26px; font-weight:700; }
.sub{ margin:0; color:var(--tx2); max-width:900px; }
.th{ flex:none; height:32px; padding:0 12px; border:0; border-radius:8px; background:var(--chip); color:var(--tx); font:inherit; font-size:13px; cursor:pointer; }
.bar{ position:sticky; top:0; z-index:3; background:var(--bg); padding:14px 0 10px; display:flex; gap:10px; align-items:stretch; flex-wrap:wrap; }
.v{ flex:1 1 120px; text-align:left; border:2px solid transparent; border-radius:12px; background:var(--card); color:var(--tx); padding:10px 12px; font:inherit; cursor:pointer; }
.v.on{ border-color:var(--ac); }
.v b{ display:block; font-size:15px; } .v small{ display:block; font-size:12px; color:var(--tx2); }
.v kbd{ float:right; font:600 11px/1 ui-monospace, monospace; color:var(--tx2); background:var(--chip); padding:3px 5px; border-radius:4px; }
.grp{ display:flex; gap:8px; flex:1 1 100%; align-items:stretch; flex-wrap:wrap; }
.grp > span{ flex:none; width:84px; align-self:center; font-weight:600; font-size:13px; color:var(--tx2); }
.pick{ flex:none; align-self:center; height:40px; padding:0 16px; border:0; border-radius:10px; background:var(--tx); color:var(--bg); font:600 14px/1 inherit; font-family:inherit; cursor:pointer; }
.blk{ margin-top:22px; }
.blk h3{ margin:0 0 6px; font-size:15px; } .blk h3 small{ font-weight:400; color:var(--tx2); font-size:13px; margin-left:6px; }
figure{ margin:0; background:#09090b; border-radius:12px; padding:8px; }
figure img{ display:block; max-width:100%; height:auto; margin:0 auto; border-radius:6px; }
.cp{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--tx); color:var(--bg); padding:8px 14px; border-radius:10px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; }
.cp.on{ opacity:1; }
@media (max-width:760px){ .wrap{ padding:20px 16px 64px; } }
</style>
</head><body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Цифры — Geist Mono, без багов</h1>
      <p class="sub">Цифры и маленькие плашки — Geist Mono. Исправлено: плашка счёта («2:1») обрезалась справа — теперь целая, с полями и текст по центру; заголовки колонок таблиц — снова обычным шрифтом. Заголовки виджетов — переключатель: как сейчас / Oswald (Q / E).</p>
    </div>
    <button class="th" id="th">Тёмная</button>
  </div>
  <div class="bar" id="bar"></div>
  <div id="blocks"></div>
</div>
<div class="cp" id="cp">Скопировано</div>
<script>
const NUMS = [
  { k: 'geist', n: 'Geist Mono', d: 'цифры и плашки, без обрезки', key: '1' },
]
const HEADS = [
  { k: 'h0', n: 'Заголовки как сейчас', d: 'Google Sans', key: 'q' },
  { k: 'h2', n: 'Oswald', d: 'узкий, как Bebas, с кириллицей', key: 'e' },
]
const BLOCKS = [
  ['thd', 'Шапка турнира', 'турнир движка · TI 2026'],
  ['group', 'Групповой этап', 'турнир движка · общая таблица'],
  ['heroes', 'Статистика героев', 'турнир движка · общая таблица'],
  ['mhead', 'Шапка матча', 'матч · Live'],
  ['teams', 'Блок команд', 'матч · Live — золото, перевес, счёт, K/D/A'],
  ['about', '«О матче»', 'матч · до матча — шансы крупно, плитки'],
  ['draft', 'Шанс по драфту', 'матч · пики готовы'],
]
let num = 'geist', head = 'h0'
try { num = localStorage.getItem('fn4-n') || 'geist'; head = localStorage.getItem('fn4-h') || 'h0' } catch {}
const btn = (x, on, attr) => `<button class="v${on ? ' on' : ''}" ${attr}="${x.k}"><kbd>${x.key.toUpperCase()}</kbd><b>${x.n}</b><small>${x.d}</small></button>`
function render() {
  document.getElementById('bar').innerHTML = '<div class="grp"><span>Цифры</span>' + NUMS.map((x) => btn(x, num === x.k, 'data-n')).join('') + '</div><div class="grp"><span>Заголовки</span>' + HEADS.map((x) => btn(x, head === x.k, 'data-h')).join('') + '<button class="pick" id="pick">Скопировать выбор</button></div>'
  document.getElementById('blocks').innerHTML = BLOCKS.map(([k, t, d]) => `<div class="blk"><h3>${t}<small>${d}</small></h3><figure><img src="img/v4/${k}-${num}-${head}.png" alt="${t}"></figure></div>`).join('')
  try { localStorage.setItem('fn4-n', num); localStorage.setItem('fn4-h', head) } catch {}
}
render()
const toast = (t) => { const c = document.getElementById('cp'); c.textContent = t; c.classList.add('on'); setTimeout(() => c.classList.remove('on'), 1400) }
document.addEventListener('click', (e) => {
  const n = e.target.closest('[data-n]'); if (n) { num = n.dataset.n; render(); return }
  const h = e.target.closest('[data-h]'); if (h) { head = h.dataset.h; render(); return }
  if (e.target.id === 'pick') { const t = `Шрифты (fonts v4): цифры — ${NUMS.find((x) => x.k === num).n}; заголовки — ${HEADS.find((x) => x.k === head).n}`; navigator.clipboard?.writeText(t).then(() => toast('Скопировано'), () => toast(t)) }
})
addEventListener('keydown', (e) => { const k = e.key.toLowerCase(); const n = NUMS.find((x) => x.key === k), h = HEADS.find((x) => x.key === k); if (n) num = n.k; if (h) head = h.k; if (n || h) render() })
NUMS.forEach((n) => HEADS.forEach((h) => BLOCKS.forEach(([k]) => { new Image().src = `img/v4/${k}-${n.k}-${h.k}.png` })))
const th = document.getElementById('th')
const setTh = (d) => { document.documentElement.dataset.theme = d ? 'dark' : 'light'; th.textContent = d ? 'Светлая' : 'Тёмная'; try { localStorage.setItem('sc-th', d ? '1' : '') } catch {} }
let dark = false; try { dark = !!localStorage.getItem('sc-th') } catch {}
setTh(dark); th.onclick = () => { dark = !dark; setTh(dark) }
</script>
</body></html>
