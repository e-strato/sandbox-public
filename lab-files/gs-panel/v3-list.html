<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>v3 · Список с точками</title><link rel="stylesheet" href="_p.css">
<style>
.g{ margin:10px 0 2px; font-size:11px; color:#7a7a7a; } .g:first-child{ margin-top:0; }
.r{ width:100%; height:26px; display:flex; align-items:center; gap:8px; padding:0 8px; border-radius:6px; text-align:left; color:#d4d4d4; }
.r:hover{ background:#303030; } .r.on{ background:#4c3d7a; color:#fff; }
.r.sub{ padding-left:22px; font-size:12px; color:#a3a3a3; } .r.sub.on{ color:#fff; }
</style></head><body><script src="_p.js"></script><script>
const G = [['Режим', ['feed']], ['До матча', ['announce', 'pre', 'delayed']], ['Идёт', ['live', 'nodata', 'offline']], ['После', ['post', 'cancel']]];
const SUB = { delayed: 1, nodata: 1, offline: 1, cancel: 1 };
P.mount(`<div class="lbl">Состояние матча</div><div id="w"></div>`, () => {
  document.querySelector('#w').innerHTML = G.map(([g, ks]) => `<div class="g">${g}</div>` + ks.map((x) => `<button data-k="${x}" class="r ${x === P.cur ? 'on' : ''} ${SUB[x] ? 'sub' : ''}"><span class="dot ${SUB[x] ? 'd-bad' : 'd-' + P.S[x][1]}"></span>${P.S[x][0]}</button>`).join('')).join('');
  document.querySelectorAll('[data-k]').forEach((b) => b.onclick = () => P.set(b.dataset.k));
}, `<p>Все 9 состояний видны сразу, плотным списком по 26 px, сгруппированы по этапам. Особые случаи — мельче, с отступом.</p>
<ul><li>Один клик, ничего не надо открывать.</li><li>Минус: ~290 px высоты — съедает панель.</li></ul>`);
</script></body></html>
