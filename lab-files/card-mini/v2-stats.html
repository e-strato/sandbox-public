<!doctype html>
<html lang="ru"><head><meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&family=Archivo:wdth,wght@62..125,700..900&display=swap" />
<link rel="stylesheet" href="/sandbox-public/site/styles.css" /><link rel="stylesheet" href="../кадр.css" /><link rel="stylesheet" href="../карточка-v3/_v3.css" /><link rel="stylesheet" href="_mini.css" />
<style>
/* v2 · С тремя статами — для маркета и выбора в пятёрку: внизу три сильнейших стата игрока, чтобы сравнивать карты, не открывая их.
   Логотип и позиция — язычком сверху слева (горизонтально), рейтинг — в углу, ник над статами. Форма 5:7, 1em = ширина / 16 */
.m2 { aspect-ratio: 5 / 7; --shape: polygon(1.4em 0, 100% 0, 100% calc(100% - 1.9em), calc(100% - 1.9em) 100%, 0 100%, 0 1.4em); --r: 0; }
.m2 .mk-logo { left: 2em; top: 2.2em; width: 12em; height: 10em; }
.m2 .mk-halo { left: 2em; top: .4em; width: 12em; height: 10em; }
.m2 .ph { left: .6em; top: 2.2em; width: 14.2em; -webkit-mask: linear-gradient(180deg, var(--c-black) 55%, transparent 72%); mask: linear-gradient(180deg, var(--c-black) 55%, transparent 72%); }
.m2__tab { position: absolute; left: 1.4em; top: 0; z-index: 9; display: flex; align-items: center; gap: .4em; height: 2em; padding: 0 1.2em 0 .6em; font-size: 1em; font-weight: 800; white-space: nowrap;
  clip-path: polygon(0 0, 100% 0, calc(100% - .7em) 100%, .1em 100%); background: linear-gradient(180deg, color-mix(in srgb, var(--tier) 34%, var(--c-card-ink)), var(--c-card-ink)); }
.m2__tab .logo { width: 1.25em; height: 1.25em; }
.m2__tab b { color: var(--tier-hi); font-weight: 900; }
.m2__ovr { position: absolute; right: 0; top: 0; z-index: 9; display: grid; place-content: center; width: 5em; height: 4em; padding-left: .4em;
  clip-path: polygon(0 0, 100% 0, 100% 100%, 1.1em 100%, 0 calc(100% - 1.1em)); background: linear-gradient(200deg, color-mix(in srgb, var(--tier) 30%, var(--c-card-ink)), var(--c-card-ink)); }
.m2__ovr b { font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 2.5em; line-height: 1; letter-spacing: -.04em; color: var(--c-white); }
/* Плашка данных со ступенькой справа — как зигзаг у полной карты */
.m2__panel { position: absolute; left: 0; right: 0; bottom: 0; height: 8.6em; z-index: 4;
  clip-path: polygon(0 1.3em, 6.6em 1.3em, 7.9em 0, 100% 0, 100% 100%, 0 100%);
  background: linear-gradient(180deg, color-mix(in srgb, var(--tier-2) 55%, var(--c-card-ink)), var(--c-card-ink)); }
.m2__nick { position: absolute; left: .5em; right: .5em; bottom: 2.05em; /* в своих em (кегль 1.85): 3.8 em карты */ z-index: 7; font-family: 'Archivo', sans-serif; font-stretch: 108%; font-weight: 900; font-size: 1.85em; line-height: .95;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m2__stats { position: absolute; left: 1em; right: 2em; bottom: 1.1em; z-index: 7; display: grid; grid-template-columns: repeat(3, 1fr); gap: .3em; }
.m2__stats span { display: grid; justify-items: center; padding: .3em 0 .25em; background: color-mix(in srgb, var(--c-white) 6%, transparent);
  clip-path: polygon(.35em 0, 100% 0, 100% calc(100% - .35em), calc(100% - .35em) 100%, 0 100%, 0 .35em); }
.m2__stats b { font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 1.5em; line-height: 1; }
.m2__stats small { font-size: .82em; font-weight: 700; color: var(--c-muted); }
</style></head>
<body><section class="section v3">
  <div class="sec-head"><h2 class="sec-title">v2 · С тремя статами</h2>
    <p class="sec-lead">Для маркета и выбора в пятёрку: внизу три сильнейших стата игрока — карты сравниваются, не открывая их. Логотип и позиция — язычком сверху слева, рейтинг в углу, ник над статами.</p></div>
  <div id="mini"></div>
</section>
<script src="../карточка-v3/_v3.js"></script><script src="_mini.js"></script>
<script>
// Три сильнейших стата — в порядке силы
const лучшие = (п, h) => h.статы(п).slice().sort((a, b) => b.v - a.v).slice(0, 3)
MINI.страница({
  класс: 'm2',
  лицо: (п, r, h) => `
<div class="mk-plate">
  ${h.маска(п, 'mk-logo')}${h.маска(п, 'mk-logo mk-logo--a').replace('<i ', '<i data-deco="2" ')}${h.маска(п, 'mk-logo mk-logo--b').replace('<i ', '<i data-deco="2" ')}
  <i class="mk-pix" data-deco="1"></i><i class="mk-halo"></i>${h.фото(п)}<i class="mk-scan" data-deco="3"></i>
  <div class="m2__panel"></div>${h.блеск(r)}
</div>
<svg class="mk-frame" viewBox="0 0 160 224" preserveAspectRatio="none" aria-hidden="true"><polygon points="14,1 159,1 159,205 140,223 1,223 1,14" /></svg>
<div class="m2__tab">${h.лого(п)}<span>${п.команда.toUpperCase()} · <b>P${п.pos}</b></span></div>
<div class="m2__ovr"><b>${п.рейтинг}</b></div>
<div class="m2__nick">${п.ник}</div>
<div class="m2__stats">${лучшие(п, h).map((с) => `<span><b data-v="${с.ур}">${с.v}</b><small>${с.к}</small></span>`).join('')}</div>`,
})
</script>
</body></html>
