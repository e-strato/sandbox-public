<!doctype html>
<html lang="ru"><head><meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&family=Archivo:wdth,wght@62..125,700..900&display=swap" />
<link rel="stylesheet" href="/sandbox-public/site/styles.css" /><link rel="stylesheet" href="../кадр.css" /><link rel="stylesheet" href="_v3.css" />
<style>
/* v1 · Хайперглитч — по карте Sorare «Hyperglitch» (Figma «Fantasy», узел 47-424): срезанные углы, язычок с логотипом,
   пиксельный глитч в цвете силы, плашка данных снизу. Правки 01.10: шрифт имени ровный (Inter), обводка на скосах у оборота,
   команда — бейджем снизу по центру, оборот свой. Шрифты: Archivo — ник и цифры, Inter — остальное */
.g1 { --r: 0; --shape: polygon(1.8em 0, 100% 0, 100% calc(100% - 2.4em), calc(100% - 2.4em) 100%, 0 100%, 0 1.8em);
  --f-disp: 'Archivo'; --f-ui: 'Inter'; }
.g1__face { position: absolute; inset: 0; }
.g1__plate { position: absolute; inset: 0; clip-path: var(--shape); background: var(--c-card-ink-2); overflow: hidden; }

/* 2 Фон: тёмный цвет силы, пиксельные полосы, логотип команды крупно (сдвиг каналов — с Prism) */
.g1__bg { position: absolute; inset: 0;
  background:
    radial-gradient(70% 40% at 50% 22%, color-mix(in srgb, var(--tier) 22%, transparent), transparent 75%),
    repeating-linear-gradient(0deg, transparent 0 .5em, color-mix(in srgb, var(--tier) 6%, transparent) .5em .56em),
    linear-gradient(180deg, color-mix(in srgb, var(--tier-2) 75%, var(--c-card-ink)), var(--c-card-ink) 85%); }
.g1__logo { left: 2.5em; top: 1.8em; width: 17em; height: 15em; background: color-mix(in srgb, var(--tier) 26%, transparent); }
.g1__logo--a, .g1__logo--b { mix-blend-mode: screen; opacity: .45; animation: g1-jit 3.6s steps(1) infinite; }
.g1__logo--a { background: var(--c-glitch-a); translate: -.35em 0; }
.g1__logo--b { background: var(--c-glitch-b); translate: .35em 0; animation-delay: -1.8s; }
/* Пиксельные блоки — как на Hyperglitch: прямоугольники цвета силы, мигают ступенями */
.g1__pix { position: absolute; inset: 0; opacity: .55; mix-blend-mode: screen; animation: g1-pix 2.4s steps(1) infinite;
  background:
    linear-gradient(color-mix(in srgb, var(--tier) 40%, transparent) 0 0) 6% 14% / 4.2em .5em no-repeat,
    linear-gradient(color-mix(in srgb, var(--tier-hi) 30%, transparent) 0 0) 92% 22% / 6em .3em no-repeat,
    linear-gradient(color-mix(in srgb, var(--c-glitch-a) 30%, transparent) 0 0) 14% 38% / 2.4em .9em no-repeat,
    linear-gradient(color-mix(in srgb, var(--tier) 35%, transparent) 0 0) 88% 46% / 3.4em .4em no-repeat,
    linear-gradient(color-mix(in srgb, var(--c-glitch-b) 26%, transparent) 0 0) 4% 30% / 7em .25em no-repeat,
    linear-gradient(color-mix(in srgb, var(--tier-hi) 22%, transparent) 0 0) 70% 8% / 2em 1.1em no-repeat; }
@keyframes g1-pix { 0% { translate: 0 0; } 30% { translate: 1.2em 0; } 55% { translate: -.6em .4em; } 80% { translate: .4em -.3em; } }
@keyframes g1-jit { 0%, 86%, 100% { translate: -.35em 0; } 88% { translate: -.9em .2em; } 92% { translate: .3em 0; } }

/* 3 Рамка: линия по контуру формы (svg — чтобы обводка шла и по скосам) + язычок слева под логотип */
/* Заход 4 (01.10): кант лежит поверх язычков и плашек — граница карты не рвётся; внутренняя линия убрана */
.g1__frame { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 12; fill: none; }
.g1__frame .out { stroke: var(--tier); stroke-width: 1.6; }
.g1__tab { position: absolute; left: 0; top: 2.6em; width: 2.6em; height: 13.6em; z-index: 9; display: flex; flex-direction: column; align-items: center; gap: .7em;
  padding-top: 1.3em; clip-path: polygon(0 0, 100% .8em, 100% calc(100% - .8em), 0 100%);
  background: linear-gradient(180deg, color-mix(in srgb, var(--tier) 30%, var(--c-card-ink)), var(--c-card-ink)); }
.g1__tab .logo { width: 1.7em; height: 1.7em; }
.g1__tab hr { width: 1.2em; margin: 0; border: 0; border-top: .08em solid color-mix(in srgb, var(--tier) 50%, transparent); }

/* 4 Эффекты: блеск редкости, глитч-полосы поверх фото (Prism+), скан-луч (Legend) */
.g1__slices { position: absolute; inset: 0; z-index: 3; mix-blend-mode: overlay; animation: g1-pix 1.8s steps(1) infinite reverse;
  background:
    linear-gradient(color-mix(in srgb, var(--c-glitch-b) 60%, transparent) 0 0) 0 26% / 100% .35em no-repeat,
    linear-gradient(color-mix(in srgb, var(--c-glitch-a) 50%, transparent) 0 0) 0 41% / 60% .2em no-repeat,
    linear-gradient(color-mix(in srgb, var(--c-white) 40%, transparent) 0 0) 100% 48% / 40% .5em no-repeat; }
.g1__scan { position: absolute; left: 0; right: 0; height: 3em; top: var(--scan); z-index: 3; mix-blend-mode: screen;
  background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--tier-hi) 35%, transparent) 48%, var(--tier-hi) 50%, transparent 52%);
  animation: scan 4.5s linear infinite; }

/* 5 Фото: туловище срезано плашкой, свечение за головой */
.g1__halo { position: absolute; left: 2em; top: -.6em; width: 15.6em; height: 13em; z-index: 1; border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--tier-hi) 60%, transparent), color-mix(in srgb, var(--tier) 25%, transparent) 55%, transparent); filter: blur(.4em); }
.g1 .ph { left: .9em; top: 1.3em; width: 17em; z-index: 2;
  -webkit-mask: linear-gradient(180deg, var(--c-black) 62%, transparent 82%); mask: linear-gradient(180deg, var(--c-black) 62%, transparent 82%); }

/* 6 Игрок: ник Archivo, ниже флаг и настоящее имя ровным Inter */
.g1__who { position: absolute; left: 1.4em; right: 2em; top: 20.2em; z-index: 6; }
.g1__nick { font-family: 'Archivo', sans-serif; font-stretch: 112%; font-weight: 900; font-size: 2.7em; line-height: .92; letter-spacing: -.01em; }
.g1__name { display: flex; align-items: center; gap: .5em; margin-top: .45em; font-size: .9em; font-weight: 600; color: var(--tier-hi); }

/* 7 Раскладка: рейтинг в правом верхнем углу, под ним три героя «в воздухе»; номер карты — в язычке слева */
/* Рейтинг — прижат к правому верхнему углу, срез снизу слева (правка 01.10) */
.g1__ovr { position: absolute; right: 0; top: 0; z-index: 9; display: grid; place-content: center; width: 6.6em; height: 5em; padding-left: .5em;
  clip-path: polygon(0 0, 100% 0, 100% 100%, 1.4em 100%, 0 calc(100% - 1.4em));
  background: linear-gradient(200deg, color-mix(in srgb, var(--tier) 30%, var(--c-card-ink)), var(--c-card-ink)); }
.g1__ovr b { font-family: 'Archivo', sans-serif; font-stretch: 100%; font-weight: 900; font-size: 3.5em; line-height: 1; letter-spacing: -.04em; color: var(--c-white); }
.g1__heroes { position: absolute; right: 1.15em; top: 6.3em; z-index: 7; display: grid; gap: .4em; }
.g1__heroes div { display: grid; justify-items: center; gap: .2em; }
.g1__heroes .hero-ic { width: 2.7em; aspect-ratio: 1; clip-path: polygon(.5em 0, 100% 0, 100% calc(100% - .5em), calc(100% - .5em) 100%, 0 100%, 0 .5em); }
.g1__heroes small { font-size: .52em; font-weight: 600; line-height: 1.25; text-align: center; color: var(--c-muted); }
.g1__heroes small b { font-family: 'Archivo', sans-serif; font-weight: 800; color: var(--c-white); }
/* Номер карты — внутри язычка, под логотипом: крупнее и в цвете силы (правка 01.10: «номер — важная информация») */
.g1__serial { writing-mode: vertical-rl; rotate: 180deg; display: flex; align-items: center; gap: .6em; white-space: nowrap; }
.g1__serial b { font-family: 'Archivo', sans-serif; font-stretch: 100%; font-size: .9em; font-weight: 900; color: var(--tier-hi); }
.g1__serial small { font-size: .56em; font-weight: 600; color: var(--c-muted); }

/* 8 Инфо: плашка данных снизу — роль по центру на стыке с фото, статы, команда бейджем */
/* Плашка данных: слева выступ — в нём позиция и роль (правка 01.10: роль вписана в область, как зигзаг отделения фото от текста) */
.g1__panel { position: absolute; left: 0; right: 0; bottom: 0; height: 13.4em; z-index: 4;
  clip-path: polygon(0 0, 12.8em 0, 15em 2.2em, 100% 2.2em, 100% 100%, 0 100%);
  background: linear-gradient(180deg, color-mix(in srgb, var(--tier-2) 55%, var(--c-card-ink)), var(--c-card-ink)); }
.g1__role { position: absolute; left: 1.47em; top: 18.85em; /* в своих em (кегль .95): 1.4 и 17.9em карты */ z-index: 7; white-space: nowrap; font-size: .95em; font-weight: 700; }
.g1__role b { font-weight: 900; color: var(--tier-hi); }
.g1__stats { position: absolute; left: 1.4em; right: 1.4em; top: 24.9em; z-index: 6; display: grid; grid-template-columns: repeat(6, 1fr); text-align: center;
  border-top: .06em solid color-mix(in srgb, var(--c-white) 12%, transparent); padding-top: .6em; }
.g1__stats b { display: block; font-family: 'Archivo', sans-serif; font-stretch: 100%; font-size: 1.2em; font-weight: 900; line-height: 1.05; }
.g1__stats small { display: block; font-size: .46em; font-weight: 600; color: var(--c-muted); }
/* Команда — язычком у нижнего края, как язычок с логотипом слева (правка 01.10) */
.g1__team { position: absolute; left: 50%; bottom: 0; translate: -50% 0; z-index: 9; display: flex; align-items: center; gap: .5em; white-space: nowrap;
  padding: .5em 1.7em .55em; font-size: .72em; font-weight: 800;
  clip-path: polygon(.9em 0, calc(100% - .9em) 0, 100% 100%, 0 100%);
  background: linear-gradient(0deg, color-mix(in srgb, var(--tier) 30%, var(--c-card-ink)), var(--c-card-ink)); }
.g1__team .logo { width: 1.7em; height: 1.7em; }

/* 9 Оборот: лист данных Sorare — та же форма и обводка, статы строками, герои в ряд, форма пикселями */
.g1 .bk { box-shadow: none; padding: 1.6em 1.5em 1.4em 2.2em; gap: .7em;
  background:
    repeating-linear-gradient(0deg, transparent 0 .5em, color-mix(in srgb, var(--tier) 5%, transparent) .5em .56em),
    linear-gradient(180deg, color-mix(in srgb, var(--tier-2) 65%, var(--c-card-ink)), var(--c-card-ink) 75%); }
.g1 .bk__top b, .g1 .bk__top em { font-family: 'Archivo', sans-serif; font-weight: 900; }
.g1 .bk__top em { color: var(--c-white); }
.g1 .bk__stats { grid-template-columns: 1fr; gap: .3em; }
.g1 .bk__stats li { grid-template-columns: 6em 1fr 2em; align-items: center; gap: .6em; font-size: .72em; }
.g1 .bk__stats b { order: 3; text-align: right; font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 1.15em; }
.g1 .bk__stats i { grid-column: auto; height: .45em; border-radius: 0; }
.g1 .bk__stats i::after { border-radius: 0; }
.g1 .bk__heroes { grid-template-columns: repeat(3, 1fr); gap: .5em; }
.g1 .bk__heroes li { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: .25em; }
.g1 .bk__heroes .hero-ic { width: 100%; border-radius: 0; clip-path: polygon(.5em 0, 100% 0, 100% calc(100% - .5em), calc(100% - .5em) 100%, 0 100%, 0 .5em); }
.g1 .bk__heroes em { font-family: 'Archivo', sans-serif; font-weight: 900; }
.g1 .bk__form li { border-radius: 0; }
.g1 .bk__btn { margin-right: 1em; border-radius: 0; clip-path: polygon(.6em 0, 100% 0, 100% calc(100% - .6em), calc(100% - .6em) 100%, 0 100%, 0 .6em); }
</style></head>
<body><section class="section v3">
  <div class="sec-head">
    <h2 class="sec-title">v1 · Хайперглитч</h2>
    <p class="sec-lead">По карте Sorare «Hyperglitch» из Figma. Срезанные углы и язычок с логотипом команды. Фон — пиксельный глитч в цвете силы, внизу плашка данных.
      Герои висят справа прямо в воздухе. Глитч растёт с редкостью: у Base его нет, у Legend есть сдвиг каналов и скан-луч.</p>
  </div>
  <div id="v3"></div>
</section>
<script src="_v3.js"></script>
<script>
// Контур формы — одна рамка на лицо и оборот: обводка идёт и по скосам
const РАМКА = `<svg class="g1__frame" data-l="3" viewBox="0 0 220 308" preserveAspectRatio="none" aria-hidden="true">
  <polygon class="out" points="18,1 219,1 219,284 196,307 1,307 1,18" />
</svg>`
V3.страница({
  класс: 'g1',
  иерархия: [
    'Срезанные углы: малый слева сверху, большой справа снизу.',
    'Тёмный цвет силы, пиксельные полосы, логотип команды крупно за игроком. С Holo появляются пиксельные блоки, с Prism — сдвиг каналов логотипа.',
    'Кант цвета силы по всему контуру, со скосами; он лежит поверх язычков и не рвётся. Слева язычок под логотип и номер карты, в правом верхнем углу — плашка рейтинга, внизу — язычок команды.',
    'Блеск редкости. С Prism — глитч-полосы поверх фото, у Legend ещё и скан-луч сверху вниз.',
    'Туловище срезано плашкой данных, за головой свечение.',
    'Ник крупно (Archivo), ниже флаг и настоящее имя ровным Inter.',
    'Рейтинг в плашке, прижатой к правому верхнему углу. Под ним три героя прямо в воздухе: матчи и винрейт. Номер карты крупно в цвете силы и сезон — в язычке под логотипом.',
    'Плашка данных с выступом слева — в нём позиция и роль. Ниже статы, команда — язычком у нижнего края, как язычок с логотипом.',
    'Свой оборот — лист данных: та же форма и обводка, статы строками, герои в ряд, форма пикселями, кнопка «Страница игрока».',
  ],
  оборот: (п, r, h) => h.оборот(п, РАМКА),
  лицо: (п, r, h) => `
<div class="g1__face">
  <div class="g1__plate" data-l="1">
    <div class="g1__bg" data-l="2">
      ${h.маска(п, 'g1__logo')}
      ${h.маска(п, 'g1__logo g1__logo--a', 4).replace('<i ', '<i data-deco="2" ')}
      ${h.маска(п, 'g1__logo g1__logo--b', 4).replace('<i ', '<i data-deco="2" ')}
      <i class="g1__pix" data-l="4" data-deco="1"></i>
    </div>
    <i class="g1__halo" data-l="5"></i>
    ${h.фото(п)}
    <i class="g1__slices" data-l="4" data-deco="2"></i>
    <i class="g1__scan" data-l="4" data-deco="3"></i>
    <div class="g1__panel" data-l="8"></div>
    ${h.блеск(r)}
  </div>
  ${РАМКА}
  <div class="g1__tab" data-l="3"><span data-l="8">${h.лого(п)}</span><hr data-l="7" /><span class="g1__serial" data-l="7"><b>${h.серия(п)}</b><small>${h.СЕЗОН}</small></span></div>
  <div class="g1__ovr" data-l="7"><b>${п.рейтинг}</b></div>
  <div class="g1__heroes" data-l="7">${п.герои.map((г) => `<div>${h.герой(г)}<small><b>${г[2]} М</b><br>${г[3]}%</small></div>`).join('')}</div>
  <span class="g1__role" data-l="8"><b>Pos ${п.pos}</b> · ${h.РОЛИ[п.pos]}</span>
  <div class="g1__who" data-l="6"><div class="g1__nick">${п.ник}</div>${п.имя ? `<div class="g1__name">${h.флаг(п)}${п.имя}</div>` : ''}</div>
  <div class="g1__stats" data-l="8">${h.статы(п).map((с) => `<span><b data-v="${с.ур}">${с.v}</b><small>${с.к}</small></span>`).join('')}</div>
  <div class="g1__team" data-l="8">${h.лого(п)}${h.команда(п)}</div>
</div>`,
})
</script>
</body></html>
